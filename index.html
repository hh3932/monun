<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E5BD0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="모눈">
<title>모눈 시트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&family=Gowun+Dodum&family=Do+Hyeon&family=Black+Han+Sans&family=Nanum+Pen+Script&display=swap">
<style>
:root{
  --bg:#EDF0F4; --bar:#F7F8FA; --panel:#FFFFFF; --line:#D6DCE5; --ink:#1A2130; --muted:#626E82;
  --accent:#2E5BD0; --accent-ink:#FFFFFF; --accent-soft:rgba(46,91,208,.12); --hover:#E6EAF1;
  --head:#F2F4F7; --head-ink:#5B6576; --head-line:#D3D8E0; --head-sel:#DCE5FA; --head-sel-ink:#1E3F99;
  --sel:#2E5BD0; --warn:#B86A00; --shadow:0 10px 30px rgba(20,30,50,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12161D; --bar:#1A1F28; --panel:#222834; --line:#323A49; --ink:#E5E9F0; --muted:#98A2B4;
    --accent:#86A6FF; --accent-ink:#0E1626; --accent-soft:rgba(134,166,255,.16); --hover:#2A3242;
    --head:#1D232D; --head-ink:#9AA4B5; --head-line:#323A49; --head-sel:#2B3B60; --head-sel-ink:#D3DEFF;
    --sel:#3F6FE8; --warn:#F0B35A; --shadow:0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12161D; --bar:#1A1F28; --panel:#222834; --line:#323A49; --ink:#E5E9F0; --muted:#98A2B4;
  --accent:#86A6FF; --accent-ink:#0E1626; --accent-soft:rgba(134,166,255,.16); --hover:#2A3242;
  --head:#1D232D; --head-ink:#9AA4B5; --head-line:#323A49; --head-sel:#2B3B60; --head-sel-ink:#D3DEFF;
  --sel:#3F6FE8; --warn:#F0B35A; --shadow:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.4 "IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
button{font:inherit;color:inherit}

.titlebar{display:flex;align-items:center;gap:14px;padding:0 16px;min-height:46px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand svg{width:22px;height:22px}
.doc{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
#docName{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#saveState{font-size:12px;color:var(--muted);white-space:nowrap}
#saveState.dirty{color:var(--warn)}
#bkState{font-size:12px;color:var(--muted);white-space:nowrap}
#bkState:not(:empty)::before{content:"·";margin-right:10px}
.filebtns{display:flex;gap:2px;flex-wrap:wrap;padding-block:6px}
.fbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:0;border-radius:6px;background:none;cursor:pointer;white-space:nowrap}
.fbtn svg{width:17px;height:17px;flex:none}
.fbtn:hover{background:var(--hover)}
.fbtn.primary{background:var(--accent);color:var(--accent-ink)}
.fbtn.primary:hover{filter:brightness(1.07)}

.ribbon{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px;padding:6px 16px;background:var(--bar);border-bottom:1px solid var(--line)}
.grp{display:flex;align-items:center;gap:2px}
.sep{width:1px;height:22px;background:var(--line);margin:0 6px}
.tb{position:relative;display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 5px;border:0;border-radius:6px;background:none;cursor:pointer}
.tb svg{width:18px;height:18px}
.tb:hover{background:var(--hover)}
.tb.on{background:var(--accent-soft);color:var(--accent)}
.tb.caret{min-width:15px;padding:0;margin-left:-3px}
.tb.caret svg{width:11px;height:11px}
.tb.labeled{display:inline-flex;gap:5px;padding:0 8px 0 6px;font-size:12.5px;white-space:nowrap}
.tb .bar{position:absolute;left:7px;right:7px;bottom:4px;height:3px;border-radius:1px;box-shadow:0 0 0 .5px rgba(0,0,0,.25)}
.glyph{font-size:15px;line-height:1;font-family:Georgia,"Times New Roman",serif}
.ctl{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;padding:0 6px}
#fontSel{width:150px}
#sizeIn{width:60px;font-variant-numeric:tabular-nums}
.tb:focus-visible,.fbtn:focus-visible,.ctl:focus-visible,.tab:focus-visible,.mi:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.fxbar{display:flex;align-items:center;gap:8px;padding:5px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#nameBox{width:100px;font-family:"IBM Plex Mono",Consolas,monospace;text-align:center}
.fxlabel{font-size:11px;letter-spacing:.08em;color:var(--muted)}
#fx{flex:1;min-width:0}

.wrap{position:relative;flex:1;overflow:auto;background:#fff;outline:none;min-height:0}
.wrap.painting{cursor:copy}
#cv{position:sticky;left:0;top:0;display:block}
#spacer{position:absolute;left:0;top:0;pointer-events:none}
#ed{position:absolute;z-index:3;margin:0;border:0;outline:2px solid var(--sel);outline-offset:0;resize:none;overflow:hidden;padding:2px 4px;opacity:0;pointer-events:none;line-height:1.28;background:#fff;color:#111}
#ed.on{opacity:1;pointer-events:auto;box-shadow:0 3px 12px rgba(0,0,0,.18)}

.bottombar{display:flex;align-items:stretch;gap:6px;min-height:36px;padding:0 16px;background:var(--bar);border-top:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;max-width:55%}
.tab{display:flex;align-items:center;padding:0 14px;border:0;background:none;color:var(--muted);cursor:pointer;white-space:nowrap;border-top:2px solid transparent}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--panel);color:var(--ink);font-weight:500;border-top-color:var(--accent)}
.tab input{font:inherit;width:100px;border:1px solid var(--accent);border-radius:4px;padding:1px 4px;background:var(--panel);color:var(--ink)}
#addSheet{align-self:center}
.status{flex:1;align-self:center;color:var(--muted);font-size:12px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zoom{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.zoom .tb{min-width:24px;height:24px}
#zoomR{width:96px;accent-color:var(--accent)}
#zoomV{width:40px;text-align:right;font-variant-numeric:tabular-nums}

.pop,.menu{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);color:var(--ink)}
.pop{padding:10px}
.menu{padding:5px;min-width:210px}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;border:0;border-radius:6px;background:none;text-align:left;cursor:pointer;white-space:nowrap}
.mi:hover{background:var(--hover)}
.mi svg{width:18px;height:18px;flex:none}
.mi .sp{width:18px;flex:none}
.mi kbd{margin-left:auto;padding-left:18px;font:11px "IBM Plex Mono",Consolas,monospace;color:var(--muted)}
.msep{height:1px;background:var(--line);margin:4px 2px}
.plabel{font-size:11px;color:var(--muted);letter-spacing:.04em;margin:8px 2px 5px}
.plabel:first-child{margin-top:0}
.swgrid{display:grid;grid-template-columns:repeat(10,18px);gap:3px}
.swgrid.tints{gap:0 3px}
.sw{width:18px;height:18px;border:1px solid rgba(0,0,0,.14);border-radius:3px;cursor:pointer;padding:0}
.swgrid.tints .sw{border-radius:0}
.sw:hover{outline:2px solid var(--accent);outline-offset:1px;position:relative;z-index:1}
.prow{display:flex;gap:6px;align-items:center;margin-top:8px}
.pbtn{flex:1;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.pbtn:hover{background:var(--hover)}
.pbtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pbtn input[type=color]{width:20px;height:20px;border:0;padding:0;background:none;cursor:pointer}
.bmenu{display:flex;gap:10px}
.bmenu .presets{min-width:200px}
.bmenu .pen{width:200px;border-left:1px solid var(--line);padding-left:10px}
.lineopt{display:grid;grid-template-columns:1fr;gap:4px}
.lineopt .pbtn{justify-content:flex-start;padding:0 10px}
.lineopt svg{width:120px;height:10px}

.modal-back{position:fixed;inset:0;background:rgba(10,15,25,.38);display:grid;place-items:center;z-index:30;padding:16px}
.modal{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:20px;width:min(380px,100%)}
.modal h3{margin:0 0 10px;font-size:15px}
.modal p{margin:0 0 14px;color:var(--muted)}
.modal input{width:100%;margin-bottom:14px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.modal .acts button{height:32px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.modal .acts button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.modal.wide{width:min(540px,100%)}
.bkset{display:grid;gap:10px;margin-bottom:6px}
.bkset label{display:flex;align-items:center;gap:10px}
.bkset select{width:auto}
.modal .chk{align-items:flex-start;color:var(--muted);line-height:1.45}
.modal .chk input{width:auto;margin:3px 0 0;accent-color:var(--accent)}
.bklist{max-height:300px;overflow:auto;border-top:1px solid var(--line);margin-bottom:12px}
.bkrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line)}
.bkrow b{font-weight:500;word-break:break-all}
.bkrow span{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.bkrow .pbtn{flex:none;width:64px}
.bkempty{padding:14px 2px}
#toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;white-space:nowrap}
#toast.show{opacity:1}
#cv{touch-action:none}
.bottombar{padding-bottom:env(safe-area-inset-bottom,0px)}
/* 화면 틀(버튼, 메뉴, 탭)은 길게 눌러도 글자가 선택되지 않게. 입력칸은 그대로 */
.titlebar,.ribbon,.fxbar .fxlabel,.bottombar,.menu,.pop,.modal h3{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.doc{overflow:hidden}
.doc.dirty #docName::after{content:" •";color:var(--warn)}
@media (max-width:760px){
  .fbtn span{display:none}.status{display:none}.tabs{max-width:70%}
  .titlebar{gap:8px}
  #saveState,#bkState{display:none}
  .ribbon{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-block:5px}
  .ribbon::-webkit-scrollbar{display:none}
  .grp,.sep{flex:none}
  #fontSel{width:116px}
  #nameBox{width:70px}
  #zoomR{display:none}
}
/* 손가락으로 누르기 쉽게, 그리고 iOS에서 입력칸을 누를 때 화면이 확대되지 않게 16px */
@media (pointer:coarse){
  .ctl{font-size:16px}
  .tb{min-width:38px;height:38px}
  .tb.caret{min-width:22px}
  .fbtn{height:36px}
  .mi{padding:10px 12px}
}
#installBtn[hidden]{display:none}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="titlebar">
    <div class="brand">
      <svg viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="4" fill="var(--accent)"/><path d="M1 7.7h20M1 14.3h20M7.7 1v20M14.3 1v20" stroke="var(--accent-ink)" stroke-opacity=".55" stroke-width="1"/><rect x="7.7" y="7.7" width="6.6" height="6.6" fill="var(--accent-ink)"/></svg>
      모눈
    </div>
    <div class="doc"><span id="docName">제목 없음</span><span id="saveState"></span><span id="bkState"></span></div>
    <div class="filebtns">
      <button class="fbtn" data-cmd="install" id="installBtn" title="이 기기에 앱으로 설치" hidden><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="2.5" width="9" height="15" rx="2"/><path d="M10 6v6M7.5 9.5 10 12l2.5-2.5M8.5 15h3"/></svg><span>앱으로 설치</span></button>
      <button class="fbtn" data-cmd="backups" title="자동 백업 설정과 복원"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10a6.5 6.5 0 1 0 1.9-4.6"/><path d="M3 3.5v3.2h3.2"/><path d="M10 6.5V10l2.5 1.6"/></svg><span>백업·복원</span></button>
      <button class="fbtn" data-cmd="new" title="새로 만들기"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M5 2.5h6.5L15 6v11.5H5z"/><path d="M11.5 2.5V6H15"/></svg><span>새로 만들기</span></button>
      <button class="fbtn" data-cmd="open" title="열기 (Ctrl+O)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2.5 5h5l1.5 2h8.5v9h-15z"/></svg><span>열기</span></button>
      <button class="fbtn" data-cmd="saveAs" title="다른 이름으로 저장 (Ctrl+Shift+S)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 3h9l3 3v4M4 3v14h6"/><path d="M7 3v3.5h5V3M12.5 17l1-3 4-4 2 2-4 4z"/></svg><span>다른 이름으로</span></button>
      <button class="fbtn" data-cmd="export" title="엑셀(.xlsx)로 내보내기"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 3h9v14H3zM3 8h9M3 12.5h9M7.5 3v14"/><path d="M14 10h4.5M16.5 8l2 2-2 2"/></svg><span>.xlsx 내보내기</span></button>
      <button class="fbtn primary" data-cmd="save" title="저장 (Ctrl+S)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 3h10l3 3v11H4z"/><path d="M7 3v4h6V3M7 17v-5h7v5"/></svg><span>저장</span></button>
    </div>
  </header>

  <div class="ribbon" id="ribbon">
    <div class="grp">
      <button class="tb" data-cmd="undo" title="실행 취소 (Ctrl+Z)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5 4 8l3.5 3.5"/><path d="M4.5 8H12a4 4 0 0 1 0 8H8"/></svg></button>
      <button class="tb" data-cmd="redo" title="다시 실행 (Ctrl+Y)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 16 8l-3.5 3.5"/><path d="M15.5 8H8a4 4 0 0 0 0 8h4"/></svg></button>
      <button class="tb" data-cmd="painter" id="painterBtn" title="서식 복사 (두 번 누르면 계속 적용)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="3" y="2.5" width="11" height="4.5" rx="1"/><path d="M14 4.75h2.5V9.5H9.5v2.5"/><rect x="8.25" y="12" width="2.5" height="5.5" rx=".6"/></svg></button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <select class="ctl" id="fontSel" title="글꼴"></select>
      <input class="ctl" id="sizeIn" list="sizeList" title="글자 크기" inputmode="decimal">
      <datalist id="sizeList"></datalist>
      <button class="tb" data-cmd="grow" title="글자 크게"><span class="glyph" style="font-family:inherit;font-size:14px">A<sup style="font-size:9px">+</sup></span></button>
      <button class="tb" data-cmd="shrink" title="글자 작게"><span class="glyph" style="font-family:inherit;font-size:12px">A<sup style="font-size:9px">−</sup></span></button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button class="tb" data-cmd="bold" id="tbBold" title="굵게 (Ctrl+B)"><span class="glyph" style="font-weight:700">B</span></button>
      <button class="tb" data-cmd="italic" id="tbItalic" title="기울임 (Ctrl+I)"><span class="glyph" style="font-style:italic">I</span></button>
      <button class="tb" data-cmd="underline" id="tbUnder" title="밑줄 (Ctrl+U)"><span class="glyph" style="text-decoration:underline">U</span></button>
      <button class="tb" data-cmd="strike" id="tbStrike" title="취소선 (Ctrl+5)"><span class="glyph" style="text-decoration:line-through">S</span></button>
      <button class="tb" data-cmd="fc" title="글자 색"><span class="glyph" style="font-family:inherit;font-weight:600;margin-top:-4px">가</span><span class="bar" id="fcBar"></span></button>
      <button class="tb caret" data-cmd="fcMenu" title="글자 색 고르기"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5 6 7.5l3-3"/></svg></button>
      <button class="tb" data-cmd="bg" title="채우기 색"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" style="margin-top:-4px"><path d="M3.5 9 9 3.5l6 6L9.5 15z"/><path d="M3.5 9h11.5"/><path d="M16.5 11.5s1.5 1.9 1.5 2.9a1.5 1.5 0 0 1-3 0c0-1 1.5-2.9 1.5-2.9z" fill="currentColor"/></svg><span class="bar" id="bgBar"></span></button>
      <button class="tb caret" data-cmd="bgMenu" title="채우기 색 고르기"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5 6 7.5l3-3"/></svg></button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button class="tb" data-cmd="alignL" id="tbAL" title="왼쪽 맞춤"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4.5h14M3 8.5h9M3 12.5h14M3 16.5h9"/></svg></button>
      <button class="tb" data-cmd="alignC" id="tbAC" title="가운데 맞춤 (Ctrl+E)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4.5h14M5.5 8.5h9M3 12.5h14M5.5 16.5h9"/></svg></button>
      <button class="tb" data-cmd="alignR" id="tbAR" title="오른쪽 맞춤"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4.5h14M8 8.5h9M3 12.5h14M8 16.5h9"/></svg></button>
      <button class="tb" data-cmd="vTop" id="tbVT" title="위쪽 맞춤"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3.5h14M10 7v10M6.5 10.5 10 7l3.5 3.5"/></svg></button>
      <button class="tb" data-cmd="vMid" id="tbVM" title="가운데 (세로) 맞춤"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h14M10 2.5v4.5M7.5 4.5 10 7l2.5-2.5M10 17.5V13M7.5 15.5 10 13l2.5 2.5"/></svg></button>
      <button class="tb" data-cmd="vBot" id="tbVB" title="아래쪽 맞춤"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16.5h14M10 3v10M6.5 9.5 10 13l3.5-3.5"/></svg></button>
      <button class="tb labeled" data-cmd="wrap" id="tbWrap" title="자동 줄 바꿈: 칸 너비에 맞춰 글자를 여러 줄로 보여 줍니다"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h14M3 10h11a2.5 2.5 0 0 1 0 5h-4"/><path d="M12 13l-2 2 2 2M3 15h4"/></svg><span>줄 바꿈</span></button>
      <button class="tb" data-cmd="merge" id="tbMerge" title="병합하고 가운데 맞춤"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="15" height="11" rx="1"/><path d="M5.5 10h9M7.5 8l-2 2 2 2M12.5 8l2 2-2 2"/></svg></button>
      <button class="tb caret" data-cmd="mergeMenu" title="병합 옵션"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5 6 7.5l3-3"/></svg></button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button class="tb" data-cmd="border" id="tbBorder" title="테두리"></button>
      <button class="tb caret" data-cmd="borderMenu" title="테두리 종류, 두께, 색"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5 6 7.5l3-3"/></svg></button>
      <button class="tb" data-cmd="clear" title="서식 지우기"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M8 16 4 12l7.5-7.5 5 5L11 16z"/><path d="M7 9l5 5M8 16h9"/></svg></button>
      <button class="tb" data-cmd="grid" id="tbGrid" title="눈금선 보이기/숨기기"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="14" height="14" rx="1"/><path d="M3 7.7h14M3 12.3h14M7.7 3v14M12.3 3v14"/></svg></button>
    </div>
  </div>

  <div class="fxbar">
    <input class="ctl" id="nameBox" title="칸 주소 (입력 후 Enter로 이동)" spellcheck="false">
    <span class="fxlabel">내용</span>
    <input class="ctl" id="fx" spellcheck="false" placeholder="선택한 칸의 내용">
  </div>

  <div class="wrap" id="wrap">
    <canvas id="cv"></canvas>
    <div id="spacer"></div>
    <textarea id="ed" spellcheck="false" autocomplete="off" aria-label="칸 편집"></textarea>
  </div>

  <footer class="bottombar">
    <div class="tabs" id="tabs"></div>
    <button class="tb" id="addSheet" title="시트 추가"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 4.5v11M4.5 10h11"/></svg></button>
    <div class="status" id="status"></div>
    <div class="zoom">
      <button class="tb" id="zoomOut" title="축소">−</button>
      <input type="range" id="zoomR" min="50" max="200" step="10" value="100" aria-label="확대/축소">
      <button class="tb" id="zoomIn" title="확대">+</button>
      <span id="zoomV">100%</span>
    </div>
  </footer>
</div>
<div id="pop" class="pop" hidden></div>
<div id="ctx" class="menu" hidden></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".monun,.json,.xlsx" hidden>

<script>
(() => {
'use strict';
// ===== 기본 값 =====
const ROWS = 1000, COLS = 52, DEF_W = 90, DEF_H = 24, HW = 46, HH = 24;
const DEF_FONT = 'Malgun Gothic', DEF_FS = 11, GRIDC = '#E1E5EB', LS = 'monun.autosave.v1';
const FONTS = [['Malgun Gothic','맑은 고딕'],['Nanum Gothic','나눔고딕'],['Nanum Myeongjo','나눔명조'],['Noto Sans KR','본고딕'],['Noto Serif KR','본명조'],['Gowun Dodum','고운돋움'],['Do Hyeon','도현'],['Black Han Sans','검은고딕'],['Nanum Pen Script','나눔손글씨 펜'],['Gulim','굴림'],['Dotum','돋움'],['Batang','바탕'],['Gungsuh','궁서'],['Arial','Arial'],['Times New Roman','Times New Roman'],['Georgia','Georgia'],['Consolas','Consolas']];
const XL_NAME = {'Malgun Gothic':'맑은 고딕','Gulim':'굴림','Dotum':'돋움','Batang':'바탕','Gungsuh':'궁서','Nanum Gothic':'나눔고딕','Nanum Myeongjo':'나눔명조'};
const XL_BACK = Object.fromEntries(Object.entries(XL_NAME).map(([a,b]) => [b,a]));
const SIZES = [8,9,10,11,12,14,16,18,20,22,24,26,28,36,48,72];

const $ = s => document.querySelector(s);
const wrap = $('#wrap'), cv = $('#cv'), ctx = cv.getContext('2d'), spacer = $('#spacer'), ed = $('#ed');
const fx = $('#fx'), nameBox = $('#nameBox'), pop = $('#pop'), menuEl = $('#ctx');
const mctx = document.createElement('canvas').getContext('2d');

let wb, sh, colX, rowY, mergeIdx = new Map(), V = null;
let sel = {r1:0,c1:0,r2:0,c2:0}, act = {r:0,c:0}, foc = {r:0,c:0};
let editing = false, editMode = 'enter', edMinW = 0, edMinH = 0;
let undoStack = [], redoStack = [], changedSinceBackup = false;
let clip = null, clipHTML = '', painter = null, drag = null, lastEv = null, asId = 0;
let fileHandle = null, fileName = '제목 없음', fileDirty = false;
const pens = {fc:'#C00000', bg:'#FFF2CC'};
let borderPen = {w:1, s:'solid', c:'#000000'}, lastBorder = 'all';
let recent = [];
const TH = {};

// ===== 모델 =====
function newSheet(name){ return {name, cells:{}, colW:{}, rowH:{}, rowManual:{}, colStyle:{}, rowStyle:{}, merges:[], grid:true, zoom:1}; }
function normSheet(s){
  const o = Object.assign(newSheet(s.name || 'Sheet'), s);
  // rowManual에는 직접 정한 높이(최소 높이)를 담는다. 예전 파일은 1로 표시돼 있어 그때 높이로 바꿔 줌
  for (const r in o.rowManual) if (o.rowManual[r] === 1 || o.rowManual[r] === true) o.rowManual[r] = o.rowH[r] ?? DEF_H;
  return o;
}
const cw = c => sh.colW[c] ?? DEF_W;
const rh = r => sh.rowH[r] ?? DEF_H;
const getV = (r,c) => { const x = sh.cells[r+':'+c]; return x && x.v != null ? x.v : ''; };
function setV(r,c,v){
  const k = r+':'+c; let cell = sh.cells[k];
  if (v === '' || v == null){ if (cell){ delete cell.v; clean(r,c); } return; }
  if (!cell) cell = sh.cells[k] = {};
  cell.v = String(v);
}
function ensureCell(r,c){ const k = r+':'+c; return sh.cells[k] || (sh.cells[k] = {}); }
function clean(r,c){
  const k = r+':'+c, cell = sh.cells[k]; if (!cell) return;
  if (cell.s && !Object.keys(cell.s).length) delete cell.s;
  if (cell.v == null && !cell.s) delete sh.cells[k];
}
const EMPTY = {};
function st(r,c){
  const cell = sh.cells[r+':'+c], cs = sh.colStyle[c], rs = sh.rowStyle[r];
  if (!cs && !rs) return (cell && cell.s) || EMPTY;
  return Object.assign({}, cs, rs, cell && cell.s);
}
function buildMerges(){
  mergeIdx = new Map();
  for (const m of sh.merges) for (let r = m.r1; r <= m.r2; r++) for (let c = m.c1; c <= m.c2; c++) mergeIdx.set(r*COLS+c, m);
}
const mergeOf = (r,c) => mergeIdx.get(r*COLS+c);
const unitOf = (r,c) => mergeOf(r,c) || {r1:r,c1:c,r2:r,c2:c};
const inter = (a,b) => a.r1 <= b.r2 && a.r2 >= b.r1 && a.c1 <= b.c2 && a.c2 >= b.c1;
const contains = (a,b) => b.r1 >= a.r1 && b.r2 <= a.r2 && b.c1 >= a.c1 && b.c2 <= a.c2;
const isEmptyCell = (r,c) => getV(r,c) === '' && !mergeOf(r,c);
const NUMRE = /^[-+]?(\d{1,3}(,\d{3})+|\d+)(\.\d+)?%?$/;
const isNum = v => NUMRE.test(String(v).trim());
const fullCols = s => s.r1 === 0 && s.r2 === ROWS-1;
const fullRows = s => s.c1 === 0 && s.c2 === COLS-1;

function colName(c){ let s = ''; c++; while (c > 0){ const m = (c-1) % 26; s = String.fromCharCode(65+m) + s; c = Math.floor((c-1)/26); } return s; }
function parseRef(t){
  const m = /^([A-Za-z]{1,2})(\d+)$/.exec(t.trim()); if (!m) return null;
  let c = 0; for (const ch of m[1].toUpperCase()) c = c*26 + ch.charCodeAt(0) - 64;
  const r = +m[2]-1; c -= 1;
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null; return {r,c};
}
const ref = (r,c) => colName(c) + (r+1);

// ===== 배치 =====
function layout(){
  colX = new Float64Array(COLS+1); rowY = new Float64Array(ROWS+1);
  for (let c = 0; c < COLS; c++) colX[c+1] = colX[c] + cw(c);
  for (let r = 0; r < ROWS; r++) rowY[r+1] = rowY[r] + rh(r);
  const z = sh.zoom;
  spacer.style.width = (HW + colX[COLS]*z) + 'px';
  spacer.style.height = (HH + rowY[ROWS]*z) + 'px';
  positionEditor();
}
function bsearch(arr, v, n){ let lo = 0, hi = n-1; while (lo < hi){ const mid = (lo+hi+1) >> 1; if (arr[mid] <= v) lo = mid; else hi = mid-1; } return lo; }
const colAt = x => bsearch(colX, x, COLS);
const rowAt = y => bsearch(rowY, y, ROWS);

// ===== 글꼴 =====
const famStack = ff => `"${ff || DEF_FONT}", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
const fontStr = (s, z) => `${s.i ? 'italic ' : ''}${s.b ? '700' : '400'} ${((s.fs || DEF_FS) * 4/3 * z).toFixed(2)}px ${famStack(s.ff)}`;
const fontReq = new Set();
function ensureFont(ff, b){
  ff = ff || DEF_FONT; const key = ff + (b ? '|b' : '');
  if (fontReq.has(key) || !document.fonts) return; fontReq.add(key);
  document.fonts.load(`${b ? '700 ' : ''}16px "${ff}"`, '가A').then(() => schedule()).catch(() => {});
}
// 띄어쓰기 단위(어절)로 줄을 바꾸고, 한 어절이 칸보다 길 때만 글자 단위로 자른다
const TOK = /\s+|\S+/g;
function wrapLines(text, maxW, c){
  const out = [];
  for (const para of String(text).split('\n')){
    const toks = para.match(TOK) || [''];
    let line = '';
    const chars = t => { for (const ch of t){ if (line && c.measureText(line+ch).width > maxW){ out.push(line); line = ch; } else line += ch; } };
    for (const t of toks){
      if (c.measureText(line+t).width <= maxW){ line += t; continue; }
      if (/^\s+$/.test(t)){ out.push(line); line = ''; continue; }
      if (line){ out.push(line.replace(/\s+$/, '')); line = ''; }
      if (c.measureText(t).width > maxW) chars(t); else line = t;
    }
    out.push(line);
  }
  return out;
}
function autoRows(){
  const need = {};
  for (const k in sh.cells){
    const cell = sh.cells[k]; if (cell.v == null || cell.v === '') continue;
    const i = k.indexOf(':'), r = +k.slice(0,i), c = +k.slice(i+1);
    if (mergeOf(r,c)) continue;
    const s = st(r,c), px = (s.fs || DEF_FS) * 4/3;
    // 높이를 직접 정한 행은 줄 바꿈 글자가 들어갈 때만 늘린다
    if (sh.rowManual[r] && !s.wrap) continue;
    let lines;
    if (s.wrap){ mctx.font = fontStr(s,1); lines = wrapLines(cell.v, cw(c) - 8, mctx).length; }
    else lines = String(cell.v).split('\n').length;
    const h = Math.ceil(lines * px * 1.28 + 4);
    if (h > DEF_H && h > (need[r] || 0)) need[r] = h;
  }
  for (const r in sh.rowManual){ const base = sh.rowManual[r]; sh.rowH[r] = Math.max(base, need[r] || 0); }
  for (const r in sh.rowH) if (!sh.rowManual[r] && !need[r]) delete sh.rowH[r];
  for (const r in need) if (!sh.rowManual[r]) sh.rowH[r] = need[r];
}

// ===== 테마 =====
function readTheme(){
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['head','head-ink','head-line','head-sel','head-sel-ink','sel']) TH[k] = cs.getPropertyValue('--'+k).trim();
}

// ===== 그리기 =====
let rq = 0;
function schedule(){ if (!rq) rq = requestAnimationFrame(render); }
function render(){
  rq = 0;
  const W = wrap.clientWidth, H = wrap.clientHeight; if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)){
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    cv.style.width = W+'px'; cv.style.height = H+'px';
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const z = sh.zoom, sl = wrap.scrollLeft, stp = wrap.scrollTop;
  const X = c => HW + colX[c]*z - sl, Y = r => HH + rowY[r]*z - stp;
  const c0 = colAt(sl/z), c1 = colAt((sl + W - HW)/z), r0 = rowAt(stp/z), r1 = rowAt((stp + H - HH)/z);
  V = {X, Y, c0, c1, r0, r1, W, H, z};

  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.beginPath(); ctx.rect(HW, HH, W-HW, H-HH); ctx.clip();

  // 눈금선
  if (sh.grid){
    ctx.fillStyle = GRIDC;
    for (let c = c0; c <= c1+1 && c <= COLS; c++) ctx.fillRect(Math.round(X(c))-1, HH, 1, H-HH);
    for (let r = r0; r <= r1+1 && r <= ROWS; r++) ctx.fillRect(HW, Math.round(Y(r))-1, W-HW, 1);
  }
  const endX = X(COLS), endY = Y(ROWS);
  ctx.fillStyle = '#EEF0F3';
  if (endX < W) ctx.fillRect(endX, HH, W-endX, H-HH);
  if (endY < H) ctx.fillRect(HW, endY, W-HW, H-endY);

  // 채우기
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++){
    if (mergeOf(r,c)) continue;
    const s = st(r,c); if (!s.bg) continue;
    const x = Math.round(X(c)), y = Math.round(Y(r));
    ctx.fillStyle = s.bg; ctx.fillRect(x-1, y-1, Math.round(X(c+1))-x+1, Math.round(Y(r+1))-y+1);
  }
  const vm = sh.merges.filter(m => m.r2 >= r0 && m.r1 <= r1 && m.c2 >= c0 && m.c1 <= c1);
  for (const m of vm){
    const s = st(m.r1,m.c1);
    const x = Math.round(X(m.c1)), y = Math.round(Y(m.r1)), w = Math.round(X(m.c2+1))-x, h = Math.round(Y(m.r2+1))-y;
    if (s.bg){ ctx.fillStyle = s.bg; ctx.fillRect(x-1, y-1, w+1, h+1); }
    else { ctx.fillStyle = '#fff'; ctx.fillRect(x, y, w-1, h-1); }
  }

  // 글자
  for (let r = r0; r <= r1; r++){
    for (let c = 0; c < COLS; c++){
      const cell = sh.cells[r+':'+c];
      if (!cell || cell.v == null || cell.v === '' || mergeOf(r,c)) continue;
      drawText(r, c, {x:X(c), y:Y(r), w:X(c+1)-X(c), h:Y(r+1)-Y(r)}, false);
    }
  }
  for (const m of vm){
    if (getV(m.r1,m.c1) === '') continue;
    const x = X(m.c1), y = Y(m.r1);
    drawText(m.r1, m.c1, {x, y, w:X(m.c2+1)-x, h:Y(m.r2+1)-y}, true);
  }

  // 테두리
  for (let r = Math.max(0,r0-1); r <= Math.min(ROWS-1,r1+1); r++) for (let c = Math.max(0,c0-1); c <= Math.min(COLS-1,c1+1); c++){
    if (mergeOf(r,c)) continue;
    const s = st(r,c);
    if (s.bt || s.bb || s.bl || s.br) drawBorders(X(c), Y(r), X(c+1), Y(r+1), s);
  }
  for (const m of vm) drawBorders(X(m.c1), Y(m.r1), X(m.c2+1), Y(m.r2+1), st(m.r1,m.c1));

  drawSelection();
  ctx.restore();
  drawHeaders();
}

function drawText(r, c, rect, isMerge){
  const {X, z, W} = V;
  const v = getV(r,c), s = st(r,c);
  ensureFont(s.ff, s.b);
  ctx.font = fontStr(s, z);
  const px = (s.fs || DEF_FS) * 4/3 * z, pad = 3*z + 1;
  const ha = s.ha || (isNum(v) ? 'right' : 'left'), va = s.va || 'middle';
  const lines = s.wrap ? wrapLines(v, rect.w - pad*2, ctx) : String(v).split('\n');
  let clip = rect, tw = 0, spill = false;
  if (!isMerge && !s.wrap){
    for (const l of lines) tw = Math.max(tw, ctx.measureText(l).width);
    const need = tw + pad*2;
    if (need > rect.w){
      spill = true;
      let L = c, R = c;
      const canR = () => R+1 < COLS && isEmptyCell(r, R+1), canL = () => L-1 >= 0 && isEmptyCell(r, L-1);
      if (ha === 'left') while (X(R+1) - X(L) < need && canR()) R++;
      else if (ha === 'right') while (X(R+1) - X(L) < need && canL()) L--;
      else {
        const cx = rect.x + rect.w/2;
        while (cx - X(L) < need/2 && canL()) L--;
        while (X(R+1) - cx < need/2 && canR()) R++;
        // 한쪽이 막혀 있으면 반대쪽으로 더 넘겨서 글자 앞부분이 잘리지 않게
        while (X(R+1) - X(L) < need && canR()) R++;
        while (X(R+1) - X(L) < need && canL()) L--;
      }
      clip = {x:X(L), y:rect.y, w:X(R+1)-X(L), h:rect.h};
      if (clip.x > W || clip.x + clip.w < HW) return;
      // 넘친 글자가 지나가는 빈칸 사이 눈금선 지우기
      ctx.fillStyle = '#fff';
      for (let b = L+1; b <= R; b++) if (!st(r,b-1).bg && !st(r,b).bg) ctx.fillRect(Math.round(X(b))-1, Math.round(rect.y), 1, Math.round(rect.h)-1);
    } else if (rect.x > W || rect.x + rect.w < HW) return;
  }
  ctx.save();
  ctx.beginPath(); ctx.rect(clip.x, clip.y, clip.w, clip.h); ctx.clip();
  ctx.fillStyle = s.fc || '#111111';
  ctx.textBaseline = 'middle';
  ctx.textAlign = ha;
  const lh = px * 1.28, total = lh * lines.length;
  // 칸 안쪽의 실제 빈 공간: 아래 눈금선 1px과 칸 안으로 들어온 굵은 테두리는 뺀다
  const above = !isMerge && r > 0 ? st(r-1, c).bb : null;
  const thickIn = b => b && (b.w > 1 || b.s === 'double');
  const top = rect.y + (thickIn(s.bt) || thickIn(above) ? 1 : 0);
  const bottom = rect.y + rect.h - 1 - (s.bb && (s.bb.w >= 3 || s.bb.s === 'double') ? 1 : 0);
  const y0 = va === 'top' ? top + pad*0.5 : va === 'bottom' ? bottom - total - pad*0.5 : (top + bottom - total)/2;
  let x = ha === 'left' ? rect.x + pad : ha === 'right' ? rect.x + rect.w - pad : rect.x + rect.w/2;
  if (ha === 'center' && spill){
    // 가운데 정렬 글자가 넘칠 때: 보이는 범위 안으로 밀어 넣고, 그래도 넘치면 앞부분이 보이게
    const half = tw/2;
    x = tw > clip.w - pad*2 ? clip.x + pad + half : Math.max(clip.x + pad + half, Math.min(clip.x + clip.w - pad - half, x));
  }
  const th = Math.max(1, px/15), shift = glyphShift(ctx.font);
  lines.forEach((ln, i) => {
    const y = y0 + lh*(i+0.5);   // 이 줄의 가운데
    ctx.fillText(ln, x, y + shift);
    if (s.u || s.st){
      const w = ctx.measureText(ln).width, lx = ha === 'left' ? x : ha === 'right' ? x-w : x-w/2;
      if (s.u) ctx.fillRect(lx, y + px*0.52, w, th);
      if (s.st) ctx.fillRect(lx, y, w, th);
    }
  });
  ctx.restore();
}

// 글꼴마다 글자가 글꼴 상자 안에서 위아래로 치우친 정도가 달라서(맑은 고딕은 위로 약 1.6px),

function shiftAxis(axis, at, n, del){

    nc[r+':'+c] = sh.cells[k];

function applyFill(base, t, copyOnly){

    let area;

function applyMove(B, T, copy){

  const keyRC = k => { const i = k.indexOf(':'); return [+k.slice(0,i), +k.slice(i+1)]; };
  let occupied = false;
  for (const k in sh.cells){
    const [r, c] = keyRC(k);
    if (inR(T, r, c) && sh.cells[k].v != null && (copy || !inR(B, r, c))){ occupied = true; break; }
  }
  const go = () => {
    const dr = T.r1 - B.r1, dc = T.c1 - B.c1;
    mutate(() => {
      const src = [];
      for (const k in sh.cells){ const [r, c] = keyRC(k); if (inR(B, r, c)) src.push([r, c, JSON.parse(JSON.stringify(sh.cells[k]))]); }
      const ms = sh.merges.filter(m => contains(B, m));
      if (!copy){ for (const [r, c] of src) delete sh.cells[r+':'+c]; sh.merges = sh.merges.filter(m => !contains(B, m)); }
      for (const k of Object.keys(sh.cells)){ const [r, c] = keyRC(k); if (inR(T, r, c)) delete sh.cells[k]; }
      sh.merges = sh.merges.filter(m => !inter(m, T));
      for (const [r, c, cell] of src) sh.cells[(r+dr)+':'+(c+dc)] = cell;
      for (const m of ms) sh.merges.push({r1:m.r1+dr, r2:m.r2+dr, c1:m.c1+dc, c2:m.c2+dc});

    setRange(T, {r:act.r+dr, c:act.c+dc}); ensureVisible(T.r1, T.c1);
  };

  else go();
}

  setOn('tbWrap', s.wrap); setOn('tbMerge', mergeOf(act.r, act.c)); setOn('tbGrid', sh.grid);
  const ff = s.ff || DEF_FONT, fs = $('#fontSel');
  if (![...fs.options].some(o => o.value === ff)) fs.add(new Option(ff, ff));
  if (document.activeElement !== fs) fs.value = ff;
  if (document.activeElement !== $('#sizeIn')) $('#sizeIn').value = s.fs || DEF_FS;
  const single = sel.r1 === sel.r2 && sel.c1 === sel.c2 || (mergeOf(act.r, act.c) && contains(mergeOf(act.r, act.c), sel));
  if (document.activeElement !== nameBox) nameBox.value = single ? ref(act.r, act.c) : `${ref(sel.r1, sel.c1)}:${ref(sel.r2, sel.c2)}`;
  if (!editing && document.activeElement !== fx) fx.value = getV(act.r, act.c);

function setStatus(msg){
  const el = $('#status');

  if (R*C > 1 && !(m && contains(m, sel))){
    let n = 0; for (const k in sh.cells){ const i = k.indexOf(':'), r = +k.slice(0,i), c = +k.slice(i+1); if (sh.cells[k].v != null && r >= sel.r1 && r <= sel.r2 && c >= sel.c1 && c <= sel.c2) n++; }

  } else el.textContent = touchMode ? '두 번 탭: 편집 · 길게 누르기: 메뉴 · 두 손가락: 확대/축소' : '더블클릭으로 편집 · 오른쪽 아래 점을 끌면 이어 채우기';

function setZoom(z){

function renderTabs(){
  const box = $('#tabs'); box.innerHTML = '';
  wb.sheets.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === wb.active ? ' active' : ''); b.textContent = s.name;
    b.onclick = () => switchSheet(i);
    b.ondblclick = () => renameSheet(i, b);
    b.oncontextmenu = e => { e.preventDefault(); openTabMenu(i, e.clientX, e.clientY, b); };
    box.appendChild(b);
  });
}
function switchSheet(i){
  if (editing) commitEdit();
  if (i === wb.active) return focusGrid();
  wb.active = i; sh = wb.sheets[i]; clip = clip && clip.sheet === i ? clip : clip;
  buildMerges(); layout(); wrap.scrollTo(0, 0); setSel(0, 0); renderTabs(); queueAutosave(); focusGrid();
}
function renameSheet(i, btn){
  const inp = document.createElement('input'); inp.value = wb.sheets[i].name; btn.textContent = ''; btn.appendChild(inp); inp.focus(); inp.select();
  let done = false;
  const fin = ok => {
    if (done) return; done = true;
    const v = inp.value.trim();
    if (ok && v && v !== wb.sheets[i].name){
      if (wb.sheets.some((s, j) => j !== i && s.name === v)) toast('같은 이름의 시트가 이미 있습니다');
      else mutate(() => { wb.sheets[i].name = v.slice(0, 31); });
    }
    renderTabs(); focusGrid();
  };
  inp.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') fin(true); if (e.key === 'Escape') fin(false); };
  inp.onblur = () => fin(true);
  inp.onclick = e => e.stopPropagation();
}
function uniqueName(base){ let n = 1, name = base; while (wb.sheets.some(s => s.name === name)) name = base + ' ' + (++n); return name; }
function addSheet(){
  if (editing) commitEdit();
  let n = wb.sheets.length + 1; while (wb.sheets.some(s => s.name === 'Sheet' + n)) n++;
  mutate(() => { wb.sheets.push(newSheet('Sheet' + n)); });
  switchSheet(wb.sheets.length - 1); renderTabs();
}
function openTabMenu(i, x, y, btn){
  showMenu(x, y, [
    {label:'이름 바꾸기', run: () => renameSheet(i, btn)},
    {label:'복제', run: () => { mutate(() => { const c = JSON.parse(JSON.stringify(wb.sheets[i])); c.name = uniqueName(c.name + ' 복사본'); wb.sheets.splice(i+1, 0, c); }); switchSheet(i+1); renderTabs(); }},
    {label:'왼쪽으로 옮기기', run: () => moveSheet(i, -1)},

      modal('시트 삭제', `<p>“${esc(wb.sheets[i].name)}” 시트를 삭제할까요? 실행 취소(Ctrl+Z)로 되돌릴 수 있습니다.</p>`, '삭제', () => {
        mutate(() => { wb.sheets.splice(i, 1); if (wb.active >= wb.sheets.length) wb.active = wb.sheets.length - 1; else if (wb.active > i) wb.active--; });

function moveSheet(i, d){

function mix(hex, t){ // t>0 흰색 쪽, t<0 검은색 쪽
  const n = parseInt(hex.slice(1), 16), ch = [n >> 16, (n >> 8) & 255, n & 255];
  return '#' + ch.map(v => Math.round(t > 0 ? v + (255 - v)*t : v*(1 + t)).toString(16).padStart(2, '0')).join('').toUpperCase();
}
const BASE = ['#FFFFFF','#000000','#E7E6E6','#44546A','#4472C4','#ED7D31','#A5A5A5','#FFC000','#5B9BD5','#70AD47'];
const STD = ['#C00000','#FF0000','#FFC000','#FFFF00','#92D050','#00B050','#00B0F0','#0070C0','#002060','#7030A0'];
function tints(){
  const rows = [];
  const steps = [[-.05,.5],[-.15,.35],[-.25,.25],[-.35,.15],[-.5,.05]];
  const light = [.8,.6,.4,-.25,-.5];
  for (let i = 0; i < 5; i++) rows.push(BASE.map((b, j) => j === 0 ? mix(b, steps[i][0]) : j === 1 ? mix('#000000', steps[i][1]) : mix(b, light[i])));
  return rows.flat();
}
const swatch = c => `<button class="sw" data-c="${c}" style="background:${c}" title="${c}"></button>`;

    <div class="prow"><button class="pbtn" data-none="1">${label}</button><label class="pbtn" title="원하는 색 고르기">다른 색 <input type="color" id="pickC" value="${pens[kind]}"></label></div>`;

  if (o.dbl) p += 'M3 15.2h14M3 17.6h14';

}

}
const BLABEL = [['bottom','아래쪽 테두리'],['top','위쪽 테두리'],['left','왼쪽 테두리'],['right','오른쪽 테두리'],'-',['none','테두리 없음'],['all','모든 테두리'],['outer','바깥쪽 테두리'],['thickOuter','굵은 바깥쪽 테두리'],'-',['inner','안쪽 테두리'],['innerH','안쪽 가로선'],['innerV','안쪽 세로선'],['topBottom','위쪽 + 아래쪽'],['bottomDouble','아래쪽 이중 테두리']];

    fc: () => applyStyle({fc: pens.fc}), fcMenu: () => colorPop(el, 'fc'),
    bg: () => applyStyle({bg: pens.bg}), bgMenu: () => colorPop(el, 'bg'),
    alignL: () => applyStyle({ha: s().ha === 'left' ? null : 'left'}),
    alignC: () => applyStyle({ha: s().ha === 'center' ? null : 'center'}),
    alignR: () => applyStyle({ha: s().ha === 'right' ? null : 'right'}),
    vTop: () => applyStyle({va:'top'}), vMid: () => applyStyle({va:null}), vBot: () => applyStyle({va:'bottom'}),
    wrap: () => toggle('wrap'), merge: mergeToggle, mergeMenu: () => mergePop(el),

    : '<p class="bkempty">아직 백업이 없습니다. 내용을 바꾸면 정한 간격마다 자동으로 백업됩니다.</p>';
  const opts = [0, 1, 5, 10, 30].map(n => `<option value="${n}"${settings.interval === n ? ' selected' : ''}>${n ? n + '분마다' : '끄기'}</option>`).join('');
  const body = `<p>갑자기 꺼져도 다음에 켜면 마지막 작업이 자동으로 복구됩니다. 아래 백업으로 예전 상태로 되돌릴 수도 있습니다.</p>
    <div class="bkset">
      <label>자동 백업 <select class="ctl" id="bkInt">${opts}</select></label>
      <label class="chk"><input type="checkbox" id="bkFile"${settings.fileAuto ? ' checked' : ''}> 한 번 저장한 파일은 같은 간격으로 원본 파일에도 자동 저장</label>
    </div>
    <div class="plabel">최근 백업 (최대 ${MAX_BK}개)</div>
    <div class="bklist">${rows}</div>
    <div class="prow" style="margin:0 0 14px"><button class="pbtn" id="bkNow">지금 백업</button>${NATIVE ? '<button class="pbtn" id="bkDir">백업 폴더 열기</button>' : ''}</div>`;
  modal('백업과 복원', body, '닫기', () => {}, back => {
    const close = () => { back.remove(); focusGrid(); };
    back.querySelector('#bkInt').onchange = e => { settings.interval = +e.target.value; saveSettings(); lastBackupAt = Date.now(); updateBk(); };
    back.querySelector('#bkFile').onchange = e => { settings.fileAuto = e.target.checked; saveSettings(); };
    back.querySelector('#bkNow').onclick = async () => { if (await doBackup(true)){ close(); openBackups(); } };
    const dir = back.querySelector('#bkDir'); if (dir) dir.onclick = () => NATIVE.backupFolder();
    back.querySelectorAll('[data-r]').forEach(btn => btn.onclick = async () => {
      const b = list[+btn.dataset.r];
      let obj;
      try { const o = JSON.parse(await backups.read(b.id)); obj = o.wb || o; if (!Array.isArray(obj.sheets)) throw 0; }
      catch (e){ toast('이 백업을 읽을 수 없습니다'); return; }
      close();
      if (changedSinceBackup) await doBackup(false);   // 되돌리기 전 지금 상태도 백업해 둠
      loadWorkbook(obj); fileHandle = null; filePath = null; fileName = b.name + ' (복원)'; fileDirty = true;
      updateDoc(); queueAutosave();
      toast(`${whenLabel(b.time)} 백업으로 되돌렸습니다. 저장할 때 위치를 다시 고르세요`);
    });
  }, {wide: true, noCancel: true});
}

// ===== 폰에 앱으로 설치 (웹 주소로 열었을 때만) =====
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let installEvt = null;
function setupWebApp(){
  if (NATIVE || !/^https?:$/.test(location.protocol)) return;
  const link = (rel, href) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
  link('manifest', 'manifest.webmanifest');
  link('apple-touch-icon', 'icon-180.png');
  link('icon', 'icon-192.png');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#installBtn').hidden = false; });
  window.addEventListener('appinstalled', () => { $('#installBtn').hidden = true; toast('앱으로 설치했습니다. 홈 화면에서 모눈을 찾아 보세요'); });
  if (isIOS && !standalone) $('#installBtn').hidden = false;
}
// 안드로이드: 카톡 등에서 "공유 → 모눈"으로 보낸 파일을 받아서 연다 (sw.js가 잠깐 보관해 둠)
async function takeSharedFile(){
  if (!/[?&]shared=1/.test(location.search) || !('caches' in window)) return;
  history.replaceState(null, '', location.pathname);
  try {
    const c = await caches.open('monun-share'), r = await c.match('shared-file');
    if (!r){ toast('공유한 파일을 받지 못했습니다. 다시 한번 공유해 주세요'); return; }
    const name = decodeURIComponent(r.headers.get('X-Name') || '공유받은 파일.monun');
    const buf = await r.arrayBuffer();
    await c.delete('shared-file');
    await openData(name, buf, {});
  } catch (e){ toast('공유한 파일을 열 수 없습니다'); }
}
async function installApp(){
  if (installEvt){ installEvt.prompt(); const r = await installEvt.userChoice; if (r.outcome === 'accepted') $('#installBtn').hidden = true; installEvt = null; return; }
  if (isIOS){
    modal('아이폰에 설치하기', `<p>사파리 아래쪽의 <b>공유 버튼</b>(네모에서 화살표가 위로 나온 모양)을 누른 뒤,<br><b>“홈 화면에 추가”</b>를 고르면 홈 화면에 모눈 아이콘이 생깁니다.</p><p>꼭 <b>사파리</b>에서 열어야 이 메뉴가 보입니다.</p>`, '알겠어요', () => {}, null, {noCancel: true});
    return;
  }
  modal('앱으로 설치하기', '<p>브라우저 메뉴(⋮)에서 <b>“앱 설치”</b> 또는 <b>“홈 화면에 추가”</b>를 누르세요.</p>', '알겠어요', () => {}, null, {noCancel: true});
}

// ===== 예시 시트 =====
function sample(){
  const s = newSheet('10월 업무표');
  s.colW = {0:44, 1:92, 2:250, 3:78, 4:78, 5:96, 7:120};
  const put = (r, c, v, sty) => { const o = {}; if (v !== '' && v != null) o.v = String(v); if (sty) o.s = sty; s.cells[r+':'+c] = o; };
  const ink = '#1F3B7A', thin = {w:1, s:'solid', c:'#A9B4C8'}, thick = {w:2, s:'solid', c:ink};
  put(0, 0, '마케팅팀 10월 둘째 주 업무표', {b:true, fs:18, ha:'center', fc:ink, ff:'Noto Sans KR'});
  s.merges.push({r1:0, c1:0, r2:0, c2:5}); s.rowH[0] = s.rowManual[0] = 44;
  put(1, 0, '2026-10-05 ~ 2026-10-09 · 예시로 넣어 둔 시트입니다. 위쪽 [새로 만들기]를 누르면 빈 시트로 시작합니다.', {fc:'#6B7385', fs:9});
  ['No','담당','업무','시작','마감','상태'].forEach((h, c) => put(3, c, h, {b:true, bg:ink, fc:'#FFFFFF', ha:'center', bt:thick, bb:thin, bl:c === 0 ? thick : thin, br:c === 5 ? thick : thin}));
  s.rowH[3] = s.rowManual[3] = 28;
  const rows = [['1','김하늘','가을 캠페인 배너 시안 3종','10-05','10-06','완료'],['2','이도윤','인스타그램 릴스 촬영 일정 조율과 장소 섭외, 소품 목록 정리','10-05','10-08','진행 중'],['3','박서연','뉴스레터 10월호 원고','10-06','10-07','완료'],['4','최민준','고객 설문 결과 정리','10-07','10-09','대기'],['5','정유나','11월 프로모션 기획안 초안','10-08','10-09','진행 중']];
  const tone = {'완료':['#E2F0D9','#2E6B1F'], '진행 중':['#FFF2CC','#8A6100'], '대기':['#EDEFF3','#59606E']};
  rows.forEach((row, i) => { const r = 4 + i; row.forEach((v, c) => {
    const sty = {bt:thin, bb: i === rows.length-1 ? thick : thin, bl: c === 0 ? thick : thin, br: c === 5 ? thick : thin};
    if (c === 0 || c >= 3) sty.ha = 'center';
    if (c === 2) sty.wrap = true;
    if (i % 2 === 1) sty.bg = '#F4F6FA';
    if (c === 5){ sty.bg = tone[v][0]; sty.fc = tone[v][1]; sty.b = true; }
    put(r, c, v, sty);
  }); });
  put(10, 1, '메모', {b:true, fc:ink});
  put(11, 1, '긴 글은 이렇게 오른쪽 빈칸으로 이어져 보입니다. 옆 칸에 내용을 넣으면 그 앞에서 잘립니다.', {fc:'#3B4252'});
  put(13, 1, '채우기 연습', {b:true, fc:ink});
  put(14, 1, '아래 칸을 선택하고 오른쪽 아래 작은 점을 끌어 보세요', {fc:'#6B7385', fs:9});
  const fs = {ha:'center', bg:'#DCE5FA', bt:thin, bb:thin, bl:thin, br:thin};
  put(15, 1, '항목1', fs); put(15, 2, '월요일', fs); put(15, 3, '1월', fs); put(15, 4, '2026-10-05', fs); put(15, 5, '1분기', fs);
  return {sheets:[s], active:0};
}

// ===== 시작 =====
readTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTheme(); schedule(); });
new MutationObserver(() => { readTheme(); schedule(); }).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
$('#gf').addEventListener('load', () => { fontReq.clear(); SHIFT.clear(); schedule(); });
if (document.fonts) document.fonts.addEventListener('loadingdone', () => { SHIFT.clear(); if (sh){ autoRows(); layout(); schedule(); } });
$('#fcBar').style.background = pens.fc; $('#bgBar').style.background = pens.bg;
$('#tbBorder').innerHTML = borderIcon(lastBorder);

let started = false;
try { started = !!localStorage.getItem('monun.started'); localStorage.setItem('monun.started', '1'); } catch (e) {}
const saved = readSession();
let recovered = false;
if (saved && saved.wb && Array.isArray(saved.wb.sheets)){
  loadWorkbook(saved.wb); fileName = saved.fileName || '제목 없음'; fileDirty = !!saved.fileDirty;
  if (NATIVE) filePath = saved.filePath || null;
  recovered = saved.clean === false && fileDirty;
} else loadWorkbook(started ? {sheets:[newSheet('Sheet1')], active:0} : sample());
updateDoc(); updateBk();
setupWebApp();
// 폰(안드로이드·아이폰)은 .monun 같은 낯선 확장자를 파일 고르기에서 흐리게 막아서 제한을 푼다
if (isIOS || touchDevice()) $('#fileIn').removeAttribute('accept');
takeSharedFile();
if (touchDevice()) touchMode = true;
focusGrid();
if (recovered){ toast('지난번에 저장하지 못하고 꺼진 작업을 복구했습니다'); changedSinceBackup = true; doBackup(false); }
const flushAutosave = () => { clearTimeout(asT); writeSession(true); };
window.addEventListener('beforeunload', flushAutosave);
document.addEventListener('visibilitychange', () => { if (document.hidden) writeSession(false); });
if (NATIVE){
  NATIVE.onOpenFile(f => openData(f.name, f.data, {path: f.path}));
  NATIVE.onSaveThenClose(async () => { if (await saveFile(false)){ flushAutosave(); NATIVE.closeNow(); } });
  NATIVE.onDiscardThenClose(async () => {
    if (changedSinceBackup) await doBackup(false);   // 저장 안 하고 닫아도 백업에는 남김
    noAutosave = true; clearTimeout(asT); clearSession(); NATIVE.closeNow();
  });
}
})();
</script>
