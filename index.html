<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E5BD0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="모눈">
<title>모눈 시트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&family=Gowun+Dodum&family=Do+Hyeon&family=Black+Han+Sans&family=Nanum+Pen+Script&display=swap">
<style>
:root{
  --bg:#EDF0F4; --bar:#F7F8FA; --panel:#FFFFFF; --line:#D6DCE5; --ink:#1A2130; --muted:#626E82;
  --accent:#2E5BD0; --accent-ink:#FFFFFF; --accent-soft:rgba(46,91,208,.12); --hover:#E6EAF1;
  --head:#F2F4F7; --head-ink:#5B6576; --head-line:#D3D8E0; --head-sel:#DCE5FA; --head-sel-ink:#1E3F99;
  --sel:#2E5BD0; --warn:#B86A00; --shadow:0 10px 30px rgba(20,30,50,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12161D; --bar:#1A1F28; --panel:#222834; --line:#323A49; --ink:#E5E9F0; --muted:#98A2B4;
    --accent:#86A6FF; --accent-ink:#0E1626; --accent-soft:rgba(134,166,255,.16); --hover:#2A3242;
    --head:#1D232D; --head-ink:#9AA4B5; --head-line:#323A49; --head-sel:#2B3B60; --head-sel-ink:#D3DEFF;
    --sel:#3F6FE8; --warn:#F0B35A; --shadow:0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12161D; --bar:#1A1F28; --panel:#222834; --line:#323A49; --ink:#E5E9F0; --muted:#98A2B4;
  --accent:#86A6FF; --accent-ink:#0E1626; --accent-soft:rgba(134,166,255,.16); --hover:#2A3242;
  --head:#1D232D; --head-ink:#9AA4B5; --head-line:#323A49; --head-sel:#2B3B60; --head-sel-ink:#D3DEFF;
  --sel:#3F6FE8; --warn:#F0B35A; --shadow:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.4 "IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
button{font:inherit;color:inherit}

.titlebar{display:flex;align-items:center;gap:14px;padding:0 16px;min-height:46px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand svg{width:22px;height:22px}
.doc{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
#docName{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#saveState{font-size:12px;color:var(--muted);white-space:nowrap}
#saveState.dirty{color:var(--warn)}
#bkState{font-size:12px;color:var(--muted);white-space:nowrap}
#bkState:not(:empty)::before{content:"·";margin-right:10px}
.filebtns{display:flex;gap:2px;flex-wrap:wrap;padding-block:6px}
.tabstrip{display:flex;align-items:flex-end;gap:2px;padding:4px 12px 0;background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.tabbtn{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;padding:5px 15px 6px;border-radius:7px 7px 0 0;cursor:pointer;margin-bottom:-1px;border:1px solid transparent;border-bottom:0}
.tabbtn:hover{color:var(--ink);background:var(--hover)}
.tabbtn.on{color:var(--accent);font-weight:600;background:var(--panel);border-color:var(--line)}
.tabbtn.filetab{background:var(--accent);color:var(--accent-ink);font-weight:600;margin-right:8px;display:inline-flex;align-items:center;gap:4px}
.tabbtn.filetab:hover{filter:brightness(1.08);background:var(--accent);color:var(--accent-ink)}
.tabbtn.filetab svg{width:11px;height:11px}
.ribbon[hidden],.fbtn[hidden],.tb[hidden]{display:none!important}
.ribbon .grp.stylegal{display:grid;grid-template-columns:repeat(3,auto);gap:2px 3px;align-content:center}
.stybtn{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:0 8px;height:18px;font-size:11px!important;cursor:pointer;color:var(--ink);font-family:inherit;line-height:1.2;text-align:left;white-space:nowrap;min-width:74px}
.stybtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.lhbox{position:relative;display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.lhbox svg{width:18px;height:18px}
.lhbox #lhIn{width:76px;padding-right:36px;text-align:right}
.lhbox .pct{position:absolute;right:24px;pointer-events:none;font-size:12px}
.lhbox .szbtn{right:2px}
.mi.dis{opacity:.5;cursor:default}
.emset{display:flex;flex-direction:column;gap:7px;min-width:300px}
.emset .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.emset input[type=number]{width:64px}
.emset .sws{display:flex;gap:5px;flex-wrap:wrap}
.emset .sw2{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);cursor:pointer}
.emset .sw2.on{outline:2px solid var(--accent);outline-offset:1px}
.emset .navs{display:flex;gap:5px}
.emset .navs .pbtn{flex:1;height:28px;font-size:12px}
.findbar .fall{display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap;color:var(--muted);cursor:pointer;padding:0 4px}
.findbar #findGoBtn{flex:none;padding:0 12px;height:28px}
::highlight(findhl){background-color:#FFE14D}

.mi.dis:hover{background:none}
.mi .mpath{min-width:0;overflow:hidden;text-overflow:ellipsis}
.mi .mpath b{font-weight:600}
.mi .mpath.gone{opacity:.5;text-decoration:line-through}
.mi .mpin{margin-left:auto;padding:2px 4px;border-radius:4px;color:var(--muted);display:grid;place-items:center}
.mi .mpin:hover{background:var(--line);color:var(--ink)}
.mi .mpin.on{color:var(--accent)}
.mi .mpin svg{width:14px;height:14px}
.fbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:0;border-radius:6px;background:none;cursor:pointer;white-space:nowrap}
.fbtn svg{width:17px;height:17px;flex:none}
.fbtn:hover{background:var(--hover)}
.fbtn.primary{background:var(--accent);color:var(--accent-ink)}
.fbtn.primary:hover{filter:brightness(1.07)}

.ribbon{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px;padding:6px 16px;background:var(--bar);border-bottom:1px solid var(--line)}
.grp{display:flex;align-items:center;gap:2px}
.sep{width:1px;height:22px;background:var(--line);margin:0 6px}
.tb{position:relative;display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 5px;border:0;border-radius:6px;background:none;cursor:pointer}
.tb svg{width:18px;height:18px}
.tb:hover{background:var(--hover)}
.tb.on{background:var(--accent-soft);color:var(--accent)}
.tb.caret{min-width:15px;padding:0;margin-left:-3px}
.tb.caret svg{width:11px;height:11px}
.tb.labeled{display:inline-flex;gap:5px;padding:0 8px 0 6px;font-size:12.5px;white-space:nowrap}
.tb .bar{position:absolute;left:7px;right:7px;bottom:4px;height:3px;border-radius:1px;box-shadow:0 0 0 .5px rgba(0,0,0,.25)}
.glyph{font-size:15px;line-height:1;font-family:Georgia,"Times New Roman",serif}
.ctl{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;padding:0 6px}
#fontSel{width:150px}
.szbox{position:relative;display:inline-flex}
.szbox #sizeIn{width:64px;padding-right:20px}
.szbtn{position:absolute;right:2px;top:3px;bottom:3px;width:18px;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;border-radius:4px}
.szbtn:hover{background:var(--hover);color:var(--ink)}
.szbtn svg{width:11px;height:11px}
.szlist{display:flex;flex-direction:column;max-height:300px;overflow:auto;min-width:72px;margin:-4px}
.szi{border:0;background:none;text-align:left;padding:6px 14px;font:inherit;color:var(--ink);cursor:pointer;border-radius:5px;font-variant-numeric:tabular-nums}
.szi:hover{background:var(--hover)}
.szi.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
#nfSel{width:132px}
#sizeIn{width:60px;font-variant-numeric:tabular-nums}
.tb:focus-visible,.fbtn:focus-visible,.ctl:focus-visible,.tab:focus-visible,.mi:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.fxbar{display:flex;align-items:center;gap:8px;padding:5px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#nameBox{width:100px;font-family:"IBM Plex Mono",Consolas,monospace;text-align:center}
.fxlabel{font-size:11px;letter-spacing:.08em;color:var(--muted)}
#fx{flex:1;min-width:0;resize:none;overflow:hidden;white-space:pre;line-height:28px;padding-block:0;height:30px}

.wrap{position:relative;flex:1;overflow:auto;background:#fff;outline:none;min-height:0}
.wrap.painting{cursor:copy}
#cv{position:sticky;left:0;top:0;display:block}
#spacer{position:absolute;left:0;top:0;pointer-events:none}
#ed{position:absolute;z-index:3;margin:0;border:0;outline:2px solid var(--sel);outline-offset:0;resize:none;overflow:hidden;padding:2px 4px;opacity:0;pointer-events:none;line-height:1.28;background:#fff;color:#111;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text;cursor:text}
#docBack{position:fixed;left:0;right:0;bottom:0;top:var(--docTop,0px);z-index:10;background:#E4E7EC;display:flex;flex-direction:column}
#docBack[hidden]{display:none}
#recBtn .recdot{color:#D9480F}
#recBtn.on{color:#fff;background:#D9480F;border-radius:6px}
#recBtn.on .recdot{color:#fff}
#recBtn.on.blink{background:#A8380B}
#recBtn.pause{color:#3B2A00;background:#F2C230;border-radius:6px}
#recLbl{font-variant-numeric:tabular-nums}
.rset{display:flex;flex-direction:column;gap:7px;min-width:330px;margin-bottom:12px;max-height:calc(100vh - 190px);overflow-y:auto;padding-right:4px}
.rset .rsrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rset .rsrow .ctl{width:110px}
.rset #rsArea{width:200px}
.rset .sub{margin-left:22px}
.rset .rsinfo{margin:0 0 2px;font-size:12px;color:var(--muted)}
.rset .rskey{width:140px;text-align:center;cursor:pointer}
.rsdir{display:flex;gap:6px;align-items:center}
.rsdir span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted)}
.rsdir .pbtn{flex:none;padding:0 10px}
#recBtn{touch-action:none}
.recghost{position:fixed;z-index:60;transform:translate(-50%,-50%);pointer-events:none;background:#2D3033;color:#E8EAED;padding:9px 14px;border-radius:9px;font-size:12px;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.recghost b{color:#FF4D3A;margin-right:4px}
html.darksheet #ed{filter:invert(.9) hue-rotate(180deg);outline-color:#C19017}
html.darksheet #docBack{background:#0B0D10}
html.darksheet #ed.docmode{box-shadow:0 2px 16px rgba(255,255,255,.06)}
html.darksheet .wrap{background:#1A1B1D}
.docbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bar);border-bottom:1px solid var(--line);font-size:13px;color:var(--ink);-webkit-user-select:none;user-select:none}
.docbar .sp{flex:1}
.docbar{position:relative;flex-wrap:wrap;row-gap:6px}
#docPages{color:var(--muted)}
.docprog{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--line)}
.docprog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.docprog.done i{background:#2F9E44}
#docType.on,#docGoal.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
#ed.docmode.typer{padding-bottom:50vh!important}
.symgrid{display:grid;grid-template-columns:repeat(5,44px);gap:4px;margin-top:6px}
.symgrid .pbtn{height:34px;font-size:16px}
.docbar .pbtn{flex:none;padding:0 12px}
#docCount{color:var(--muted);font-variant-numeric:tabular-nums}
#docZoomV{min-width:44px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
#ed.docmode{position:fixed!important;z-index:11;left:50%!important;transform:translateX(-50%);top:calc(var(--docTop,0px) + var(--docBarH,44px) + 18px)!important;bottom:18px;width:min(var(--docW,760px),calc(100vw - 24px))!important;height:auto!important;overflow-y:auto!important;padding:44px 48px!important;box-sizing:border-box;outline:0;box-shadow:0 2px 16px rgba(0,0,0,.14);border-radius:2px}
@media (max-width:600px){#ed.docmode{padding:24px 18px!important}}
#ed.on{opacity:1;pointer-events:auto;box-shadow:0 3px 12px rgba(0,0,0,.18)}

.bottombar{display:flex;align-items:stretch;gap:6px;min-height:36px;padding:0 16px;background:var(--bar);border-top:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;max-width:55%}
.tab{display:flex;align-items:center;padding:0 14px;border:0;background:none;color:var(--muted);cursor:pointer;white-space:nowrap;border-top:2px solid transparent}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--panel);color:var(--ink);font-weight:500;border-top-color:var(--accent)}
.tab input{font:inherit;width:100px;border:1px solid var(--accent);border-radius:4px;padding:1px 4px;background:var(--panel);color:var(--ink)}
#addSheet{align-self:center}
.status{flex:1;align-self:center;color:var(--muted);font-size:12px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zoom{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.zoom .tb{min-width:24px;height:24px}
#zoomR{width:96px;accent-color:var(--accent)}
#zoomV{width:40px;text-align:right;font-variant-numeric:tabular-nums}

.pop,.menu{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);color:var(--ink)}
.pop{padding:10px}
.menu{padding:5px;min-width:210px}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;border:0;border-radius:6px;background:none;text-align:left;cursor:pointer;white-space:nowrap}
.mi:hover{background:var(--hover)}
.mi svg{width:18px;height:18px;flex:none}
.mi .sp{width:18px;flex:none}
.mi kbd{margin-left:auto;padding-left:18px;font:11px "IBM Plex Mono",Consolas,monospace;color:var(--muted)}
.msep{height:1px;background:var(--line);margin:4px 2px}
.plabel{font-size:11px;color:var(--muted);letter-spacing:.04em;margin:8px 2px 5px}
.plabel:first-child{margin-top:0}
.swgrid{display:grid;grid-template-columns:repeat(10,18px);gap:3px}
.swgrid.tints{gap:0 3px}
.sw{width:18px;height:18px;border:1px solid rgba(0,0,0,.14);border-radius:3px;cursor:pointer;padding:0}
.swgrid.tints .sw{border-radius:0}
.sw:hover{outline:2px solid var(--accent);outline-offset:1px;position:relative;z-index:1}
.prow{display:flex;gap:6px;align-items:center;margin-top:8px}
.pbtn{flex:1;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.pbtn:hover{background:var(--hover)}
.pbtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pbtn input[type=color]{width:20px;height:20px;border:0;padding:0;background:none;cursor:pointer}
.bmenu{display:flex;gap:10px}
.bmenu .presets{min-width:200px}
.bmenu .pen{width:200px;border-left:1px solid var(--line);padding-left:10px}
.lineopt{display:grid;grid-template-columns:1fr;gap:4px}
.lineopt .pbtn{justify-content:flex-start;padding:0 10px}
.lineopt svg{width:120px;height:10px}

.modal-back{position:fixed;inset:0;background:rgba(10,15,25,.38);display:grid;place-items:center;z-index:30;padding:16px}
.modal{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:20px;width:min(380px,100%)}
.modal h3{margin:0 0 10px;font-size:15px}
.modal p{margin:0 0 14px;color:var(--muted)}
.modal input{width:100%;margin-bottom:14px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.modal .acts button{height:32px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.modal .acts button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.modal.wide{width:min(540px,100%)}
.bkset{display:grid;gap:10px;margin-bottom:6px}
.bkset label{display:flex;align-items:center;gap:10px}
.bkset select{width:auto}
.modal .chk{align-items:flex-start;color:var(--muted);line-height:1.45}
.modal .chk input{width:auto;margin:3px 0 0;accent-color:var(--accent)}
.bklist{max-height:300px;overflow:auto;border-top:1px solid var(--line);margin-bottom:12px}
.bkrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line)}
.bkrow b{font-weight:500;word-break:break-all}
.bkrow span{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.bkrow .pbtn{flex:none;width:64px}
.bkempty{padding:14px 2px}
#toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;white-space:nowrap}
#toast.show{opacity:1}
#cv{touch-action:none}
.bottombar{padding-bottom:env(safe-area-inset-bottom,0px)}
/* 화면 틀(버튼, 메뉴, 탭)은 길게 눌러도 글자가 선택되지 않게. 입력칸은 그대로 */
.titlebar,.ribbon,.fxbar .fxlabel,.bottombar,.menu,.pop,.modal h3{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.doc{overflow:hidden}
.doc.dirty #docName::after{content:" •";color:var(--warn)}
@media (max-width:760px){
  .fbtn span{display:none}.status{display:none}.tabs{max-width:70%}
  .titlebar{gap:8px}
  #saveState,#bkState{display:none}
  .ribbon{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-block:5px}
  .ribbon::-webkit-scrollbar{display:none}
  .grp,.sep{flex:none}
  #fontSel{width:116px}
  #nameBox{width:70px}
  #zoomR{display:none}
}
/* 손가락으로 누르기 쉽게, 그리고 iOS에서 입력칸을 누를 때 화면이 확대되지 않게 16px */
@media (pointer:coarse){
  .ctl{font-size:16px}
  .tb{min-width:38px;height:38px}
  .tb.caret{min-width:22px}
  .fbtn{height:36px}
  .mi{padding:10px 12px}
}
#installBtn[hidden]{display:none}
.cc{align-self:center;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;padding:3px 8px;border-radius:5px;cursor:default;user-select:none}
.cc b{font-weight:600;color:var(--ink)}
.cc .ns{opacity:.85}

@media (max-width:760px){.cc{font-size:11px;padding:3px 4px}}
#pageView{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;background:var(--bg)}
#pageView[hidden]{display:none}
#pvPages .fhit{background:#FFF3B0}
#pvPages .fhit mark{background:#FFD43B;color:inherit;padding:0}
#pvPages .fcur{background:#FFE066;outline:2px solid #F59F00;outline-offset:1px}
#pvStart[hidden],#pvOrder[hidden],#pvScope[hidden],#pvNewPageL[hidden],#pvSegs[hidden]{display:none}
.pv-segs{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:6px 16px;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:thin}
.pv-segs-t{font-size:12px;color:var(--muted);white-space:nowrap;margin-right:2px}
.pv-seg{flex:none;border:1px solid var(--line);background:var(--bar);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.pv-seg:hover{border-color:var(--accent);color:var(--accent)}
.pv-seg b{font-family:"IBM Plex Mono",Consolas,monospace;font-weight:500}
.pv-seg span{color:var(--muted)}
.pv-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--bar);border-bottom:1px solid var(--line)}
.pv-bar label{display:flex;gap:6px;align-items:center;white-space:nowrap}
.pv-bar select.ctl{height:30px}
.pv-chk input{accent-color:var(--accent)}
.pv-info{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.pv-zoom{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pv-zoom .tb{min-width:26px;height:26px}
.pv-scroll{flex:1;overflow:auto;background:#5E6572}
.pv-pages{display:flex;flex-direction:column;align-items:center;gap:28px;padding:28px 16px 64px;width:max-content;min-width:100%;box-sizing:border-box}
.pv-one,.pv-pair{display:flex;flex-direction:column;align-items:center}
.pv-pair{flex-direction:row;gap:2px}
.pv-pages .pg{box-shadow:0 3px 14px rgba(0,0,0,.35)}
.pv-pages .ln,.pv-pages .tc{cursor:text}
.pv-blank{visibility:hidden}
.pv-label{color:#E7EAEF;font-size:12px;margin-top:6px}
@media (max-width:760px){.pv-bar .fbtn span{display:none}.pv-info{margin-left:0;width:100%}}
.cf-sw{flex:none;width:30px;height:24px;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;font-size:12px}
.modal code{font-family:"IBM Plex Mono",Consolas,monospace;background:var(--hover);padding:1px 4px;border-radius:3px}
#fnHint{position:fixed;z-index:25;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;max-width:360px;font-size:12.5px;color:var(--ink)}
#fnHint[hidden]{display:none}
.fh-item{display:flex;gap:10px;align-items:baseline;padding:4px 8px;border-radius:5px;cursor:pointer}
.fh-item b{font-family:"IBM Plex Mono",Consolas,monospace;font-weight:500;min-width:84px}
.fh-item span{color:var(--muted)}
.fh-item.on,.fh-item:hover{background:var(--accent-soft)}
.fh-tip{font-size:11px;color:var(--muted);padding:2px 8px}
.fh-sig{font-family:"IBM Plex Mono",Consolas,monospace;padding:4px 8px}
.fh-sig b{color:var(--accent)}
.fh-desc{color:var(--muted);padding:0 8px 4px}
.fc-list{max-height:52vh;overflow:auto;border-top:1px solid var(--line);margin:8px 0 12px}
.fc-row{display:grid;gap:2px;padding:7px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.fc-row:hover{background:var(--hover)}
.fc-row b{font-family:"IBM Plex Mono",Consolas,monospace;font-weight:500;font-size:12.5px}
.fc-row span{color:var(--muted);font-size:12px}
.findbar{position:fixed;z-index:15;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px;display:grid;gap:6px;width:min(540px,calc(100vw - 24px))}
.frow.fopts .sp{flex:1}
.frow.fopts{flex-wrap:wrap;row-gap:4px}
.findbar.docked{position:static;width:auto;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:5px 16px;background:var(--bar)}
.findbar.docked .frow:first-child{flex:1 1 380px;max-width:560px}
.findbar.docked .frow.fopts{flex:0 1 auto}
.findbar.docked #replRow{flex:1 1 320px;max-width:520px}
.frow.fopts .pbtn{height:28px;font-size:12px;padding:0 10px}
#findToggle.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.findbar[hidden]{display:none}
.frow{display:flex;gap:4px;align-items:center}
.frow[hidden]{display:none}
.frow .ctl{flex:1;min-width:0}
.frow .pbtn{flex:none;padding:0 12px;height:30px}
#findCount{font-size:12px;color:var(--muted);min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.fpop{width:270px}
.fpop .flist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px;margin:6px 0}
.fpop label{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:4px;cursor:pointer}
.fpop label:hover{background:var(--hover)}
.fpop label input{accent-color:var(--accent)}
.fpop label .n{margin-left:auto;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.fpop .ctl{width:100%}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="titlebar">
    <div class="brand">
      <svg viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="4" fill="var(--accent)"/><path d="M1 7.7h20M1 14.3h20M7.7 1v20M14.3 1v20" stroke="var(--accent-ink)" stroke-opacity=".55" stroke-width="1"/><rect x="7.7" y="7.7" width="6.6" height="6.6" fill="var(--accent-ink)"/></svg>
      모눈
    </div>
    <div class="doc"><span id="docName">제목 없음</span><span id="saveState"></span><span id="bkState"></span></div>
    <div class="filebtns">
      <button class="fbtn" data-cmd="install" id="installBtn" title="이 기기에 앱으로 설치" hidden><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="2.5" width="9" height="15" rx="2"/><path d="M10 6v6M7.5 9.5 10 12l2.5-2.5M8.5 15h3"/></svg><span>앱으로 설치</span></button>
      <button class="fbtn" data-cmd="recMenu" id="recBtn" title="녹화: 쓰는 과정을 동영상으로 (Ctrl+Alt+R 시작·중지, Ctrl+Alt+P 일시정지)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="3.2" fill="currentColor" stroke="none" class="recdot"/></svg><span id="recLbl">녹화</span></button>
      <button class="fbtn" id="recStop" hidden title="녹화 중지하고 저장 (Ctrl+Alt+S)"><svg viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="1.5" fill="currentColor"/></svg><span>저장</span></button>
      <button class="fbtn" data-cmd="themeMenu" id="themeBtn" title="화면 밝기: 자동(컴퓨터 설정 따라) · 밝게 · 어둡게"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 12.2A7 7 0 0 1 7.8 3.5a7 7 0 1 0 8.7 8.7z"/></svg><span>화면</span></button>
      <button class="fbtn" data-cmd="pageView" title="쪽 미리보기: A4·A5·B5 같은 종이에 글이 몇 쪽으로 들어가는지 보기"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10 5.5C8.5 4.3 6 3.8 3 4v11.5c3-.2 5.5.3 7 1.5 1.5-1.2 4-1.7 7-1.5V4c-3-.2-5.5.3-7 1.5z"/><path d="M10 5.5V17"/></svg><span>쪽 미리보기</span></button>
      <button class="fbtn" data-cmd="print" title="인쇄 / PDF로 저장 (Ctrl+P)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M6 7V3h8v4"/><rect x="3" y="7" width="14" height="7" rx="1.5"/><path d="M6 12h8v5H6z"/></svg><span>인쇄</span></button>
      <button class="fbtn" data-cmd="backups" title="자동 백업 설정과 복원"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10a6.5 6.5 0 1 0 1.9-4.6"/><path d="M3 3.5v3.2h3.2"/><path d="M10 6.5V10l2.5 1.6"/></svg><span>백업·복원</span></button>
      <button class="fbtn" data-cmd="new" title="새로 만들기"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M5 2.5h6.5L15 6v11.5H5z"/><path d="M11.5 2.5V6H15"/></svg><span>새로 만들기</span></button>
      <button class="fbtn" data-cmd="open" title="열기 (Ctrl+O)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2.5 5h5l1.5 2h8.5v9h-15z"/></svg><span>열기</span></button>
      <button class="fbtn" data-cmd="saveAs" title="다른 이름으로 저장 (Ctrl+Shift+S)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 3h9l3 3v4M4 3v14h6"/><path d="M7 3v3.5h5V3M12.5 17l1-3 4-4 2 2-4 4z"/></svg><span>다른 이름으로</span></button>
      <button class="fbtn" data-cmd="export" title="엑셀(.xlsx)로 내보내기"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 3h9v14H3zM3 8h9M3 12.5h9M7.5 3v14"/><path d="M14 10h4.5M16.5 8l2 2-2 2"/></svg><span>.xlsx 내보내기</span></button>
      <button class="fbtn primary" data-cmd="save" title="저장 (Ctrl+S)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 3h10l3 3v11H4z"/><path d="M7 3v4h6V3M7 17v-5h7v5"/></svg><span>저장</span></button>
    </div>
  </header>

  <div class="tabstrip" id="tabstrip">
    <button class="tabbtn filetab" data-cmd="fileMenu" id="fileMenuBtn" title="파일 (Alt+F)">파일 <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5 6 7.5l3-3"/></svg></button>
    <button class="tabbtn" data-tab="edit">편집</button>
    <button class="tabbtn" data-tab="fmt">서식</button>
  </div>
  <div class="ribbon" id="ribbonFmt" hidden>
    <div class="grp stylegal" id="styleGal"></div>
    <div class="sep"></div>
    <div class="grp" id="slotFont"></div>
    <div class="sep"></div>
    <div class="grp" id="slotFmt"></div>
    <div class="sep"></div>
    <div class="grp" id="fmtAlign"></div>
    <div class="sep"></div>
    <div class="grp">
      <span class="lhbox" title="줄 간격 (글자 크기의 %, 한글의 줄 간격과 같음)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5h9M8 10h9M8 15h9"/><path d="M4 4v12M2.5 5.5 4 4l1.5 1.5M2.5 14.5 4 16l1.5-1.5"/></svg><input class="ctl" id="lhIn" inputmode="numeric" autocomplete="off"><span class="pct">%</span><button class="szbtn" id="lhBtn" tabindex="-1" title="줄 간격 목록"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5 6 7.5l3-3"/></svg></button></span>
      <button class="tb" data-cmd="indUp" title="첫 줄 들여쓰기 한 글자 더"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h8M9 10h8M3 15h14"/><path d="M3 7.5 6 10l-3 2.5"/></svg></button>
      <button class="tb" data-cmd="indDown" title="첫 줄 들여쓰기 한 글자 덜"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h8M9 10h8M3 15h14"/><path d="M6 7.5 3 10l3 2.5"/></svg></button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button class="tb" data-cmd="bullet" id="tbBullet" title="글머리표 (• ) 넣기·빼기"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="4.5" cy="5.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="10" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="14.5" r="1.3" fill="currentColor" stroke="none"/><path d="M8 5.5h9M8 10h9M8 14.5h9"/></svg></button>
      <button class="tb" data-cmd="numbering" id="tbNumber" title="문단 번호 (1. 2. 3.) 넣기·빼기"><span class="glyph" style="font-family:inherit;font-size:10px;line-height:1.05;text-align:left">1—<br>2—<br>3—</span></button>
    </div>
    <div class="sep"></div>
    <div class="grp" id="fmtMore"></div>
  </div>
  <div class="ribbon" id="ribbon">
    <div class="grp">
      <button class="tb" data-cmd="undo" title="실행 취소 (Ctrl+Z)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5 4 8l3.5 3.5"/><path d="M4.5 8H12a4 4 0 0 1 0 8H8"/></svg></button>
      <button class="tb" data-cmd="redo" title="다시 실행 (Ctrl+Y)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 16 8l-3.5 3.5"/><path d="M15.5 8H8a4 4 0 0 0 0 8h4"/></svg></button>
      <button class="tb" data-cmd="painter" id="painterBtn" title="서식 복사 (두 번 누르면 계속 적용)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="3" y="2.5" width="11" height="4.5" rx="1"/><path d="M14 4.75h2.5V9.5H9.5v2.5"/><rect x="8.25" y="12" width="2.5" height="5.5" rx=".6"/></svg></button>
    </div>
    <div class="sep"></div>
    <div class="grp" id="gFont">
      <select class="ctl" id="fontSel" title="글꼴"></select>
      <span class="szbox"><input class="ctl" id="sizeIn" title="글자 크기: 눌러서 고르거나 숫자를 치고 Enter" inputmode="decimal" autocomplete="off"><button class="szbtn" id="sizeBtn" tabindex="-1" title="글자 크기 목록"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5 6 7.5l3-3"/></svg></button></span>
      <button class="tb" data-cmd="grow" title="글자 크게"><span class="glyph" style="font-family:inherit;font-size:14px">A<sup style="font-size:9px">+</sup></span></button>
      <button class="tb" data-cmd="shrink" title="글자 작게"><span class="glyph" style="font-family:inherit;font-size:12px">A<sup style="font-size:9px">−</sup></span></button>
    </div>
    <div class="sep"></div>
    <div class="grp" id="gFmt">
      <button class="tb" data-cmd="bold" id="tbBold" title="굵게 (Ctrl+B)"><span class="glyph" style="font-weight:700">B</span></button>
      <button class="tb" data-cmd="italic" id="tbItalic" title="기울임 (Ctrl+I)"><span class="glyph" style="font-style:italic">I</span></button>
      <button class="tb" data-cmd="underline" id="tbUnder" title="밑줄 (Ctrl+U)"><span class="glyph" style="text-decoration:underline">U</span></button>
      <button class="tb" data-cmd="strike" id="tbStrike" title="취소선 (Ctrl+5)"><span class="glyph" style="text-decoration:line-through">S</span></button>
      <button class="tb" data-cmd="fc" title="글자 색 (칸 편집 중 글자를 골라 두면 그 글자에만)"><span class="glyph" style="font-family:inherit;font-weight:600;margin-top:-4px">가</span><span class="bar" id="fcBar"></span></button>
      <button class="tb caret" data-cmd="fcMenu" title="글자 색 고르기"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5 6 7.5l3-3"/></svg></button>
      <button class="tb" data-cmd="bg" title="채우기 색 (칸 편집 중 글자를 골라 두면 그 글자에 형광펜)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" style="margin-top:-4px"><path d="M3.5 9 9 3.5l6 6L9.5 15z"/><path d="M3.5 9h11.5"/><path d="M16.5 11.5s1.5 1.9 1.5 2.9a1.5 1.5 0 0 1-3 0c0-1 1.5-2.9 1.5-2.9z" fill="currentColor"/></svg><span class="bar" id="bgBar"></span></button>
      <button class="tb caret" data-cmd="bgMenu" title="채우기 색 고르기"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5 6 7.5l3-3"/></svg></button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button class="tb" data-cmd="alignL" id="tbAL" title="왼쪽 맞춤"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4.5h14M3 8.5h9M3 12.5h14M3 16.5h9"/></svg></button>
      <button class="tb" data-cmd="alignC" id="tbAC" title="가운데 맞춤 (Ctrl+E)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4.5h14M5.5 8.5h9M3 12.5h14M5.5 16.5h9"/></svg></button>
      <button class="tb" data-cmd="alignR" id="tbAR" title="오른쪽 맞춤"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4.5h14M8 8.5h9M3 12.5h14M8 16.5h9"/></svg></button>
      <button class="tb" data-cmd="vTop" id="tbVT" title="위쪽 맞춤"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3.5h14M10 7v10M6.5 10.5 10 7l3.5 3.5"/></svg></button>
      <button class="tb" data-cmd="vMid" id="tbVM" title="가운데 (세로) 맞춤"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h14M10 2.5v4.5M7.5 4.5 10 7l2.5-2.5M10 17.5V13M7.5 15.5 10 13l2.5 2.5"/></svg></button>
      <button class="tb" data-cmd="vBot" id="tbVB" title="아래쪽 맞춤"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16.5h14M10 3v10M6.5 9.5 10 13l3.5-3.5"/></svg></button>
      <button class="tb labeled" data-cmd="wrap" id="tbWrap" title="자동 줄 바꿈 (기본으로 켜짐): 끄면 긴 글이 오른쪽 빈칸으로 이어져 보입니다. 입력 중 Enter는 칸 안에서 다음 줄, Ctrl+Enter는 입력을 마치고 아래 칸으로"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h14M3 10h11a2.5 2.5 0 0 1 0 5h-4"/><path d="M12 13l-2 2 2 2M3 15h4"/></svg><span>줄 바꿈</span></button>
      <button class="tb labeled" data-cmd="paraMenu" id="tbPara" title="문단: 줄 간격, 문단 첫 줄 들여쓰기"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5h9M8 10h9M8 15h9"/><path d="M4 4v12M2.5 5.5 4 4l1.5 1.5M2.5 14.5 4 16l1.5-1.5"/></svg><span>문단</span></button>

<script>
(() => {
'use strict';
// ===== 기본 값 =====
const ROWS = 1000, COLS = 52, DEF_W = 90, DEF_H = 24, HW = 46, HH = 24;
const DEF_FONT = 'Malgun Gothic', DEF_FS = 11, LS = 'monun.autosave.v1';
// 어두운 시트: 칸 색을 화면에서만 밝기를 뒤집어 그린다 (색감은 유지). 편집 칸의 CSS filter와 같은 계산
let darkSheet = false;
const DKC = new Map();
function dkColor(c){
  let v = DKC.get(c); if (v) return v;
  let r, g, b, m;
  if ((m = /^#([0-9a-f]{3})$/i.exec(c))){ [r, g, b] = [...m[1]].map(x => parseInt(x + x, 16) / 255); }
  else if ((m = /^#([0-9a-f]{6})/i.exec(c))){ r = parseInt(m[1].slice(0, 2), 16) / 255; g = parseInt(m[1].slice(2, 4), 16) / 255; b = parseInt(m[1].slice(4, 6), 16) / 255; }
  else if ((m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c))){ r = m[1] / 255; g = m[2] / 255; b = m[3] / 255; }
  else return c;
  // invert(0.9) → hue-rotate(180deg)
  [r, g, b] = [r, g, b].map(x => 0.9 - 0.8 * x);
  const cl = x => Math.max(0, Math.min(1, x));
  const R = cl(-0.574 * r + 1.43 * g + 0.144 * b), G = cl(0.426 * r + 0.43 * g + 0.144 * b), B = cl(0.426 * r + 1.43 * g - 0.856 * b);
  v = '#' + [R, G, B].map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join('');
  DKC.set(c, v); return v;
}
const DC = c => darkSheet ? dkColor(c) : c;
const PAPER_BG = () => darkSheet ? '#1A1B1D' : '#fff';
const FONTS = [['Malgun Gothic','맑은 고딕'],['Nanum Gothic','나눔고딕'],['Nanum Myeongjo','나눔명조'],['Noto Sans KR','본고딕'],['Noto Serif KR','본명조'],['Gowun Dodum','고운돋움'],['Do Hyeon','도현'],['Black Han Sans','검은고딕'],['Nanum Pen Script','나눔손글씨 펜'],['Gulim','굴림'],['Dotum','돋움'],['Batang','바탕'],['Gungsuh','궁서'],['Arial','Arial'],['Times New Roman','Times New Roman'],['Georgia','Georgia'],['Consolas','Consolas']];
const XL_NAME = {'Malgun Gothic':'맑은 고딕','Gulim':'굴림','Dotum':'돋움','Batang':'바탕','Gungsuh':'궁서','Nanum Gothic':'나눔고딕','Nanum Myeongjo':'나눔명조'};
const XL_BACK = Object.fromEntries(Object.entries(XL_NAME).map(([a,b]) => [b,a]));
const SIZES = [8,9,10,11,12,14,16,18,20,22,24,26,28,36,48,72];

const $ = s => document.querySelector(s);
const wrap = $('#wrap'), cv = $('#cv'), spacer = $('#spacer'), ed = $('#ed');
let ctx = cv.getContext('2d');   // 그림으로 복사할 때 잠깐 다른 캔버스로 바꿔 그림
const MAIN_CTX = ctx;
let oldLabels = [];   // 고치기 전 문장 꼬리표 (칸을 다 그린 뒤 맨 위에)
const fx = $('#fx'), nameBox = $('#nameBox'), pop = $('#pop'), menuEl = $('#ctx');
const mctx = document.createElement('canvas').getContext('2d');

let wb, sh, colX, rowY, mergeIdx = new Map(), V = null;
let sel = {r1:0,c1:0,r2:0,c2:0}, act = {r:0,c:0}, foc = {r:0,c:0};
let editing = false, editMode = 'enter', edMinW = 0, edMinH = 0;
let undoStack = [], redoStack = [], changedSinceBackup = false;
let clip = null, clipHTML = '', painter = null, drag = null, lastEv = null, asId = 0;
let fileHandle = null, fileName = '제목 없음', fileDirty = false;
const pens = {fc:'#C00000', bg:'#FFF2CC'};
let borderPen = {w:1, s:'solid', c:'#000000'}, lastBorder = 'all';
let recent = [];
const TH = {};

// ===== 모델 =====
function newSheet(name){ return {name, cells:{}, colW:{}, rowH:{}, rowManual:{}, colStyle:{}, rowStyle:{}, merges:[], images:[], grid:true, zoom:1}; }
function normSheet(s){
  const o = Object.assign(newSheet(s.name || 'Sheet'), s);
  // rowManual에는 직접 정한 높이(최소 높이)를 담는다. 예전 파일은 1로 표시돼 있어 그때 높이로 바꿔 줌
  for (const r in o.rowManual) if (o.rowManual[r] === 1 || o.rowManual[r] === true) o.rowManual[r] = o.rowH[r] ?? DEF_H;
  return o;
}
const cw = c => sh.colW[c] ?? DEF_W;
let hiddenRows = new Set();   // 필터로 숨긴 행 (높이 0으로 그림)
const rh = r => hiddenRows.has(r) ? 0 : (sh.rowH[r] ?? DEF_H);
const getV = (r,c) => { const x = sh.cells[r+':'+c]; return x && x.v != null ? x.v : ''; };
function setV(r,c,v){
  const k = r+':'+c; let cell = sh.cells[k];
  if (v === '' || v == null){ if (cell){ delete cell.v; clean(r,c); } return; }
  if (!cell) cell = sh.cells[k] = {};
  cell.v = String(v);
  // 글이 바뀌면 부분 서식은 바뀐 곳만 갈아 끼우고 나머지는 그대로 (수식이 되면 버림)
  if (cell.rt){
    const nr = cell.v[0] === '=' ? [] : spliceRuns(cell.rt, cell.v);
    if (nr.some(x => Object.keys(x).length > 1)) cell.rt = nr; else delete cell.rt;
  }
}
function ensureCell(r,c){ const k = r+':'+c; return sh.cells[k] || (sh.cells[k] = {}); }
function clean(r,c){
  const k = r+':'+c, cell = sh.cells[k]; if (!cell) return;
  if (cell.s && !Object.keys(cell.s).length) delete cell.s;
  if (cell.v == null) delete cell.rt;
  if (cell.v == null && !cell.s && !cell.goal) delete sh.cells[k];
}
const EMPTY = {};
// 기본: 줄 바꿈 켜짐(숫자는 쪼개지지 않게 한 줄), 세로 위치는 위쪽.
// 칸에 wrap:false 나 va:'middle'/'bottom'을 따로 정하면 그것을 따른다.
const wrapOn = (s, v) => s.wrap !== false && !(v != null && v !== '' && isNum(v));
const vaOf = s => s.va || 'top';
function st(r,c){
  const cell = sh.cells[r+':'+c], cs = sh.colStyle[c], rs = sh.rowStyle[r];
  if (!cs && !rs) return (cell && cell.s) || EMPTY;
  return Object.assign({}, cs, rs, cell && cell.s);
}
function buildMerges(){
  sheetChars = null;
  computeHidden();
  mergeIdx = new Map();
  for (const m of sh.merges) for (let r = m.r1; r <= m.r2; r++) for (let c = m.c1; c <= m.c2; c++) mergeIdx.set(r*COLS+c, m);
}
const mergeOf = (r,c) => mergeIdx.get(r*COLS+c);

// ===== 병합 =====
function doMerge(kind){
  if (editing) commitEdit();
  const s = {...sel};
  if (kind === 'unmerge'){
    if (!sh.merges.some(m => inter(m, s))) return toast('병합된 칸이 없습니다');
    return mutate(() => { sh.merges = sh.merges.filter(m => !inter(m, s)); });
  }
  if ((s.r2-s.r1+1)*(s.c2-s.c1+1) > 20000) return toast('병합하기에는 범위가 너무 큽니다');
  const rects = kind === 'mergeAcross' ? Array.from({length: s.r2-s.r1+1}, (_, i) => ({r1:s.r1+i, r2:s.r1+i, c1:s.c1, c2:s.c2})) : [s];
  if (rects.every(R => R.r1 === R.r2 && R.c1 === R.c2)) return toast('두 칸 이상 선택한 뒤 병합하세요');
  let lost = false;
  mutate(() => {
    sh.merges = sh.merges.filter(m => !inter(m, s));
    for (const R of rects){
      if (R.r1 === R.r2 && R.c1 === R.c2) continue;
      let first = null, count = 0;
      for (let r = R.r1; r <= R.r2; r++) for (let c = R.c1; c <= R.c2; c++) if (getV(r,c) !== ''){ count++; if (!first) first = {r, c, v:getV(r,c)}; }
      if (count > 1) lost = true;
      for (let r = R.r1; r <= R.r2; r++) for (let c = R.c1; c <= R.c2; c++) if (r !== R.r1 || c !== R.c1) setV(r,c,'');
      if (first) setV(R.r1, R.c1, first.v);
      sh.merges.push({...R});
      if (kind !== 'mergeOnly'){ const cell = ensureCell(R.r1, R.c1); cell.s = cell.s || {}; cell.s.ha = 'center'; }
    }

  else doMerge('mergeCenter');

function shiftAxis(axis, at, n, del){

  const max = axis === 'r' ? ROWS : COLS;
  const map = i => del ? (i < at ? i : i < at+n ? -1 : i-n) : (i < at ? i : i+n < max ? i+n : -1);
  const nc = {};
  for (const k in sh.cells){
    let [r, c] = k.split(':').map(Number);
    if (axis === 'r'){ r = map(r); if (r < 0) continue; } else { c = map(c); if (c < 0) continue; }
    nc[r+':'+c] = sh.cells[k];
  }
  sh.cells = nc;
  const ro = o => { const x = {}; for (const k in o){ const i = map(+k); if (i >= 0) x[i] = o[k]; } return x; };
  if (axis === 'r'){ sh.rowH = ro(sh.rowH); sh.rowManual = ro(sh.rowManual); sh.rowStyle = ro(sh.rowStyle); }
  else { sh.colW = ro(sh.colW); sh.colStyle = ro(sh.colStyle); }
  const a1 = axis+'1', a2 = axis+'2', out = [];
  for (const m of sh.merges){
    let a = m[a1], b = m[a2];
    if (!del){ if (a >= at) a += n; if (b >= at) b += n; b = Math.min(b, max-1); if (a > max-1) continue; }
    else { const e = at+n-1; a = a < at ? a : a > e ? a-n : at; b = b < at ? b : b > e ? b-n : at-1; if (b < a) continue; }
    const nm = {...m, [a1]:a, [a2]:b};
    if (nm.r1 === nm.r2 && nm.c1 === nm.c2) continue;
    out.push(nm);
  }
  sh.merges = out;
  for (const im of (sh.images || [])){
    const i = map(im[axis]);
    if (i >= 0) im[axis] = i; else { im[axis] = Math.min(at, max - 1); im[axis === 'r' ? 'dy' : 'dx'] = 0; }
  }
  if (sh.cf) sh.cf = sh.cf.filter(rule => {
    let a = rule.range[a1], b = rule.range[a2];
    if (!del){ if (a >= at) a += n; if (b >= at) b += n; b = Math.min(b, max - 1); if (a > max - 1) return false; }
    else { const e = at + n - 1; a = a < at ? a : a > e ? a - n : at; b = b < at ? b : b > e ? b - n : at - 1; if (b < a) return false; }
    rule.range = {...rule.range, [a1]: a, [a2]: b}; return true;
  });
}
function insertRows(){ const n = sel.r2-sel.r1+1; if (n >= ROWS) return; mutate(() => shiftAxis('r', sel.r1, n, false)); }
function deleteRows(){ const n = sel.r2-sel.r1+1; mutate(() => shiftAxis('r', sel.r1, n, true)); clampSel(); afterSel(); }
function insertCols(){ const n = sel.c2-sel.c1+1; if (n >= COLS) return; mutate(() => shiftAxis('c', sel.c1, n, false)); }

const LISTS = [
  ['월','화','수','목','금','토','일'], ['월요일','화요일','수요일','목요일','금요일','토요일','일요일'],
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],
  ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
  ['January','February','March','April','May','June','July','August','September','October','November','December'],
  ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'],
  ['1분기','2분기','3분기','4분기'], ['갑','을','병','정','무','기','경','신','임','계'],
  ['가','나','다','라','마','바','사','아','자','차','카','타','파','하'],
  ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'],
  '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳'.split('')

const PLAIN = /^[-+]?(\d{1,3}(,\d{3})+|\d+)(\.\d+)?$/;
const DATE = /^(\d{4})([-./])(\d{1,2})\2(\d{1,2})\.?$/;
const mod = (a, n) => ((a % n) + n) % n;
function series(vals, n, copyOnly){
  const L = vals.length, out = [];
  const cyc = () => { for (let i = 0; i < n; i++) out.push(vals[i % L]); return out; };
  if (copyOnly || vals.every(v => v === '')) return cyc();
  if (vals.every(v => PLAIN.test(String(v).trim()))){
    const nums = vals.map(v => parseFloat(String(v).replace(/,/g, '')));
    const step = L > 1 ? (nums[L-1] - nums[0]) / (L-1) : 1;
    const dec = Math.max(0, ...vals.map(v => (String(v).split('.')[1] || '').length));
    const comma = vals.some(v => String(v).includes(','));
    for (let i = 0; i < n; i++){
      const x = nums[L-1] + step*(i+1);
      out.push(comma ? x.toLocaleString('en-US', {minimumFractionDigits:dec, maximumFractionDigits:dec}) : x.toFixed(dec));
    }
    return out;
  }
  for (const list of LISTS){
    const idx = vals.map(v => list.indexOf(String(v).trim()));
    if (idx.every(i => i >= 0)){
      const step = L > 1 ? idx[L-1] - idx[L-2] || 1 : 1;
      for (let i = 0; i < n; i++) out.push(list[mod(idx[L-1] + step*(i+1), list.length)]);
      return out;
    }
  }
  const ds = vals.map(v => DATE.exec(String(v).trim()));
  if (ds.every(Boolean)){
    const toD = m => new Date(+m[1], +m[3]-1, +m[4]);
    const step = L > 1 ? Math.round((toD(ds[L-1]) - toD(ds[L-2])) / 864e5) || 1 : 1;
    const m = ds[L-1], sep = m[2], pad = m[3].length === 2 || m[4].length === 2;
    const p = x => pad ? String(x).padStart(2, '0') : String(x);
    for (let i = 0; i < n; i++){ const d = toD(m); d.setDate(d.getDate() + step*(i+1)); out.push(d.getFullYear() + sep + p(d.getMonth()+1) + sep + p(d.getDate())); }
    return out;
  }
  const pm = vals.map(v => /^(.*?)(\d+)(\D*)$/.exec(String(v)));
  if (pm.every(Boolean) && pm.every(m => m[1] === pm[0][1] && m[3] === pm[0][3])){
    const ns = pm.map(m => +m[2]);
    const step = L > 1 ? ns[L-1] - ns[L-2] : 1;
    const last = pm[L-1], width = last[2].length, zero = last[2].length > 1 && last[2][0] === '0';
    for (let i = 0; i < n; i++){
      const x = ns[L-1] + step*(i+1);
      out.push(last[1] + (zero && x >= 0 ? String(x).padStart(width, '0') : String(x)) + last[3]);
    }
    return out;
  }

}
const cloneS = s => s ? JSON.parse(JSON.stringify(s)) : undefined;
function applyFill(base, t, copyOnly){
  const vertical = t.c1 === base.c1 && t.c2 === base.c2;
  mutate(() => {
    let area;
    if (vertical) area = t.r2 > base.r2 ? {r1:base.r2+1, r2:t.r2, c1:t.c1, c2:t.c2} : {r1:t.r1, r2:base.r1-1, c1:t.c1, c2:t.c2};
    else area = t.c2 > base.c2 ? {r1:t.r1, r2:t.r2, c1:base.c2+1, c2:t.c2} : {r1:t.r1, r2:t.r2, c1:t.c1, c2:base.c1-1};
    sh.merges = sh.merges.filter(m => !inter(m, area));
    const fwd = vertical ? t.r2 > base.r2 : t.c2 > base.c2;
    const n = vertical ? (fwd ? t.r2-base.r2 : base.r1-t.r1) : (fwd ? t.c2-base.c2 : base.c1-t.c1);
    const lanes = vertical ? range(base.c1, base.c2) : range(base.r1, base.r2);
    for (const lane of lanes){
      let src = vertical ? range(base.r1, base.r2).map(r => [r, lane]) : range(base.c1, base.c2).map(c => [lane, c]);
      if (!fwd) src.reverse();
      const cells = src.map(([r,c]) => ({v:getV(r,c), s:(sh.cells[r+':'+c] || {}).s, rt: runsOf(r, c)}));
      const vals = series(cells.map(x => x.v), n, copyOnly), hasF = cells.some(x => isFormula(x.v));
      for (let i = 0; i < n; i++){
        const off = fwd ? (vertical ? base.r2 : base.c2) + 1 + i : (vertical ? base.r1 : base.c1) - 1 - i;
        const r = vertical ? off : lane, c = vertical ? lane : off;
        const s = cloneS(cells[i % cells.length].s);
        const k = r+':'+c;
        let val = vals[i];
        if (hasF){ const si = i % cells.length, [sr, scc] = src[si]; val = isFormula(cells[si].v) ? shiftFormula(cells[si].v, r - sr, c - scc) : cells[si].v; }
        const o = {}; if (val !== '') o.v = String(val); if (s) o.s = s;
        const sc = cells[i % cells.length]; if (sc.rt && o.v === sc.v) o.rt = cloneS(sc.rt);   // 같은 글을 이어 채울 때는 부분 서식도
        if (o.v != null || o.s) sh.cells[k] = o; else delete sh.cells[k];
      }
    }
  });
  setRange(t, act);
}

// ===== 숫자 서식 (보여 주는 모양만 바꾸고 값은 그대로) =====
const pad2 = n => String(n).padStart(2, '0');
function fmtValue(v, s){
  if (!s || !s.nf || v === '' || v == null || s.nf === 'text') return v;
  const t = String(v).trim();
  if (s.nf === 'date' || s.nf === 'date2'){
    const m = DATE.exec(t); if (!m) return v;
    return s.nf === 'date' ? `${m[1]}-${pad2(+m[3])}-${pad2(+m[4])}` : `${m[1]}년 ${+m[3]}월 ${+m[4]}일`;
  }
  const pct = t.endsWith('%');
  if (!PLAIN.test(pct ? t.slice(0, -1) : t)) return v;
  let n = parseFloat(t.replace(/[,%]/g, '')); if (pct) n /= 100;
  const nd = Math.max(0, Math.min(10, s.nd ?? 0));
  const show = x => Math.abs(x).toLocaleString('en-US', {minimumFractionDigits: nd, maximumFractionDigits: nd});
  if (s.nf === 'num') return (n < 0 ? '-' : '') + show(n);
  if (s.nf === 'cur') return (n < 0 ? '-₩' : '₩') + show(n);
  if (s.nf === 'pct') return (n < 0 ? '-' : '') + show(n * 100) + '%';
  return v;
}
function numFmtOf(s){
  const nd = Math.max(0, s.nd ?? 0), dec = nd ? '.' + '0'.repeat(nd) : '';
  return {num: '#,##0' + dec, cur: '"₩"#,##0' + dec, pct: '0' + dec + '%', date: 'yyyy-mm-dd', date2: 'yyyy"년" m"월" d"일"', text: '@'}[s.nf] || null;
}
function stepDecimals(d){
  const s = st(act.r, act.c);
  let nd = s.nd;
  if (nd == null){ const m = /\.(\d+)/.exec(String(getV(act.r, act.c)).replace(/,/g, '')); nd = m ? m[1].length : 0; }
  applyStyle({nf: s.nf && s.nf !== 'text' && !s.nf.startsWith('date') ? s.nf : 'num', nd: Math.max(0, Math.min(10, nd + d))});
  growColsToFit(sel.c1, Math.min(sel.c2, sel.c1 + 60));
}
// 서식을 바꿔서 글자가 칸보다 길어지면 열을 넓힘 (좁히지는 않음). 같은 실행 취소 단계에 포함
function growColsToFit(c1, c2){
  let changed = false;
  for (let c = c1; c <= c2; c++){
    let need = 0;
    for (const k in sh.cells){ const i = k.indexOf(':'); if (+k.slice(i + 1) === c) need = Math.max(need, textWidthOf(+k.slice(0, i), c)); }
    if (need > cw(c)){ sh.colW[c] = Math.ceil(need) + 4; changed = true; }
  }
  if (changed) afterChange();
}

// ===== 정렬 =====
function rowHasData(r, c1, c2){ for (let c = c1; c <= c2; c++) if (getV(r, c) !== '') return true; return false; }
function colHasData(c, r1, r2){ for (let r = r1; r <= r2; r++) if (getV(r, c) !== '') return true; return false; }
// 선택한 칸이 들어 있는 표 범위 (빈 행·빈 열로 둘러싸인 덩어리, 엑셀의 '현재 영역')
function currentRegion(r, c){
  const R = {r1: r, r2: r, c1: c, c2: c};
  for (let ch = true; ch;){
    ch = false;
    const ca = Math.max(0, R.c1 - 1), cb = Math.min(COLS - 1, R.c2 + 1), ra = Math.max(0, R.r1 - 1), rb = Math.min(ROWS - 1, R.r2 + 1);
    if (R.r1 > 0 && rowHasData(R.r1 - 1, ca, cb)){ R.r1--; ch = true; }
    if (R.r2 < ROWS - 1 && rowHasData(R.r2 + 1, ca, cb)){ R.r2++; ch = true; }
    if (R.c1 > 0 && colHasData(R.c1 - 1, ra, rb)){ R.c1--; ch = true; }
    if (R.c2 < COLS - 1 && colHasData(R.c2 + 1, ra, rb)){ R.c2++; ch = true; }
  }
  return R;
}
// 첫 행이 제목 줄인지 추측: 굵게/채우기가 있거나, 아래는 숫자인데 첫 칸만 글자면 제목
function guessHeader(R, col){
  if (R.r2 <= R.r1) return false;
  for (let c = R.c1; c <= R.c2; c++){ const s = st(R.r1, c); if (s.b || s.bg) return true; }
  const top = shown(R.r1, col), below = [];
  for (let r = R.r1 + 1; r <= Math.min(R.r2, R.r1 + 20); r++) below.push(shown(r, col));
  const nums = below.filter(v => isNum(v)).length;

}
function sortRows(R, col, desc, header){

  const body = {r1, r2: R.r2, c1: R.c1, c2: R.c2};
  if (sh.merges.some(m => inter(m, body))) return toast('병합된 칸이 있어서 정렬할 수 없어요. 병합을 먼저 풀어 주세요');
  const num = v => parseFloat(String(v).replace(/[,%]/g, ''));
  const isN = v => { const t = String(v).trim(); return PLAIN.test(t.endsWith('%') ? t.slice(0, -1) : t); };
  const rows = [];
  for (let r = r1; r <= R.r2; r++){
    const cells = []; for (let c = R.c1; c <= R.c2; c++) cells.push(sh.cells[r + ':' + c]);
    rows.push({cells, key: shown(r, col), i: r});
  }
  // 엑셀과 같은 순서: 오름차순은 숫자 → 글자, 빈 칸은 항상 맨 아래
  rows.sort((a, b) => {
    const A = a.key, B = b.key;
    if (A === '' || B === '') return A === B ? a.i - b.i : A === '' ? 1 : -1;
    const an = isN(A), bn = isN(B);

}

function shownIn(s, r, c){
  const cell = s.cells[r + ':' + c]; if (!cell || cell.v == null) return '';
  const v = cell.v;

}

// --- 참조 고치기: 복사(상대 참조 이동), 행/열 넣기·지우기 ---
const refText = a => (a.ca ? '$' : '') + colName(a.c) + (a.ra ? '$' : '') + (a.r + 1);
// 수식 글자 속 참조마다 fn(tok)을 불러 새 글자로 바꾼다 (따옴표 속 글자는 건드리지 않음)
function mapRefs(f, fn){
  let out = '', i = 1, prev = '=';
  out = '=';
  while (i < f.length){
    const ch = f[i];
    if (ch === '"'){ let j = i + 1; for (; j < f.length; j++){ if (f[j] === '"'){ if (f[j + 1] === '"'){ j++; continue; } break; } } out += f.slice(i, j + 1); i = j + 1; prev = '"'; continue; }
    const rest = f.slice(i);
    if (!/[\w$.'ㄱ-힝]/.test(prev)){
      let sheet = null, j = 0;
      const sm = RE_SHEET.exec(rest); if (sm){ sheet = sm[1] != null ? sm[1].replace(/''/g, "'") : sm[2]; j = sm[0].length; }
      const after = rest.slice(j);
      let m = RE_CELLRANGE.exec(after);
      if (m){
        const a = {c: colNum(m[2]), r: +m[4] - 1, ca: !!m[1], ra: !!m[3]};
        const b = m[6] ? {c: colNum(m[6]), r: +m[8] - 1, ca: !!m[5], ra: !!m[7]} : null;
        const repl = fn({sheet, a, b});
        out += repl == null ? rest.slice(0, j + m[0].length) : (sm ? sm[0] : '') + repl;
        i += j + m[0].length; prev = 'A'; continue;
      }
      m = RE_COLRANGE.exec(after);
      if (m){ out += rest.slice(0, j + m[0].length); i += j + m[0].length; prev = 'A'; continue; }
      if (sm){ out += sm[0]; i += j; prev = '!'; continue; }
    }
    out += ch; prev = ch; i++;
  }
  return out;
}
function shiftFormula(f, dr, dc){
  if ((!dr && !dc) || !isFormula(f)) return f;
  return mapRefs(f, ({a, b}) => {
    const mv = p => ({...p, r: p.ra ? p.r : p.r + dr, c: p.ca ? p.c : p.c + dc});
    const A2 = mv(a), B2 = b ? mv(b) : null;
    const bad = p => p.r < 0 || p.r >= ROWS || p.c < 0 || p.c >= COLS;
    if (bad(A2) || (B2 && bad(B2))) return '#REF!';
    return refText(A2) + (B2 ? ':' + refText(B2) : '');
  });
}
// 행/열 넣기·지우기 때 모든 시트의 수식에서 이 시트를 가리키는 참조를 고친다
function shiftRefsForAxis(target, axis, at, n, del){
  const max = axis === 'r' ? ROWS : COLS, key = axis === 'r' ? 'r' : 'c', e = at + n - 1;
  for (const s of wb.sheets) for (const k in s.cells){
    const cell = s.cells[k]; if (!isFormula(cell.v)) continue;
    const nv = mapRefs(cell.v, ({sheet, a, b}) => {
      const ts = sheet == null ? s : wb.sheets.find(x => x.name.toLowerCase() === sheet.toLowerCase());
      if (ts !== target) return null;
      const one = (p, end) => {
        let i = p[key];
        if (!del){ if (i >= at) i += n; if (i >= max) return null; }
        else if (i >= at && i <= e){ if (!b) return null; i = end ? at - 1 : at; }
        else if (i > e) i -= n;
        return {...p, [key]: i};
      };
      const A2 = one(a, false); if (!b) return A2 ? refText(A2) : '#REF!';
      const B2 = one(b, true); if (!A2 || !B2 || B2[key] < A2[key]) return '#REF!';
      return refText(A2) + ':' + refText(B2);
    });
    if (nv !== cell.v) cell.v = nv;
  }
}

// 입력을 마칠 때: 수식이면 함수 이름·참조를 대문자로 정리
function normalizeFormula(fm){
  const g = mapRefs(fm, ({a, b}) => refText(a) + (b ? ':' + refText(b) : ''));
  return g.split('"').map((seg, i) => i % 2 ? seg : seg.replace(/([A-Za-z][A-Za-z0-9.]*)(?=\()/g, m => m.toUpperCase())).join('"');
}
function finalizeInput(v){
  if (!isFormula(v)) return v;
  const n = normalizeFormula(v);
  try { parseFormula(n.slice(1)); } catch (e){ toast('수식에 오류가 있어요. 괄호, 쉼표, 따옴표를 확인해 주세요'); }
  return n;
}

// --- 수식 입력 중 칸을 누르면 그 칸 주소가 들어감 (끌면 범위) ---
let pointRef = null;   // {start, end, r1, c1, r2, c2}: 방금 넣은 참조 글자 위치
function pointModeOK(){
  if (!editing || !isFormula(ed.value)) return false;
  const p = ed.selectionStart;
  if (pointRef && pointRef.end === p) return true;
  return /[=(,+\-*/^&<>:]\s*$/.test(ed.value.slice(0, p));
}
function pointInsert(r1, c1, r2, c2){
  const t = refText({r: Math.min(r1, r2), c: Math.min(c1, c2)}) + (r1 !== r2 || c1 !== c2 ? ':' + refText({r: Math.max(r1, r2), c: Math.max(c1, c2)}) : '');
  const p = ed.selectionStart, keep = pointRef && pointRef.end === p;
  const start = keep ? pointRef.start : p, end = keep ? pointRef.end : ed.selectionEnd;
  ed.value = ed.value.slice(0, start) + t + ed.value.slice(end);
  ed.setSelectionRange(start + t.length, start + t.length);
  pointRef = {start, end: start + t.length, r1: Math.min(r1, r2), c1: Math.min(c1, c2), r2: Math.max(r1, r2), c2: Math.max(c1, c2)};
  sizeEditor(); fx.value = ed.value; updateFnHint(); schedule();
}

// --- 함수 이름 후보와 설명 ---
const fnHint = document.createElement('div'); fnHint.id = 'fnHint'; fnHint.hidden = true; document.body.appendChild(fnHint);
let fnList = null, fnSelI = 0;   // 후보 목록이 떠 있을 때 {names, typed}
function hideFnHint(){ fnHint.hidden = true; fnList = null; }
function placeFnHint(){ const b = ed.getBoundingClientRect(); fnHint.style.left = Math.max(8, Math.min(b.left, innerWidth - 360)) + 'px'; fnHint.style.top = (b.bottom + 4) + 'px'; }
// 커서 앞에서 아직 닫히지 않은 가장 안쪽 함수와 몇 번째 값을 쓰는 중인지
function openCall(before){
  const stack = []; let inStr = false;
  for (let i = 0; i < before.length; i++){
    const ch = before[i];
    if (ch === '"'){ inStr = !inStr; continue; } if (inStr) continue;
    if (ch === '('){ const m = /([A-Za-z][A-Za-z0-9.]*)$/.exec(before.slice(0, i)); stack.push({name: m ? m[1].toUpperCase() : '', arg: 0}); }
    else if (ch === ')') stack.pop();
    else if ((ch === ',' || ch === ';') && stack.length) stack[stack.length - 1].arg++;
  }
  return stack.length ? stack[stack.length - 1] : null;
}
function updateFnHint(){
  if (!editing || !isFormula(ed.value)) return hideFnHint();
  const before = ed.value.slice(0, ed.selectionStart);
  const m = /(?:^=|[=(,+\-*/^&<>:\s])([A-Za-z][A-Za-z.]*)$/.exec(before);
  if (m){
    const q = m[1].toUpperCase(), names = Object.keys(FN_HELP).filter(n => n.startsWith(q)).slice(0, 7);
    if (names.length && !(names.length === 1 && names[0] === q && FN[q] && before.endsWith('('))){
      fnList = {names, typed: m[1].length}; fnSelI = Math.min(fnSelI, names.length - 1);
      fnHint.innerHTML = names.map((n, i) => `<div class="fh-item${i === fnSelI ? ' on' : ''}" data-n="${n}"><b>${n}</b><span>${FN_HELP[n][1]}</span></div>`).join('') + '<div class="fh-tip">Tab으로 넣기</div>';
      fnHint.hidden = false; placeFnHint(); return;
    }
  }
  fnList = null;
  const call = openCall(before);
  if (call && FN_HELP[call.name]){
    const [sig, desc] = FN_HELP[call.name];
    const parts = sig.slice(sig.indexOf('(') + 1, sig.lastIndexOf(')')).split(', ');
    const argI = Math.min(call.arg, parts.length - 1);
    const sigHtml = esc(call.name) + '(' + parts.map((p, i) => i === argI || (i === parts.length - 1 && p.includes('…') && call.arg >= i) ? `<b>${esc(p)}</b>` : esc(p)).join(', ') + ')';
    fnHint.innerHTML = `<div class="fh-sig">${sigHtml}</div><div class="fh-desc">${esc(desc)}</div>`;
    fnHint.hidden = false; placeFnHint(); return;
  }
  hideFnHint();
}
function acceptFn(name){
  if (!fnList) return;
  const p = ed.selectionStart, start = p - fnList.typed;
  ed.value = ed.value.slice(0, start) + name + '(' + ed.value.slice(p);
  const q = start + name.length + 1; ed.setSelectionRange(q, q);
  fnSelI = 0; sizeEditor(); fx.value = ed.value; updateFnHint(); ed.focus();
}
fnHint.addEventListener('mousedown', e => { e.preventDefault(); const it = e.target.closest('[data-n]'); if (it) acceptFn(it.dataset.n); });
ed.addEventListener('keyup', e => { if (editing && !['Tab', 'ArrowUp', 'ArrowDown', 'Escape', 'Enter'].includes(e.key)) updateFnHint(); });
ed.addEventListener('click', () => { if (editing) updateFnHint(); });

// --- 자동 합계 (Σ) ---
function autoSum(fn){
  if (editing) commitEdit();
  const multi = (sel.r1 !== sel.r2 || sel.c1 !== sel.c2) && !fullCols(sel) && !fullRows(sel);
  if (multi){
    if (sel.r2 > sel.r1 && sel.r2 + 1 < ROWS){
      const r = sel.r2 + 1;
      mutate(() => { for (let c = sel.c1; c <= sel.c2; c++) setV(r, c, `=${fn}(${refText({r: sel.r1, c})}:${refText({r: sel.r2, c})})`); });
      setRange({r1: r, r2: r, c1: sel.c1, c2: sel.c2}); return;
    }
    if (sel.c2 + 1 < COLS){
      const c = sel.c2 + 1;
      mutate(() => setV(sel.r1, c, `=${fn}(${refText({r: sel.r1, c: sel.c1})}:${refText({r: sel.r1, c: sel.c2})})`));
      setSel(sel.r1, c); return;
    }
  }
  const r = act.r, c = act.c, isN = (rr, cc) => typeof cellValue(sh, rr, cc) === 'number';
  let rg = '', r1 = r; while (r1 - 1 >= 0 && isN(r1 - 1, c)) r1--;
  if (r1 < r) rg = `${refText({r: r1, c})}:${refText({r: r - 1, c})}`;
  else { let c1 = c; while (c1 - 1 >= 0 && isN(r, c1 - 1)) c1--; if (c1 < c) rg = `${refText({r, c: c1})}:${refText({r, c: c - 1})}`; }
  const text = `=${fn}(${rg})`;
  startEdit('edit', text);
  if (!rg) ed.setSelectionRange(text.length - 1, text.length - 1);
  focusGrid(); updateFnHint();

// ===== 차트 =====
// 그림처럼 떠 있는 개체(sh.images 안에 kind: 'chart'). 데이터 범위가 바뀌면 바로 다시 그린다.
const CHART_COLORS = ['#2E5BD0', '#F28C28', '#2BA36B', '#D64545', '#8E5CD9', '#1BA3B8', '#C7A21B', '#6B7385'];

  let cats = [], series = [];
  if (!ch.byRow){
    for (let r = dr1; r <= R.r2; r++) cats.push(firstColCat ? shown(r, R.c1) : String(r - dr1 + 1));
    for (let c = cc1; c <= R.c2; c++) series.push({name: header ? shown(R.r1, c) : `계열 ${c - cc1 + 1}`, values: range(dr1, R.r2).map(r => { const v = cellValue(sh, r, c); return typeof v === 'number' ? v : null; })});
  } else {
    for (let c = cc1; c <= R.c2; c++) cats.push(header ? shown(R.r1, c) : String(c - cc1 + 1));
    for (let r = dr1; r <= R.r2; r++) series.push({name: firstColCat ? shown(r, R.c1) : `계열 ${r - dr1 + 1}`, values: range(cc1, R.c2).map(c => { const v = cellValue(sh, r, c); return typeof v === 'number' ? v : null; })});

  // 범례

// ===== 쪽 미리보기 =====
// 시트 내용을 고른 종이 크기의 쪽으로 나눠 보여 준다. 글은 종이 폭에 맞춰 다시 줄 바꿈하고,
// 긴 칸도 줄 단위로 다음 쪽에 이어진다. 인쇄/PDF도 이 쪽 나눔 그대로 나온다.
const PAPER = {A4: [210, 297], A5: [148, 210], A6: [105, 148], B4: [257, 364], B5: [182, 257], B6: [128, 182]};
const MM = 96 / 25.4;   // 1mm = 3.78px (화면·인쇄 공통 96dpi 기준)
function pageSetup(){ return Object.assign({size: 'A5', orient: 'p', margin: 'normal', m: null, num: true, spread: false, bookStart: false, zoom: 1, mode: 'cells', order: 'col', newPage: true, scope: 'all'}, sh.pageSetup || {}); }
// 펼친 면에서 이 쪽이 왼쪽 면인가 (기본: 1쪽이 왼쪽 / 책 방식: 1쪽이 오른쪽)
const isLeftPage = (i, ps) => ps.bookStart ? i % 2 === 1 : i % 2 === 0;

  if (ps.mode === 'cells'){

    for (let r = R.r1; r <= R.r2; r++) for (let c = R.c1; c <= R.c2; c++){
      if (hiddenRows.has(r)) continue;
      const m = mergeOf(r, c); if (m && (m.r1 !== r || m.c1 !== c)) continue;

    } else if (filled.length === 1){

      const c = filled[0], s = stShow(r, c), text = String(fmtValue(shown(r, c), s));

      }
    } else {
      // 여러 칸짜리 줄: 표로 보고 칸 너비를 종이 폭에 맞춰 줄임
      const cells = filled.map(c => {
        const m = mergeOf(r, c), c2 = m ? m.c2 : c, s = stShow(r, c), text = String(fmtValue(shown(r, c), s));

      const src = im.kind === 'chart' ? chartToDataURL(im, 2) : (wb.media || {})[im.id];
      if (src){ cur().push({k: 'img', y, w: iw, h: Math.min(ih, H), src}); y += ih + 6; }
    }

}

function applyMove(B, T, copy){
  const inR = (R, r, c) => r >= R.r1 && r <= R.r2 && c >= R.c1 && c <= R.c2;
  const keyRC = k => { const i = k.indexOf(':'); return [+k.slice(0,i), +k.slice(i+1)]; };
  let occupied = false;
  for (const k in sh.cells){
    const [r, c] = keyRC(k);
    if (inR(T, r, c) && sh.cells[k].v != null && (copy || !inR(B, r, c))){ occupied = true; break; }
  }
  const go = () => {
    const dr = T.r1 - B.r1, dc = T.c1 - B.c1;
    mutate(() => {
      const src = [];
      for (const k in sh.cells){ const [r, c] = keyRC(k); if (inR(B, r, c)) src.push([r, c, JSON.parse(JSON.stringify(sh.cells[k]))]); }
      const ms = sh.merges.filter(m => contains(B, m));
      if (!copy){ for (const [r, c] of src) delete sh.cells[r+':'+c]; sh.merges = sh.merges.filter(m => !contains(B, m)); }
      for (const k of Object.keys(sh.cells)){ const [r, c] = keyRC(k); if (inR(T, r, c)) delete sh.cells[k]; }
      sh.merges = sh.merges.filter(m => !inter(m, T));
      for (const [r, c, cell] of src) sh.cells[(r+dr)+':'+(c+dc)] = cell;
      for (const m of ms) sh.merges.push({r1:m.r1+dr, r2:m.r2+dr, c1:m.c1+dc, c2:m.c2+dc});
    });
    if (clip && !copy) clip = null;
    setRange(T, {r:act.r+dr, c:act.c+dc}); ensureVisible(T.r1, T.c1);
  };
  if (occupied) modal('내용 덮어쓰기', '<p>옮길 위치에 이미 내용이 있습니다. 덮어쓸까요? 실행 취소(Ctrl+Z)로 되돌릴 수 있습니다.</p>', '덮어쓰기', go);
  else go();
}

  const box = $('#tabs'); box.innerHTML = '';
  wb.sheets.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === wb.active ? ' active' : ''); b.textContent = s.name;
    b.onclick = () => switchSheet(i);
    b.ondblclick = () => renameSheet(i, b);
    b.oncontextmenu = e => { e.preventDefault(); openTabMenu(i, e.clientX, e.clientY, b); };
    box.appendChild(b);
  });
}
function switchSheet(i){
  if (editing) commitEdit();
  if (i === wb.active) return focusGrid();
  wb.active = i; sh = wb.sheets[i]; clip = clip && clip.sheet === i ? clip : clip;
  buildMerges(); layout(); wrap.scrollTo(0, 0); setSel(0, 0); renderTabs(); queueAutosave(); focusGrid();
}
function renameSheet(i, btn){
  const inp = document.createElement('input'); inp.value = wb.sheets[i].name; btn.textContent = ''; btn.appendChild(inp); inp.focus(); inp.select();
  let done = false;
  const fin = ok => {
    if (done) return; done = true;
    const v = inp.value.trim();
    if (ok && v && v !== wb.sheets[i].name){
      if (wb.sheets.some((s, j) => j !== i && s.name === v)) toast('같은 이름의 시트가 이미 있습니다');
      else mutate(() => { wb.sheets[i].name = v.slice(0, 31); });
    }
    renderTabs(); focusGrid();
  };
  inp.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') fin(true); if (e.key === 'Escape') fin(false); };
  inp.onblur = () => fin(true);
  inp.onclick = e => e.stopPropagation();
}
function uniqueName(base){ let n = 1, name = base; while (wb.sheets.some(s => s.name === name)) name = base + ' ' + (++n); return name; }
function addSheet(){
  if (editing) commitEdit();
  let n = wb.sheets.length + 1; while (wb.sheets.some(s => s.name === 'Sheet' + n)) n++;
  mutate(() => { wb.sheets.push(newSheet('Sheet' + n)); });
  switchSheet(wb.sheets.length - 1); renderTabs();
}
function openTabMenu(i, x, y, btn){
  showMenu(x, y, [
    {label:'이름 바꾸기', run: () => renameSheet(i, btn)},
    {label:'복제', run: () => { mutate(() => { const c = JSON.parse(JSON.stringify(wb.sheets[i])); c.name = uniqueName(c.name + ' 복사본'); wb.sheets.splice(i+1, 0, c); }); switchSheet(i+1); renderTabs(); }},
    {label:'왼쪽으로 옮기기', run: () => moveSheet(i, -1)},
    {label:'오른쪽으로 옮기기', run: () => moveSheet(i, 1)},
    '-',
    {label:'시트 삭제', run: () => {
      if (wb.sheets.length === 1) return toast('시트가 하나뿐이라 삭제할 수 없습니다');
      modal('시트 삭제', `<p>“${esc(wb.sheets[i].name)}” 시트를 삭제할까요? 실행 취소(Ctrl+Z)로 되돌릴 수 있습니다.</p>`, '삭제', () => {
        mutate(() => { wb.sheets.splice(i, 1); if (wb.active >= wb.sheets.length) wb.active = wb.sheets.length - 1; else if (wb.active > i) wb.active--; });
        sh = wb.sheets[wb.active]; clip = null; buildMerges(); layout(); setSel(0, 0); renderTabs();
      });
    }}
  ]);
}
function moveSheet(i, d){
  const j = i + d; if (j < 0 || j >= wb.sheets.length) return;
  mutate(() => { const [s] = wb.sheets.splice(i, 1); wb.sheets.splice(j, 0, s); if (wb.active === i) wb.active = j; else if (wb.active === j) wb.active = i; });
  sh = wb.sheets[wb.active]; renderTabs();
}

// ===== 메뉴, 팝업, 대화상자 =====
function place(el, x, y){
  el.hidden = false;
  const r = el.getBoundingClientRect();
  el.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + 'px';
  el.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + 'px';
}
function showMenu(x, y, items){
  hideMenus();
  menuOpenedAt = Date.now();
  menuEl.innerHTML = items.map((it, i) => it === '-' ? '<div class="msep"></div>' :
    `<button class="mi${it.disabled ? ' dis' : ''}" data-i="${i}"${it.title ? ` title="${esc(it.title)}"` : ''}>${it.icon || '<span class="sp"></span>'}<span class="${it.cls || ''}">${it.label}</span>${it.kbd ? `<kbd>${it.kbd}</kbd>` : ''}${it.pin ? `<span class="mpin${it.pinned ? ' on' : ''}" data-pin="1" title="${it.pinned ? '즐겨찾기에서 빼기' : '즐겨찾기에 고정'}"><svg viewBox="0 0 16 16" fill="${it.pinned ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M6 2h4l-.6 4 2.6 2.2H4L6.6 6z"/><path d="M8 8.2V14"/></svg></span>` : ''}</button>`).join('');
  menuEl.onclick = e => {
    const b = e.target.closest('[data-i]'); if (!b) return;
    const it = items[+b.dataset.i]; if (it.disabled) return;
    if (it.pin && e.target.closest('[data-pin]')){ it.pin(); return; }   // 핀: 메뉴를 닫지 않음
    hideMenus(); it.run();
  };
  place(menuEl, x, y);
}
function showPop(anchor, html, bind){
  hideMenus();
  pop.innerHTML = html; bind(pop);
  const r = anchor.getBoundingClientRect();
  place(pop, r.left - 10, r.bottom + 4);
}
function hideMenus(){ menuEl.hidden = true; pop.hidden = true; }
// 바깥을 누르면 메뉴 닫기. 단, 방금 연 메뉴는 그 누름 자체로 닫히지 않게 잠깐 무시
let menuOpenedAt = 0;
document.addEventListener('mousedown', e => {
  if (Date.now() - menuOpenedAt < 350) return;
  if (!menuEl.contains(e.target) && !pop.contains(e.target) && !e.target.closest('.caret')) hideMenus();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideMenus(); });

function modal(title, body, okLabel, onOk, onOpen, opts = {}){
  const back = document.createElement('div'); back.className = 'modal-back';
  back.innerHTML = `<div class="modal${opts.wide ? ' wide' : ''}" role="dialog" aria-modal="true"><h3>${title}</h3>${body}<div class="acts">${opts.noCancel ? '' : '<button data-a="no">취소</button>'}<button class="primary" data-a="ok">${okLabel}</button></div></div>`;
  document.body.appendChild(back);
  const close = () => { back.remove(); focusGrid(); };
  const ok = () => { const res = onOk(back); if (res !== false) close(); };
  back.addEventListener('click', e => { const a = e.target.dataset.a; if (a === 'no' || e.target === back) close(); if (a === 'ok') ok(); });
  back.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Escape') close(); if (e.key === 'Enter' && !e.isComposing) ok(); });
  const inp = back.querySelector('input'); (inp || back.querySelector('[data-a=ok]')).focus(); if (inp) inp.select();
  if (onOpen) onOpen(back);
}

function ovItems(){
  const cur = st(act.r, act.c).ov || null;
  const setOv = v => {
    const rows = selRowsList();
    if (v){ mutate(() => { for (const r of rows) if (!sh.rowManual[r]) sh.rowManual[r] = rh(r); }); }
    // 행 높이는 그 행의 칸들이 함께 쓰므로, 자르기와 되돌리기는 행 전체에 (한 칸이라도 '늘리기'로 남으면 그 칸 글에 맞춰 행이 다시 늘어남)
    // 넘쳐 보이기는 그 칸만 (행을 줄이려는 게 아니라서)
    const keep = {...sel}, keepAct = {...act};
    if (v !== 'spill') sel = {r1: rows[0], r2: rows[rows.length - 1], c1: 0, c2: COLS - 1};
    applyStyle({ov: v});
    sel = keep; act = keepAct; refreshUI(); schedule();
    toast(v === 'clip' ? `${rows.length > 1 ? rows.length + '개 행' : (rows[0] + 1) + '행'} 전체를 자르기로 바꿨어요. 행 경계를 끌어 줄이면 넘치는 글은 가려집니다` : v === 'spill' ? '칸보다 긴 글이 아래 빈칸으로 이어져 보입니다' : '행이 다시 글에 맞춰 늘어납니다');
  };
  return [
    {label: '칸을 글에 맞춰 늘리기 (기본)', icon: cur ? null : CHECK, run: () => setOv(null)},
    {label: '칸 크기에서 자르기 (칸을 줄일 수 있음)', icon: cur === 'clip' ? CHECK : null, run: () => setOv('clip')},
    {label: '아래 빈칸으로 넘쳐 보이기', icon: cur === 'spill' ? CHECK : null, run: () => setOv('spill')},
    {label: '잘린 칸을 누르면 펼쳐 보기', icon: sh.peek !== false ? CHECK : null, run: () => { mutate(() => { if (sh.peek === false) delete sh.peek; else sh.peek = false; }); toast(sh.peek === false ? '잘린 칸을 눌러도 펼쳐 보이지 않습니다' : '잘린 칸을 누르면 글 전체가 펼쳐 보입니다'); }},
  ];
}
// 고른 칸을 종이의 글 들어가는 부분(여백 안쪽)과 같은 크기로: 칸 안 줄 바꿈이 쪽 미리보기·인쇄와 같아짐
function fitPaperDialog(){
  if (editing) commitEdit();
  const ps = pageSetup(), cols = selColsList(), rows = selRowsList();
  const where = `${colName(cols[0])}${cols.length > 1 ? '~' + colName(cols[cols.length - 1]) : ''}열`;
  const sizes = Object.entries(PAPER).map(([k, [a, b2]]) => `<option value="${k}"${k === ps.size ? ' selected' : ''}>${k} (${a}×${b2}mm)</option>`).join('');
  modal('종이 크기에 맞추기', `<p>${where}의 칸을 종이에서 <b>글이 들어가는 부분(여백 안쪽)</b>과 같은 크기로 맞춥니다. 칸 안 줄 바꿈이 쪽 미리보기·인쇄와 똑같아져요.</p>
    <div class="bkset">
      <label>종이 <select class="ctl" id="fpS">${sizes}</select></label>
      <label>방향 <select class="ctl" id="fpO"><option value="p"${ps.orient === 'p' ? ' selected' : ''}>세로</option><option value="l"${ps.orient === 'l' ? ' selected' : ''}>가로</option></select></label>
      <label>여백 <select class="ctl" id="fpM"><option value="narrow">좁게</option><option value="normal">보통</option><option value="wide">넓게</option>${ps.margin === 'custom' ? '<option value="custom">직접 정한 여백</option>' : ''}</select></label>
      <label class="chk"><input type="checkbox" id="fpW" checked> 가로 너비 맞추기</label>
      <label class="chk"><input type="checkbox" id="fpH"> 세로 높이도 맞추기 (한 칸 = 한 쪽 높이, ${rows[0] + 1}${rows.length > 1 ? '~' + (rows[rows.length - 1] + 1) : ''}행)</label>
    </div>
    <p id="fpInfo" style="margin:8px 0 14px;color:var(--ink)"></p>`, '맞추기', b => {
    const nps = calc(b);
    if (!b.querySelector('#fpW').checked && !b.querySelector('#fpH').checked){ toast('가로나 세로 중 하나는 골라 주세요'); return false; }
    mutate(() => {
      if (b.querySelector('#fpW').checked) for (const c of cols) sh.colW[c] = nps.cwPx;
      if (b.querySelector('#fpH').checked) for (const r of rows){ sh.rowH[r] = nps.rhPx; sh.rowManual[r] = nps.rhPx; }
    });
    savePageSetup(nps.ps);   // 쪽 미리보기도 같은 종이로
    toast(`${nps.ps.size} ${nps.ps.orient === 'l' ? '가로' : '세로'} 크기로 맞췄습니다 (너비 ${nps.wmm}mm${b.querySelector('#fpH').checked ? ', 높이 ' + nps.hmm + 'mm' : ''})`);
  }, back => {
    back.querySelector('#fpM').value = ps.margin;
    const upd = () => { const n = calc(back); back.querySelector('#fpInfo').textContent = `글 들어가는 부분: 너비 ${n.wmm}mm × 높이 ${n.hmm}mm → 칸 너비 ${n.cwPx}px, 높이 ${n.rhPx}px`; };
    back.querySelectorAll('select').forEach(s => s.onchange = upd); upd();
  });
  function calc(b){
    const nps = Object.assign({}, ps, {size: b.querySelector('#fpS').value, orient: b.querySelector('#fpO').value, margin: b.querySelector('#fpM').value});
    const {w, h: hh} = paperMM(nps), M = marginsMM(nps), NUMH = nps.num ? 7 * MM : 0;
    const W = (w - M.in - M.out) * MM, H = (hh - M.t - M.b) * MM - NUMH;
    // 칸은 안쪽에 좌우 4px씩 여백이 있어서 그만큼 더해야 줄 바꿈이 같아짐
    return {ps: nps, cwPx: Math.round(W + 8), rhPx: Math.round(H), wmm: Math.round(w - M.in - M.out), hmm: Math.round(H / MM)};
  }
}
function askNumber(title, label, val, min, max, cb, step){
  modal(title, `<p>${label}</p><input class="ctl" id="mdlNum" type="number" min="${min}" max="${max}"${step ? ` step="${step}"` : ''} value="${val}">`, '적용', b => {
    const raw = parseFloat(b.querySelector('#mdlNum').value), n = step ? Math.round(raw * 100) / 100 : Math.round(raw);   // step이 있으면 소수도
    if (!(n >= min && n <= max)){ toast(`${min}~${max} 사이 숫자를 입력하세요`); return false; }
    cb(n);
  });
}

// ===== 그림으로 복사: 고른 칸을 화면에 보이는 그대로 그림(PNG)으로 =====
// 칸 그리는 코드를 그대로 쓰되, 그리는 곳만 잠깐 따로 만든 캔버스로 바꿔서 2배 선명하게 그림 (밝은 화면 기준)
async function copyRangeImage(){
  if (editing) commitEdit();
  hideMenus();
  const cols = selColsList(), rows = selRowsList();
  const R = {r1: rows[0], r2: rows[rows.length - 1], c1: cols[0], c2: cols[cols.length - 1]};
  const w = colX[R.c2 + 1] - colX[R.c1], hh = rowY[R.r2 + 1] - rowY[R.r1], k = 2;
  if (w < 2 || hh < 2) return;
  if (w * hh * k * k > 64e6) return toast('범위가 너무 커서 그림으로 만들 수 없어요. 조금 줄여서 골라 주세요');
  const off = document.createElement('canvas');
  off.width = Math.ceil((HW + w) * k); off.height = Math.ceil((HH + hh) * k);
  const keep = {ctx, V, zoom: sh.zoom, dark: darkSheet, peek: sh.peek};
  try {
    ctx = off.getContext('2d'); ctx.setTransform(k, 0, 0, k, 0, 0);
    sh.zoom = 1; darkSheet = false;
    V = {X: c => HW + colX[c] - colX[R.c1], Y: r => HH + rowY[r] - rowY[R.r1], W: HW + w, H: HH + hh, z: 1, c0: R.c1, c1: R.c2, r0: R.r1, r1: R.r2};
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, HW + w, HH + hh);
    ctx.save(); ctx.beginPath(); ctx.rect(HW, HH, w, hh); ctx.clip();
    drawCells(); drawImages();
    ctx.restore();
  } finally {
    ctx = keep.ctx; V = keep.V; sh.zoom = keep.zoom; darkSheet = keep.dark; schedule();
  }
  const out = document.createElement('canvas'); out.width = Math.ceil(w * k); out.height = Math.ceil(hh * k);
  out.getContext('2d').drawImage(off, HW * k, HH * k, w * k, hh * k, 0, 0, w * k, hh * k);
  try {
    if (NATIVE && NATIVE.copyImage) await NATIVE.copyImage(out.toDataURL('image/png'));

const SET_KEY = 'monun.settings', MAX_BK = 30;

// 웹 버전은 브라우저 안(IndexedDB)에, 프로그램은 디스크 백업 폴더에 보관
function idbOpen(){
  return new Promise((res, rej) => {
    const q = indexedDB.open('monun', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('backups', {keyPath:'id', autoIncrement:true});
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
async function idbDo(mode, fn){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('backups', mode), req = fn(tx.objectStore('backups'));
    tx.oncomplete = () => res(req ? req.result : undefined); tx.onerror = () => rej(tx.error);
  });
}
const backups = {
  async write(name, data){
    if (NATIVE) return NATIVE.backupWrite(name, data);
    await idbDo('readwrite', s => s.add({name: name.replace(/\.(monun|xlsx|json)$/i, ''), time: Date.now(), size: data.length, data}));
    for (const b of (await backups.list()).slice(MAX_BK)) await idbDo('readwrite', s => s.delete(b.id));
  },
  async list(){
    if (NATIVE) return NATIVE.backupList();
    const all = await idbDo('readonly', s => s.getAll()) || [];
    return all.map(({id, name, time, size}) => ({id, name, time, size})).sort((a, b) => b.time - a.time);
  },
  async read(id){ if (NATIVE) return NATIVE.backupRead(id); const r = await idbDo('readonly', s => s.get(id)); return r && r.data; }
};
