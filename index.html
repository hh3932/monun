// ===== 그림 (붙여넣기, 끌어다 놓기, 옮기기, 크기 조절) =====
// 그림은 칸에 붙어 있다(r, c + 칸 안 위치 dx, dy). 열 너비가 바뀌거나 행이 들어가면 그 칸을 따라 움직인다.
let selImg = null;
const IMG = new Map();
function imgEl(id){
  let el = IMG.get(id);
  if (!el){ el = new Image(); el.onload = () => schedule(); el.src = (wb.media || {})[id] || ''; IMG.set(id, el); }
  return el;
}
const imgAbs = im => ({x: colX[im.c] + im.dx, y: rowY[im.r] + im.dy});
function imgRect(im){
  const z = sh.zoom, a = imgAbs(im);
  const fz = frz();
  return {x: HW + a.x * z - (im.c >= fz.c ? wrap.scrollLeft : 0), y: HH + a.y * z - (im.r >= fz.r ? wrap.scrollTop : 0), w: im.w * z, h: im.h * z};
}
function reanchor(im, x, y){
  x = Math.max(0, x); y = Math.max(0, y);
  im.c = colAt(x); im.r = rowAt(y); im.dx = x - colX[im.c]; im.dy = y - rowY[im.r];
}
const imgHandles = R => [[R.x, R.y], [R.x + R.w, R.y], [R.x, R.y + R.h], [R.x + R.w, R.y + R.h]];
function drawImages(){
  for (const im of (sh.images || [])){
    const R = imgRect(im);
    if (R.x > V.W || R.y > V.H || R.x + R.w < HW || R.y + R.h < HH) continue;
    if (im.kind === 'chart'){ drawChart(ctx, im, R); continue; }
    const el = imgEl(im.id);
    if (el.complete && el.naturalWidth) ctx.drawImage(el, R.x, R.y, R.w, R.h);
    else { ctx.fillStyle = '#EEF0F3'; ctx.fillRect(R.x, R.y, R.w, R.h); }
  }
}
function drawImageSelection(){
  const im = (sh.images || []).find(i => i.id === selImg); if (!im) return;
  const R = imgRect(im);
  ctx.strokeStyle = TH.sel; ctx.lineWidth = 1.5; ctx.setLineDash([]);
  ctx.strokeRect(R.x - 0.5, R.y - 0.5, R.w + 1, R.h + 1);
  for (const [x, y] of imgHandles(R)){ ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
}
// 누른 곳의 그림 (선택한 그림의 손잡이 먼저, 그다음 위에 있는 그림부터)
function imageAt(e){
  const b = cv.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
  if (x < HW || y < HH) return null;
  const tol = e.pointerType === 'touch' ? 16 : 7;
  const cur = (sh.images || []).find(i => i.id === selImg);
  if (cur){ const hs = imgHandles(imgRect(cur)); for (let k = 0; k < 4; k++) if (Math.hypot(x - hs[k][0], y - hs[k][1]) <= tol) return {im: cur, handle: k, x, y}; }
  for (let i = (sh.images || []).length - 1; i >= 0; i--){
    const im = sh.images[i], R = imgRect(im);
    if (x >= R.x && x <= R.x + R.w && y >= R.y && y <= R.y + R.h) return {im, x, y};
  }
  return null;
}
function imagePointerDown(e){
  if (e.button !== 0 && e.button !== 2 && e.pointerType !== 'touch') return false;
  const hit = imageAt(e);
  if (!hit){ if (selImg){ selImg = null; schedule(); } return false; }
  hideMenus(); if (editing) commitEdit();
  touchMode = e.pointerType === 'touch';
  selImg = hit.im.id; schedule();
  if (e.button === 2){ focusGrid(); openImageMenu(e.clientX, e.clientY); return true; }
  snap();
  const a = imgAbs(hit.im);
  drag = {mode: hit.handle != null ? 'imgresize' : 'imgmove', im: hit.im, k: hit.handle, sx: hit.x, sy: hit.y, ox: a.x, oy: a.y, ow: hit.im.w, oh: hit.im.h, moved: false};
  if (e.pointerType === 'touch') touches.set(e.pointerId, {x: e.clientX, y: e.clientY});
  cv.setPointerCapture(e.pointerId);
  focusGrid();
  return true;
}
function imageDragMove(e){
  const b = cv.getBoundingClientRect(), z = sh.zoom;
  const dx = (e.clientX - b.left - drag.sx) / z, dy = (e.clientY - b.top - drag.sy) / z;
  if (!drag.moved && Math.hypot(dx, dy) * z < 3) return;
  drag.moved = true;
  const im = drag.im;
  if (drag.mode === 'imgmove'){ reanchor(im, drag.ox + dx, drag.oy + dy); setStatus('그림 옮기는 중'); }
  else {
    // 모서리를 끌면 가로세로 비율 유지 (Shift를 누르면 자유롭게)
    const k = drag.k, left = k === 0 || k === 2, top = k === 0 || k === 1;
    let w = Math.max(12, drag.ow + (left ? -dx : dx)), hh = Math.max(12, drag.oh + (top ? -dy : dy));
    if (!e.shiftKey && im.kind !== 'chart'){ const s = Math.max(w / drag.ow, hh / drag.oh); w = Math.max(12, drag.ow * s); hh = Math.max(12, drag.oh * s); }
    im.w = Math.round(w); im.h = Math.round(hh);
    reanchor(im, left ? drag.ox + drag.ow - im.w : drag.ox, top ? drag.oy + drag.oh - im.h : drag.oy);
    setStatus(`그림 크기 ${im.w} × ${im.h}px`);
  }
  schedule();
}
function deleteImage(id){
  if (!id) return;
  mutate(() => { sh.images = sh.images.filter(i => i.id !== id); });
  selImg = null; schedule(); toast('지웠습니다 · Ctrl+Z로 되돌릴 수 있어요');
}
function nudgeImage(k, n){
  const im = sh.images.find(i => i.id === selImg); if (!im) return;
  const a = imgAbs(im), d = {ArrowUp:[0,-n], ArrowDown:[0,n], ArrowLeft:[-n,0], ArrowRight:[n,0]}[k];
  mutate(() => reanchor(im, a.x + d[0], a.y + d[1]));
}
function openImageMenu(x, y){
  const im = sh.images.find(i => i.id === selImg); if (!im) return;
  const idx = () => sh.images.findIndex(i => i.id === im.id);
  if (im.kind === 'chart') return showMenu(x, y, [
    {label: '차트 편집…', run: () => editChart(im)},
    {label: '차트 지우기', kbd: 'Delete', run: () => deleteImage(im.id)},
    '-',
    {label: '맨 앞으로 가져오기', run: () => mutate(() => sh.images.push(sh.images.splice(idx(), 1)[0]))},
    {label: '맨 뒤로 보내기', run: () => mutate(() => sh.images.unshift(sh.images.splice(idx(), 1)[0]))},
  ]);
  showMenu(x, y, [
    {label:'그림 지우기', kbd:'Delete', run: () => deleteImage(im.id)},
    {label:'원래 크기로', run: () => { const el = imgEl(im.id); if (el.naturalWidth) mutate(() => { im.w = el.naturalWidth; im.h = el.naturalHeight; }); }},
    '-',
    {label:'맨 앞으로 가져오기', run: () => mutate(() => sh.images.push(sh.images.splice(idx(), 1)[0]))},
    {label:'맨 뒤로 보내기', run: () => mutate(() => sh.images.unshift(sh.images.splice(idx(), 1)[0]))},
  ]);
}
// 그림 파일 → 너무 크면 줄여서(긴 쪽 1600px) 저장. 투명한 그림(png 등)은 png로, 사진은 jpg로
async function fileToImage(blob){
  const url = URL.createObjectURL(blob);
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
    const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
    const keepPng = /png|gif|webp|svg|bmp/.test(blob.type);
    let src = c.toDataURL(keepPng ? 'image/png' : 'image/jpeg', 0.9);
    if (keepPng && src.length > 2.5e6) src = c.toDataURL('image/jpeg', 0.88);
    return {src, w, h};
  } finally { URL.revokeObjectURL(url); }
}
async function insertImage(blob, at){
  if (editing) commitEdit();
  let im;
  try { im = await fileToImage(blob); } catch (e){ toast('그림을 읽을 수 없습니다'); return; }
  const id = 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  wb.media = wb.media || {}; wb.media[id] = im.src;
  const k = Math.min(1, 480 / im.w, 360 / im.h);
  const pic = {id, r: act.r, c: act.c, dx: 0, dy: 0, w: Math.round(im.w * k), h: Math.round(im.h * k)};
  if (at) reanchor(pic, at.x, at.y);
  mutate(() => { sh.images = sh.images || []; sh.images.push(pic); });
  selImg = id; schedule();
  toast('그림을 넣었습니다 · 끌어서 옮기고, 모서리로 크기를 바꾸세요');
}
$('#imgIn').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) insertImage(f, null); });
// 엑셀 파일 속 그림 가져오기
function u8ToB64(u8){
  let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
function importImages(X, ws, s, media){
  const colPx = c => s.colW[c] ?? DEF_W, rowPx = r => s.rowH[r] ?? DEF_H;
  const span = (from, fromOff, to, toOff, size) => { let v = -fromOff; for (let i = from; i < to; i++) v += size(i); return v + toOff; };
  for (const pic of ws.getImages()){
    const m = X.getImage(Number(pic.imageId)); if (!m) continue;
    const ext = m.extension === 'jpg' ? 'jpeg' : (m.extension || 'png');
    let src = m.base64 || '';
    if (!src && m.buffer) src = u8ToB64(m.buffer instanceof Uint8Array ? m.buffer : new Uint8Array(m.buffer));
    if (!src) continue;
    if (!src.startsWith('data:')) src = 'data:image/' + ext + ';base64,' + src;
    const tl = pic.range.tl, c = Math.floor(tl.nativeCol ?? tl.col), r = Math.floor(tl.nativeRow ?? tl.row);
    if (c >= COLS || r >= ROWS) continue;
    const dx = (tl.nativeColOff || 0) / 9525, dy = (tl.nativeRowOff || 0) / 9525;
    let w = 200, hh = 150;
    if (pic.range.ext && pic.range.ext.width){ w = pic.range.ext.width; hh = pic.range.ext.height; }
    else if (pic.range.br){
      const br = pic.range.br;
      w = span(c, dx, Math.floor(br.nativeCol ?? br.col), (br.nativeColOff || 0) / 9525, colPx);
      hh = span(r, dy, Math.floor(br.nativeRow ?? br.row), (br.nativeRowOff || 0) / 9525, rowPx);
    }
    const id = 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    media[id] = src;
    s.images.push({id, r, c, dx, dy, w: Math.max(12, Math.round(w)), h: Math.max(12, Math.round(hh))});
  }
}

// 쓰는 중인지 살펴서 자동 일시정지·다시 시작
const recActivity = () => { REC.last = Date.now(); if (REC.on && REC.paused && REC.auto) recResume(); };
['keydown', 'input', 'pointerdown', 'wheel', 'compositionupdate'].forEach(t => document.addEventListener(t, recActivity, true));
document.addEventListener('pointermove', e => { REC.mx = e.clientX; REC.my = e.clientY; }, true);
setInterval(() => {
  if (REC.on && !REC.paused && recSet.autoPause && Date.now() - REC.last >= recSet.idleSec * 1000) recPause(true);
}, 500);
// 단축키 (편집 중에도). 한글 자판이어도 되게 글쇠 위치(code)로 봄
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.altKey) || (e.target.classList && e.target.classList.contains('rskey'))) return;
  const c = comboOf(e); if (!c) return;
  const act = Object.keys(REC_DEF.keys).find(k => keyLabel(k) === c);
  if (!act) return;
  e.preventDefault(); e.stopPropagation();
  if (act === 'rec') REC.on ? recStop() : recStart();
  else if (act === 'pause') recTogglePause();
  else if (act === 'stop') recStop();
}, true);
if (NATIVE && NATIVE.onRecStopThenClose) NATIVE.onRecStopThenClose(async () => { await recStop(); window.close(); });
window.addEventListener('beforeunload', () => { if (REC.on && REC.rec) try { REC.rec.requestData(); } catch (e) {} });
new MutationObserver(() => { readTheme(); schedule(); }).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
$('#gf').addEventListener('load', () => { fontReq.clear(); SHIFT.clear(); schedule(); });
if (document.fonts) document.fonts.addEventListener('loadingdone', () => { SHIFT.clear(); if (sh){ autoRows(); layout(); schedule(); } });
$('#fcBar').style.background = pens.fc; $('#bgBar').style.background = pens.bg;
$('#tbBorder').innerHTML = borderIcon(lastBorder);

let started = false;
try { started = !!localStorage.getItem('monun.started'); localStorage.setItem('monun.started', '1'); } catch (e) {}
const saved = readSession();
let recovered = false;
if (saved && saved.wb && Array.isArray(saved.wb.sheets)){
  loadWorkbook(saved.wb); fileName = saved.fileName || '제목 없음'; fileDirty = !!saved.fileDirty;
  if (NATIVE) filePath = saved.filePath || null;
  recovered = saved.clean === false && fileDirty;
} else loadWorkbook(started ? {sheets:[newSheet('Sheet1')], active:0} : sample());
updateDoc(); updateBk();
setupWebApp();
// 폰(안드로이드·아이폰)은 .monun 같은 낯선 확장자를 파일 고르기에서 흐리게 막아서 제한을 푼다
if (isIOS || touchDevice()) $('#fileIn').removeAttribute('accept');
takeSharedFile();
if (touchDevice()) touchMode = true;
focusGrid();
if (recovered){ toast('지난번에 저장하지 못하고 꺼진 작업을 복구했습니다'); changedSinceBackup = true; doBackup(false); }
// 저장된 파일이 기준: 저장 안 한 변경이 없는 창은 복구 기록 대신 파일을 새로 읽는다
// (복구 기록이 파일보다 오래돼서, 파일을 눌러도 옛 내용이 보이던 문제)
let reloading = false;
async function reloadFromDisk(reason){
  if (!NATIVE || !filePath || reloading) return;
  reloading = true; setTimeout(() => reloading = false, 1500);
  if (editing) commitEdit();
  let f = null; try { f = await NATIVE.readFile(filePath); } catch (e) {}
  if (!f) return;
  const keepSheet = wb.sheets[wb.active] && wb.sheets[wb.active].name;
  await openData(f.name, f.data, {path: f.path || filePath});
  const i = wb.sheets.findIndex(s => s.name === keepSheet);
  if (i >= 0 && i !== wb.active) switchSheet(i);
  if (reason) toast(reason);
}
if (NATIVE && filePath && !fileDirty) reloadFromDisk();
if (NATIVE && NATIVE.onDiskNewer) NATIVE.onDiskNewer(() => {
  if (!filePath) return;
  if (!fileDirty) return reloadFromDisk('파일이 더 새로 저장돼 있어서 새 내용으로 다시 불러왔어요');
  modal('파일이 더 새로 저장돼 있어요', '<p>이 파일이 다른 창(또는 다른 프로그램)에서 더 나중에 저장됐어요. 그런데 이 창에도 저장하지 않은 변경이 있어요.</p><p><b>다시 불러오기</b>를 누르면 파일의 새 내용이 열리고 이 창의 저장 안 한 변경은 사라집니다. 이 창의 변경을 지키려면 <b>취소</b>를 누르고 [다른 이름으로 저장]으로 따로 저장하세요.</p>', '다시 불러오기', () => { fileDirty = false; reloadFromDisk('파일의 새 내용으로 다시 불러왔어요'); });
});
const flushAutosave = () => { clearTimeout(asT); writeSession(true); };
window.addEventListener('beforeunload', flushAutosave);
document.addEventListener('visibilitychange', () => { if (document.hidden) writeSession(false); });
if (NATIVE){
  NATIVE.onOpenFile(f => openData(f.name, f.data, {path: f.path}));
  NATIVE.onSaveThenClose(async () => { if (await saveFile(false)){ flushAutosave(); NATIVE.closeNow(); } });
  NATIVE.onDiscardThenClose(async () => {
    if (changedSinceBackup) await doBackup(false);   // 저장 안 하고 닫아도 백업에는 남김
    noAutosave = true; clearTimeout(asT); clearSession(); NATIVE.closeNow();
  });
}
})();
</script>
</body>
</html>
