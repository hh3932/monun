<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E5BD0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="모눈">
<title>모눈 시트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&family=Gowun+Dodum&family=Do+Hyeon&family=Black+Han+Sans&family=Nanum+Pen+Script&display=swap">
<style>
:root{
  --bg:#EDF0F4; --bar:#F7F8FA; --panel:#FFFFFF; --line:#D6DCE5; --ink:#1A2130; --muted:#626E82;
  --accent:#2E5BD0; --accent-ink:#FFFFFF; --accent-soft:rgba(46,91,208,.12); --hover:#E6EAF1;
  --head:#F2F4F7; --head-ink:#5B6576; --head-line:#D3D8E0; --head-sel:#DCE5FA; --head-sel-ink:#1E3F99;
  --sel:#2E5BD0; --warn:#B86A00; --shadow:0 10px 30px rgba(20,30,50,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12161D; --bar:#1A1F28; --panel:#222834; --line:#323A49; --ink:#E5E9F0; --muted:#98A2B4;
    --accent:#86A6FF; --accent-ink:#0E1626; --accent-soft:rgba(134,166,255,.16); --hover:#2A3242;
    --head:#1D232D; --head-ink:#9AA4B5; --head-line:#323A49; --head-sel:#2B3B60; --head-sel-ink:#D3DEFF;
    --sel:#3F6FE8; --warn:#F0B35A; --shadow:0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12161D; --bar:#1A1F28; --panel:#222834; --line:#323A49; --ink:#E5E9F0; --muted:#98A2B4;
  --accent:#86A6FF; --accent-ink:#0E1626; --accent-soft:rgba(134,166,255,.16); --hover:#2A3242;
  --head:#1D232D; --head-ink:#9AA4B5; --head-line:#323A49; --head-sel:#2B3B60; --head-sel-ink:#D3DEFF;
  --sel:#3F6FE8; --warn:#F0B35A; --shadow:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.4 "IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
button{font:inherit;color:inherit}

.titlebar{display:flex;align-items:center;gap:14px;padding:0 16px;min-height:46px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand svg{width:22px;height:22px}
.doc{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
#docName{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#saveState{font-size:12px;color:var(--muted);white-space:nowrap}
#saveState.dirty{color:var(--warn)}
#bkState{font-size:12px;color:var(--muted);white-space:nowrap}
#bkState:not(:empty)::before{content:"·";margin-right:10px}
.filebtns{display:flex;gap:2px;flex-wrap:wrap;padding-block:6px}
.fbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:0;border-radius:6px;background:none;cursor:pointer;white-space:nowrap}
.fbtn svg{width:17px;height:17px;flex:none}
.fbtn:hover{background:var(--hover)}
.fbtn.primary{background:var(--accent);color:var(--accent-ink)}
.fbtn.primary:hover{filter:brightness(1.07)}

.ribbon{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px;padding:6px 16px;background:var(--bar);border-bottom:1px solid var(--line)}
.grp{display:flex;align-items:center;gap:2px}
.sep{width:1px;height:22px;background:var(--line);margin:0 6px}
.tb{position:relative;display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 5px;border:0;border-radius:6px;background:none;cursor:pointer}
.tb svg{width:18px;height:18px}
.tb:hover{background:var(--hover)}
.tb.on{background:var(--accent-soft);color:var(--accent)}
.tb.caret{min-width:15px;padding:0;margin-left:-3px}
.tb.caret svg{width:11px;height:11px}
.tb.labeled{display:inline-flex;gap:5px;padding:0 8px 0 6px;font-size:12.5px;white-space:nowrap}
.tb .bar{position:absolute;left:7px;right:7px;bottom:4px;height:3px;border-radius:1px;box-shadow:0 0 0 .5px rgba(0,0,0,.25)}
.glyph{font-size:15px;line-height:1;font-family:Georgia,"Times New Roman",serif}
.ctl{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;padding:0 6px}
#fontSel{width:150px}
#nfSel{width:132px}
#sizeIn{width:60px;font-variant-numeric:tabular-nums}
.tb:focus-visible,.fbtn:focus-visible,.ctl:focus-visible,.tab:focus-visible,.mi:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.fxbar{display:flex;align-items:center;gap:8px;padding:5px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#nameBox{width:100px;font-family:"IBM Plex Mono",Consolas,monospace;text-align:center}
.fxlabel{font-size:11px;letter-spacing:.08em;color:var(--muted)}
#fx{flex:1;min-width:0;resize:none;overflow:hidden;white-space:pre;line-height:28px;padding-block:0;height:30px}

.wrap{position:relative;flex:1;overflow:auto;background:#fff;outline:none;min-height:0}
.wrap.painting{cursor:copy}
#cv{position:sticky;left:0;top:0;display:block}
#spacer{position:absolute;left:0;top:0;pointer-events:none}
#ed{position:absolute;z-index:3;margin:0;border:0;outline:2px solid var(--sel);outline-offset:0;resize:none;overflow:hidden;padding:2px 4px;opacity:0;pointer-events:none;line-height:1.28;background:#fff;color:#111}
#ed.on{opacity:1;pointer-events:auto;box-shadow:0 3px 12px rgba(0,0,0,.18)}

.bottombar{display:flex;align-items:stretch;gap:6px;min-height:36px;padding:0 16px;background:var(--bar);border-top:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;max-width:55%}
.tab{display:flex;align-items:center;padding:0 14px;border:0;background:none;color:var(--muted);cursor:pointer;white-space:nowrap;border-top:2px solid transparent}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--panel);color:var(--ink);font-weight:500;border-top-color:var(--accent)}
.tab input{font:inherit;width:100px;border:1px solid var(--accent);border-radius:4px;padding:1px 4px;background:var(--panel);color:var(--ink)}
#addSheet{align-self:center}
.status{flex:1;align-self:center;color:var(--muted);font-size:12px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zoom{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.zoom .tb{min-width:24px;height:24px}
#zoomR{width:96px;accent-color:var(--accent)}
#zoomV{width:40px;text-align:right;font-variant-numeric:tabular-nums}

.pop,.menu{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);color:var(--ink)}
.pop{padding:10px}
.menu{padding:5px;min-width:210px}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;border:0;border-radius:6px;background:none;text-align:left;cursor:pointer;white-space:nowrap}
.mi:hover{background:var(--hover)}
.mi svg{width:18px;height:18px;flex:none}
.mi .sp{width:18px;flex:none}
.mi kbd{margin-left:auto;padding-left:18px;font:11px "IBM Plex Mono",Consolas,monospace;color:var(--muted)}
.msep{height:1px;background:var(--line);margin:4px 2px}
.plabel{font-size:11px;color:var(--muted);letter-spacing:.04em;margin:8px 2px 5px}
.plabel:first-child{margin-top:0}
.swgrid{display:grid;grid-template-columns:repeat(10,18px);gap:3px}
.swgrid.tints{gap:0 3px}
.sw{width:18px;height:18px;border:1px solid rgba(0,0,0,.14);border-radius:3px;cursor:pointer;padding:0}
.swgrid.tints .sw{border-radius:0}
.sw:hover{outline:2px solid var(--accent);outline-offset:1px;position:relative;z-index:1}
.prow{display:flex;gap:6px;align-items:center;margin-top:8px}
.pbtn{flex:1;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.pbtn:hover{background:var(--hover)}
.pbtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pbtn input[type=color]{width:20px;height:20px;border:0;padding:0;background:none;cursor:pointer}
.bmenu{display:flex;gap:10px}
.bmenu .presets{min-width:200px}
.bmenu .pen{width:200px;border-left:1px solid var(--line);padding-left:10px}
.lineopt{display:grid;grid-template-columns:1fr;gap:4px}
.lineopt .pbtn{justify-content:flex-start;padding:0 10px}
.lineopt svg{width:120px;height:10px}

.modal-back{position:fixed;inset:0;background:rgba(10,15,25,.38);display:grid;place-items:center;z-index:30;padding:16px}
.modal{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:20px;width:min(380px,100%)}
.modal h3{margin:0 0 10px;font-size:15px}
.modal p{margin:0 0 14px;color:var(--muted)}
.modal input{width:100%;margin-bottom:14px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.modal .acts button{height:32px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.modal .acts button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.modal.wide{width:min(540px,100%)}
.bkset{display:grid;gap:10px;margin-bottom:6px}
.bkset label{display:flex;align-items:center;gap:10px}
.bkset select{width:auto}
.modal .chk{align-items:flex-start;color:var(--muted);line-height:1.45}
.modal .chk input{width:auto;margin:3px 0 0;accent-color:var(--accent)}
.bklist{max-height:300px;overflow:auto;border-top:1px solid var(--line);margin-bottom:12px}
.bkrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line)}
.bkrow b{font-weight:500;word-break:break-all}
.bkrow span{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.bkrow .pbtn{flex:none;width:64px}
.bkempty{padding:14px 2px}
#toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;white-space:nowrap}
#toast.show{opacity:1}
#cv{touch-action:none}
.bottombar{padding-bottom:env(safe-area-inset-bottom,0px)}
/* 화면 틀(버튼, 메뉴, 탭)은 길게 눌러도 글자가 선택되지 않게. 입력칸은 그대로 */
.titlebar,.ribbon,.fxbar .fxlabel,.bottombar,.menu,.pop,.modal h3{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.doc{overflow:hidden}
.doc.dirty #docName::after{content:" •";color:var(--warn)}
@media (max-width:760px){
  .fbtn span{display:none}.status{display:none}.tabs{max-width:70%}
  .titlebar{gap:8px}
  #saveState,#bkState{display:none}
  .ribbon{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-block:5px}
  .ribbon::-webkit-scrollbar{display:none}
  .grp,.sep{flex:none}
  #fontSel{width:116px}
  #nameBox{width:70px}
  #zoomR{display:none}
}
/* 손가락으로 누르기 쉽게, 그리고 iOS에서 입력칸을 누를 때 화면이 확대되지 않게 16px */
@media (pointer:coarse){
  .ctl{font-size:16px}
  .tb{min-width:38px;height:38px}
  .tb.caret{min-width:22px}
  .fbtn{height:36px}
  .mi{padding:10px 12px}
}
#installBtn[hidden]{display:none}
.cc{align-self:center;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;padding:3px 8px;border-radius:5px;cursor:pointer;user-select:none}
.cc:hover{background:var(--hover);color:var(--ink)}
@media (max-width:760px){.cc{font-size:11px;padding:3px 4px}}
#pageView{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;background:var(--bg)}
#pageView[hidden]{display:none}
#pvStart[hidden],#pvOrder[hidden],#pvScope[hidden],#pvNewPageL[hidden],#pvSegs[hidden]{display:none}
.pv-segs{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:6px 16px;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:thin}
.pv-segs-t{font-size:12px;color:var(--muted);white-space:nowrap;margin-right:2px}
.pv-seg{flex:none;border:1px solid var(--line);background:var(--bar);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.pv-seg:hover{border-color:var(--accent);color:var(--accent)}
.pv-seg b{font-family:"IBM Plex Mono",Consolas,monospace;font-weight:500}
.pv-seg span{color:var(--muted)}
.pv-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--bar);border-bottom:1px solid var(--line)}
.pv-bar label{display:flex;gap:6px;align-items:center;white-space:nowrap}
.pv-bar select.ctl{height:30px}
.pv-chk input{accent-color:var(--accent)}
.pv-info{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.pv-zoom{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pv-zoom .tb{min-width:26px;height:26px}
.pv-scroll{flex:1;overflow:auto;background:#5E6572}
.pv-pages{display:flex;flex-direction:column;align-items:center;gap:28px;padding:28px 16px 64px;width:max-content;min-width:100%;box-sizing:border-box}
.pv-one,.pv-pair{display:flex;flex-direction:column;align-items:center}
.pv-pair{flex-direction:row;gap:2px}
.pv-pages .pg{box-shadow:0 3px 14px rgba(0,0,0,.35)}
.pv-pages .ln,.pv-pages .tc{cursor:text}
.pv-blank{visibility:hidden}
.pv-label{color:#E7EAEF;font-size:12px;margin-top:6px}
@media (max-width:760px){.pv-bar .fbtn span{display:none}.pv-info{margin-left:0;width:100%}}
.cf-sw{flex:none;width:30px;height:24px;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;font-size:12px}
.modal code{font-family:"IBM Plex Mono",Consolas,monospace;background:var(--hover);padding:1px 4px;border-radius:3px}
#fnHint{position:fixed;z-index:25;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;max-width:360px;font-size:12.5px;color:var(--ink)}
#fnHint[hidden]{display:none}
.fh-item{display:flex;gap:10px;align-items:baseline;padding:4px 8px;border-radius:5px;cursor:pointer}
.fh-item b{font-family:"IBM Plex Mono",Consolas,monospace;font-weight:500;min-width:84px}
.fh-item span{color:var(--muted)}
.fh-item.on,.fh-item:hover{background:var(--accent-soft)}
.fh-tip{font-size:11px;color:var(--muted);padding:2px 8px}
.fh-sig{font-family:"IBM Plex Mono",Consolas,monospace;padding:4px 8px}
.fh-sig b{color:var(--accent)}
.fh-desc{color:var(--muted);padding:0 8px 4px}
.fc-list{max-height:52vh;overflow:auto;border-top:1px solid var(--line);margin:8px 0 12px}
.fc-row{display:grid;gap:2px;padding:7px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.fc-row:hover{background:var(--hover)}
.fc-row b{font-family:"IBM Plex Mono",Consolas,monospace;font-weight:500;font-size:12.5px}
.fc-row span{color:var(--muted);font-size:12px}
.findbar{position:fixed;z-index:15;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px;display:grid;gap:6px;width:min(400px,calc(100vw - 32px))}
.findbar[hidden]{display:none}
.frow{display:flex;gap:4px;align-items:center}
.frow[hidden]{display:none}
.frow .ctl{flex:1;min-width:0}
.frow .pbtn{flex:none;padding:0 12px;height:30px}
#findCount{font-size:12px;color:var(--muted);min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.fpop{width:270px}
.fpop .flist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px;margin:6px 0}
.fpop label{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:4px;cursor:pointer}
.fpop label:hover{background:var(--hover)}
.fpop label input{accent-color:var(--accent)}
.fpop label .n{margin-left:auto;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.fpop .ctl{width:100%}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="titlebar">
    <div class="brand">
      <svg viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="4" fill="var(--accent)"/><path d="M1 7.7h20M1 14.3h20M7.7 1v20M14.3 1v20" stroke="var(--accent-ink)" stroke-opacity=".55" stroke-width="1"/><rect x="7.7" y="7.7" width="6.6" height="6.6" fill="var(--accent-ink)"/></svg>
      모눈
    </div>
    <div class="doc"><span id="docName">제목 없음</span><span id="saveState"></span><span id="bkState"></span></div>
    <div class="filebtns">
      <button class="fbtn" data-cmd="install" id="installBtn" title="이 기기에 앱으로 설치" hidden><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="2.5" width="9" height="15" rx="2"/><path d="M10 6v6M7.5 9.5 10 12l2.5-2.5M8.5 15h3"/></svg><span>앱으로 설치</span></button>
      <button class="fbtn" data-cmd="pageView" title="쪽 미리보기: A4·A5·B5 같은 종이에 글이 몇 쪽으로 들어가는지 보기"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10 5.5C8.5 4.3 6 3.8 3 4v11.5c3-.2 5.5.3 7 1.5 1.5-1.2 4-1.7 7-1.5V4c-3-.2-5.5.3-7 1.5z"/><path d="M10 5.5V17"/></svg><span>쪽 미리보기</span></button>
      <button class="fbtn" data-cmd="print" title="인쇄 / PDF로 저장 (Ctrl+P)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M6 7V3h8v4"/><rect x="3" y="7" width="14" height="7" rx="1.5"/><path d="M6 12h8v5H6z"/></svg><span>인쇄</span></button>
      <button class="fbtn" data-cmd="backups" title="자동 백업 설정과 복원"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10a6.5 6.5 0 1 0 1.9-4.6"/><path d="M3 3.5v3.2h3.2"/><path d="M10 6.5V10l2.5 1.6"/></svg><span>백업·복원</span></button>
      <button class="fbtn" data-cmd="new" title="새로 만들기"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M5 2.5h6.5L15 6v11.5H5z"/><path d="M11.5 2.5V6H15"/></svg><span>새로 만들기</span></button>
      <button class="fbtn" data-cmd="open" title="열기 (Ctrl+O)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2.5 5h5l1.5 2h8.5v9h-15z"/></svg><span>열기</span></button>
      <button class="fbtn" data-cmd="saveAs" title="다른 이름으로 저장 (Ctrl+Shift+S)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 3h9l3 3v4M4 3v14h6"/><path d="M7 3v3.5h5V3M12.5 17l1-3 4-4 2 2-4 4z"/></svg><span>다른 이름으로</span></button>

<script>
(() => {
'use strict';
// ===== 기본 값 =====
const ROWS = 1000, COLS = 52, DEF_W = 90, DEF_H = 24, HW = 46, HH = 24;
const DEF_FONT = 'Malgun Gothic', DEF_FS = 11, GRIDC = '#E1E5EB', LS = 'monun.autosave.v1';
const FONTS = [['Malgun Gothic','맑은 고딕'],['Nanum Gothic','나눔고딕'],['Nanum Myeongjo','나눔명조'],['Noto Sans KR','본고딕'],['Noto Serif KR','본명조'],['Gowun Dodum','고운돋움'],['Do Hyeon','도현'],['Black Han Sans','검은고딕'],['Nanum Pen Script','나눔손글씨 펜'],['Gulim','굴림'],['Dotum','돋움'],['Batang','바탕'],['Gungsuh','궁서'],['Arial','Arial'],['Times New Roman','Times New Roman'],['Georgia','Georgia'],['Consolas','Consolas']];
const XL_NAME = {'Malgun Gothic':'맑은 고딕','Gulim':'굴림','Dotum':'돋움','Batang':'바탕','Gungsuh':'궁서','Nanum Gothic':'나눔고딕','Nanum Myeongjo':'나눔명조'};
const XL_BACK = Object.fromEntries(Object.entries(XL_NAME).map(([a,b]) => [b,a]));
const SIZES = [8,9,10,11,12,14,16,18,20,22,24,26,28,36,48,72];

const $ = s => document.querySelector(s);
const wrap = $('#wrap'), cv = $('#cv'), ctx = cv.getContext('2d'), spacer = $('#spacer'), ed = $('#ed');
const fx = $('#fx'), nameBox = $('#nameBox'), pop = $('#pop'), menuEl = $('#ctx');
const mctx = document.createElement('canvas').getContext('2d');

let wb, sh, colX, rowY, mergeIdx = new Map(), V = null;
let sel = {r1:0,c1:0,r2:0,c2:0}, act = {r:0,c:0}, foc = {r:0,c:0};
let editing = false, editMode = 'enter', edMinW = 0, edMinH = 0;
let undoStack = [], redoStack = [], changedSinceBackup = false;
let clip = null, clipHTML = '', painter = null, drag = null, lastEv = null, asId = 0;
let fileHandle = null, fileName = '제목 없음', fileDirty = false;
const pens = {fc:'#C00000', bg:'#FFF2CC'};
let borderPen = {w:1, s:'solid', c:'#000000'}, lastBorder = 'all';
let recent = [];
const TH = {};

// ===== 모델 =====
function newSheet(name){ return {name, cells:{}, colW:{}, rowH:{}, rowManual:{}, colStyle:{}, rowStyle:{}, merges:[], images:[], grid:true, zoom:1}; }
function normSheet(s){
  const o = Object.assign(newSheet(s.name || 'Sheet'), s);
  // rowManual에는 직접 정한 높이(최소 높이)를 담는다. 예전 파일은 1로 표시돼 있어 그때 높이로 바꿔 줌
  for (const r in o.rowManual) if (o.rowManual[r] === 1 || o.rowManual[r] === true) o.rowManual[r] = o.rowH[r] ?? DEF_H;
  return o;
}
const cw = c => sh.colW[c] ?? DEF_W;
let hiddenRows = new Set();   // 필터로 숨긴 행 (높이 0으로 그림)
const rh = r => hiddenRows.has(r) ? 0 : (sh.rowH[r] ?? DEF_H);
const getV = (r,c) => { const x = sh.cells[r+':'+c]; return x && x.v != null ? x.v : ''; };
function setV(r,c,v){
  const k = r+':'+c; let cell = sh.cells[k];
  if (v === '' || v == null){ if (cell){ delete cell.v; clean(r,c); } return; }
  if (!cell) cell = sh.cells[k] = {};
  cell.v = String(v);
}
function ensureCell(r,c){ const k = r+':'+c; return sh.cells[k] || (sh.cells[k] = {}); }
function clean(r,c){
  const k = r+':'+c, cell = sh.cells[k]; if (!cell) return;
  if (cell.s && !Object.keys(cell.s).length) delete cell.s;
  if (cell.v == null && !cell.s) delete sh.cells[k];
}
const EMPTY = {};
// 기본: 줄 바꿈 켜짐(숫자는 쪼개지지 않게 한 줄), 세로 위치는 위쪽.
// 칸에 wrap:false 나 va:'middle'/'bottom'을 따로 정하면 그것을 따른다.
const wrapOn = (s, v) => s.wrap !== false && !(v != null && v !== '' && isNum(v));
const vaOf = s => s.va || 'top';
function st(r,c){
  const cell = sh.cells[r+':'+c], cs = sh.colStyle[c], rs = sh.rowStyle[r];
  if (!cs && !rs) return (cell && cell.s) || EMPTY;
  return Object.assign({}, cs, rs, cell && cell.s);
}
function buildMerges(){
  sheetChars = null;
  computeHidden();
  mergeIdx = new Map();

  if (editing) commitEdit();
  const s = sel;
  const put = o => { for (const k in patch){ if (patch[k] == null) delete o[k]; else o[k] = patch[k]; } };
  const each = (test, fn) => { for (const k in sh.cells){ const i = k.indexOf(':'), r = +k.slice(0,i), c = +k.slice(i+1); if (test(r,c)) fn(sh.cells[k], r, c); } };

    if (fullCols(s)){
      for (let c = s.c1; c <= s.c2; c++){ const o = sh.colStyle[c] || {}; put(o); if (Object.keys(o).length) sh.colStyle[c] = o; else delete sh.colStyle[c]; }
      for (const r in sh.rowStyle) for (let c = s.c1; c <= s.c2; c++) ensureCell(+r, c);
      each((r,c) => c >= s.c1 && c <= s.c2, (cell, r, c) => { cell.s = cell.s || {}; put(cell.s); clean(r,c); });

      for (let r = s.r1; r <= s.r2; r++){ const o = sh.rowStyle[r] || {}; put(o); if (Object.keys(o).length) sh.rowStyle[r] = o; else delete sh.rowStyle[r]; }

    } else {
      for (let r = s.r1; r <= s.r2; r++) for (let c = s.c1; c <= s.c2; c++){ const cell = ensureCell(r,c); cell.s = cell.s || {}; put(cell.s); clean(r,c); }

function doMerge(kind){
  if (editing) commitEdit();
  const s = {...sel};
  if (kind === 'unmerge'){
    if (!sh.merges.some(m => inter(m, s))) return toast('병합된 칸이 없습니다');
    return mutate(() => { sh.merges = sh.merges.filter(m => !inter(m, s)); });
  }
  if ((s.r2-s.r1+1)*(s.c2-s.c1+1) > 20000) return toast('병합하기에는 범위가 너무 큽니다');

  let lost = false;
  mutate(() => {

let findHits = [];
const findBar = $('#findBar'), findQ = $('#findQ'), replQ = $('#replQ');
function placeFind(){ const b = wrap.getBoundingClientRect(); findBar.style.top = (b.top + 8) + 'px'; findBar.style.right = Math.max(8, innerWidth - b.right + 18) + 'px'; }
function openFind(withReplace){
  if (editing) commitEdit();

  const cur = getV(act.r, act.c);

}

    const [r, c] = k.split(':').map(Number), v = getV(r, c);

}
function updFindCount(){
  const el = $('#findCount');
  if (!findQ.value){ el.textContent = ''; return; }
  if (!findHits.length){ el.textContent = '없음'; return; }
  const i = findHits.findIndex(([r, c]) => r === act.r && c === act.c);

}
function findGo(d){

  let i = d > 0 ? findHits.findIndex(([r, c]) => r > act.r || (r === act.r && c > act.c))
                : findHits.map(([r, c]) => r < act.r || (r === act.r && c < act.c)).lastIndexOf(true);
  if (i < 0) i = d > 0 ? 0 : findHits.length - 1;

}
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function replaceIn(v){ return String(v).replace(new RegExp(reEsc(findQ.value), 'gi'), () => replQ.value); }

  if (!findQ.value) return;

  if (!onHit) return findGo(1);
  mutate(() => setV(act.r, act.c, replaceIn(getV(act.r, act.c))));
  findGo(1);
}
function replaceAll(){
  if (!findQ.value) return;

  if (!targets.length) return toast('바꿀 내용이 없습니다');
  mutate(() => { for (const [r, c] of targets) setV(r, c, replaceIn(getV(r, c))); });
  runFind();

findQ.addEventListener('input', runFind);
findQ.addEventListener('keydown', e => {

// ===== 수식 (엑셀 호환) =====
// 칸 값이 '='로 시작하면 수식. 값은 그릴 때 계산하고(바뀔 때마다 기억 지움), 같은 칸은 한 번만 계산한다.
const isFormula = v => typeof v === 'string' && v.length > 1 && v[0] === '=';
class FErr { constructor(code){ this.code = code; } toString(){ return this.code; } }
const FE = {div0: new FErr('#DIV/0!'), value: new FErr('#VALUE!'), ref: new FErr('#REF!'), name: new FErr('#NAME?'), na: new FErr('#N/A'), num: new FErr('#NUM!'), circ: new FErr('#순환참조!'), err: new FErr('#ERROR!')};
const isErr = x => x instanceof FErr;
let calcCache = new Map(), calcStack = new Set();
const parseCache = new Map();
function clearCalc(){ calcCache = new Map(); cfStats = new Map(); }

// --- 날짜: 엑셀처럼 1899-12-30부터 센 날 수로 계산 ---
const DAY0 = Date.UTC(1899, 11, 30);
const dateSerial = (y, m, d) => (Date.UTC(y, m - 1, d) - DAY0) / 864e5;
function serialToDate(n){ const d = new Date(DAY0 + Math.round(n) * 864e5); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`; }
const isDateStr = v => typeof v === 'string' && DATE.test(v.trim());
function toSerial(v){
  if (typeof v === 'number') return v;
  const m = DATE.exec(String(v).trim()); return m ? dateSerial(+m[1], +m[3], +m[4]) : null;
}

// 칸에 적힌 글자 → 값 (숫자 글자는 숫자로, '로 시작하면 글자 그대로)
function literal(v){
  if (typeof v !== 'string') return v;
  if (v[0] === "'") return v.slice(1);
  const t = v.trim(), pct = t.endsWith('%'), core = pct ? t.slice(0, -1) : t;
  if (core !== '' && PLAIN.test(core)){ const n = parseFloat(core.replace(/,/g, '')); return pct ? n / 100 : n; }
  const u = t.toUpperCase(); if (u === 'TRUE' || u === 'FALSE') return u === 'TRUE';
  return v;
}
const numText = x => Number.isInteger(x) ? String(x) : String(Number(x.toPrecision(15)));
function toStr(v){ if (v == null) return ''; if (typeof v === 'number') return numText(v); if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE'; return String(v); }
function toNum(v){
  if (isErr(v)) return v;
  if (v == null || v === '') return v === '' ? FE.value : 0;
  if (typeof v === 'number') return v;
  if (typeof v === 'boolean') return v ? 1 : 0;
  const t = String(v).trim(), pct = t.endsWith('%'), core = pct ? t.slice(0, -1) : t;
  if (PLAIN.test(core)){ const n = parseFloat(core.replace(/,/g, '')); return pct ? n / 100 : n; }
  const s = toSerial(t); return s != null ? s : FE.value;
}
const truthy = v => typeof v === 'string' ? (v.toUpperCase() === 'TRUE' ? true : v.toUpperCase() === 'FALSE' ? false : FE.value) : isErr(v) ? v : !!toNum(v);

// --- 범위 값 ---
class RangeV {
  constructor(s, r1, c1, r2, c2){ Object.assign(this, {s, r1, c1, r2, c2}); }
  get rows(){ return this.r2 - this.r1 + 1; } get cols(){ return this.c2 - this.c1 + 1; }
  lastRow(){ let m = this.r1 - 1; for (const k in this.s.cells){ const i = k.indexOf(':'), r = +k.slice(0, i), c = +k.slice(i + 1); if (r >= this.r1 && r <= this.r2 && c >= this.c1 && c <= this.c2 && r > m) m = r; } return m; }
  *values(){ const r2 = Math.min(this.r2, this.lastRow()); for (let r = this.r1; r <= r2; r++) for (let c = this.c1; c <= this.c2; c++) yield cellValue(this.s, r, c); }
  at(i, j){ return cellValue(this.s, this.r1 + i, this.c1 + j); }   // i행 j열 (0부터)
  list(){ return [...this.values()]; }
}
function scalar(v){ if (v instanceof RangeV) return v.rows === 1 && v.cols === 1 ? v.at(0, 0) : FE.value; return v; }

// --- 낱말 나누기 ---
const NAMECH = '[A-Za-z_\\u3131-\\uD79D][\\w.\\u3131-\\uD79D]*';
const RE_SHEET = new RegExp(`^(?:'((?:[^']|'')+)'|(${NAMECH}))!`);
const RE_CELLRANGE = /^(\$?)([A-Za-z]{1,3})(\$?)(\d+)(?::(\$?)([A-Za-z]{1,3})(\$?)(\d+))?(?![\w(])/;
const RE_COLRANGE = /^(\$?)([A-Za-z]{1,3}):(\$?)([A-Za-z]{1,3})(?![\w(])/;
const colNum = s => { let c = 0; for (const ch of s.toUpperCase()) c = c * 26 + ch.charCodeAt(0) - 64; return c - 1; };
function tokenize(src){
  const out = []; let i = 0;
  while (i < src.length){
    const ch = src[i], rest = src.slice(i);
    if (/\s/.test(ch)){ i++; continue; }
    if (ch === '"'){
      let j = i + 1, s = '';
      for (;; j++){ if (j >= src.length) throw FE.err; if (src[j] === '"'){ if (src[j + 1] === '"'){ s += '"'; j++; continue; } break; } s += src[j]; }
      out.push({k: 'str', v: s}); i = j + 1; continue;
    }
    let m = /^(\d+(\.\d*)?|\.\d+)([eE][+-]?\d+)?/.exec(rest);
    if (m && !/^[A-Za-z:]/.test(rest.slice(m[0].length))){ out.push({k: 'num', v: parseFloat(m[0])}); i += m[0].length; continue; }
    let sheet = null, j = 0;
    const sm = RE_SHEET.exec(rest);
    if (sm){ sheet = sm[1] != null ? sm[1].replace(/''/g, "'") : sm[2]; j = sm[0].length; }
    const after = rest.slice(j);
    m = RE_CELLRANGE.exec(after);
    if (m){
      const a = {c: colNum(m[2]), r: +m[4] - 1, ca: !!m[1], ra: !!m[3]};
      const b = m[6] ? {c: colNum(m[6]), r: +m[8] - 1, ca: !!m[5], ra: !!m[7]} : null;
      out.push({k: b ? 'range' : 'ref', sheet, a, b}); i += j + m[0].length; continue;
    }
    m = RE_COLRANGE.exec(after);
    if (m){ out.push({k: 'range', sheet, a: {c: colNum(m[2]), r: 0, ca: !!m[1], ra: true}, b: {c: colNum(m[4]), r: ROWS - 1, ca: !!m[3], ra: true}}); i += j + m[0].length; continue; }
    if (sheet) throw FE.ref;
    m = new RegExp('^' + NAMECH).exec(rest);
    if (m){
      const name = m[0], up = name.toUpperCase(); i += name.length;
      if (src[i] === '(') out.push({k: 'fn', v: up});
      else if (up === 'TRUE' || up === 'FALSE') out.push({k: 'bool', v: up === 'TRUE'});
      else out.push({k: 'name', v: name});
      continue;
    }
    const two = src.substr(i, 2);
    if (two === '<=' || two === '>=' || two === '<>'){ out.push({k: 'op', v: two}); i += 2; continue; }
    if ('+-*/^&=<>%'.includes(ch)){ out.push({k: 'op', v: ch}); i++; continue; }
    if (ch === '('){ out.push({k: '('}); i++; continue; }
    if (ch === ')'){ out.push({k: ')'}); i++; continue; }
    if (ch === ',' || ch === ';'){ out.push({k: ','}); i++; continue; }
    throw FE.err;
  }
  return out;
}
// --- 문장 구조 만들기 (연산 우선순위는 엑셀과 같음) ---
const PREC = {'=': 1, '<>': 1, '<': 1, '>': 1, '<=': 1, '>=': 1, '&': 2, '+': 3, '-': 3, '*': 4, '/': 4, '^': 5};
function parseFormula(src){
  if (parseCache.has(src)) return parseCache.get(src);
  const t = tokenize(src); let p = 0;
  const peek = () => t[p], next = () => t[p++];
  const postfix = e => { while (peek() && peek().k === 'op' && peek().v === '%'){ next(); e = {k: 'pct', e}; } return e; };
  function primary(){
    const k = next(); if (!k) throw FE.err;
    switch (k.k){
      case 'num': case 'str': case 'bool': return {k: k.k, v: k.v};
      case 'ref': case 'range': return {k: k.k, t: k};
      case 'name': return {k: 'name', v: k.v};
      case '(': { const e = expr(0); if (!peek() || peek().k !== ')') throw FE.err; next(); return e; }
      case 'fn': {
        next(); const args = [];
        if (peek() && peek().k === ')'){ next(); return {k: 'fn', name: k.v, args}; }
        for (;;){
          if (peek() && (peek().k === ',' || peek().k === ')')) args.push({k: 'empty'}); else args.push(expr(0));
          const n = next(); if (!n) throw FE.err;
          if (n.k === ')') break; if (n.k !== ',') throw FE.err;
        }
        return {k: 'fn', name: k.v, args};
      }
      case 'op': if (k.v === '-' || k.v === '+'){ const e = postfix(primary()); return k.v === '-' ? {k: 'neg', e} : e; }
    }
    throw FE.err;
  }
  function expr(minP){
    let left = postfix(primary());
    for (;;){
      const o = peek(); if (!o || o.k !== 'op' || !(o.v in PREC)) break;
      const pr = PREC[o.v]; if (pr < minP) break;
      next(); left = {k: 'bin', op: o.v, a: left, b: expr(o.v === '^' ? pr : pr + 1)};
    }
    return left;
  }
  const ast = expr(0); if (p < t.length) throw FE.err;
  parseCache.set(src, ast); return ast;
}

// --- 계산 ---
function refSheet(name, ctx){ if (name == null) return ctx.s; return wb.sheets.find(s => s.name.toLowerCase() === name.toLowerCase()) || null; }
function cellValue(s, r, c){
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return FE.ref;
  const cell = s.cells[r + ':' + c]; if (!cell || cell.v == null || cell.v === '') return null;
  if (!isFormula(cell.v)) return literal(cell.v);
  let m = calcCache.get(s); if (!m){ m = new Map(); calcCache.set(s, m); }
  const k = r * COLS + c; if (m.has(k)) return m.get(k);
  const id = wb.sheets.indexOf(s) + ':' + k;
  if (calcStack.has(id)) return FE.circ;
  calcStack.add(id);
  let res;
  try {

// --- 참조 고치기: 복사(상대 참조 이동), 행/열 넣기·지우기 ---

// 수식 글자 속 참조마다 fn(tok)을 불러 새 글자로 바꾼다 (따옴표 속 글자는 건드리지 않음)

        const b = m[6] ? {c: colNum(m[6]), r: +m[8] - 1, ca: !!m[5], ra: !!m[7]} : null;

  const max = axis === 'r' ? ROWS : COLS, key = axis === 'r' ? 'r' : 'c', e = at + n - 1;
  for (const s of wb.sheets) for (const k in s.cells){
    const cell = s.cells[k]; if (!isFormula(cell.v)) continue;
    const nv = mapRefs(cell.v, ({sheet, a, b}) => {
      const ts = sheet == null ? s : wb.sheets.find(x => x.name.toLowerCase() === sheet.toLowerCase());
      if (ts !== target) return null;
      const one = (p, end) => {
        let i = p[key];
        if (!del){ if (i >= at) i += n; if (i >= max) return null; }
        else if (i >= at && i <= e){ if (!b) return null; i = end ? at - 1 : at; }
        else if (i > e) i -= n;

function autoSum(fn){

  if (multi){
    if (sel.r2 > sel.r1 && sel.r2 + 1 < ROWS){
      const r = sel.r2 + 1;
      mutate(() => { for (let c = sel.c1; c <= sel.c2; c++) setV(r, c, `=${fn}(${refText({r: sel.r1, c})}:${refText({r: sel.r2, c})})`); });

    }

}

// ===== 조건부 서식 =====
// sh.cf = [{range, type, ...}] · 그릴 때만 겹쳐 보여 준다(칸 서식 자체는 그대로)
const CF_PRESETS = [
  {label: '연한 빨강 + 진한 빨강 글자', bg: '#FFC7CE', fc: '#9C0006'},
  {label: '노랑 + 진한 노랑 글자', bg: '#FFEB9C', fc: '#9C5700'},
  {label: '초록 + 진한 초록 글자', bg: '#C6EFCE', fc: '#006100'},
  {label: '연한 빨강 채우기', bg: '#FFC7CE'},
  {label: '빨강 글자', fc: '#C00000'},
  {label: '굵은 파랑 글자', fc: '#1F4E9C', b: true},
];
let cfStats = new Map();
const inRect = (R, r, c) => r >= R.r1 && r <= R.r2 && c >= R.c1 && c <= R.c2;
function cfNums(rule){
  let st = cfStats.get(rule); if (st) return st;
  const vals = [], texts = new Map();
  for (let r = rule.range.r1; r <= rule.range.r2; r++) for (let c = rule.range.c1; c <= rule.range.c2; c++){
    const x = cellValue(sh, r, c);
    if (typeof x === 'number') vals.push(x);
    if (x !== null && x !== '') { const k = toStr(x).toLowerCase(); texts.set(k, (texts.get(k) || 0) + 1); }
  }
  const sorted = [...vals].sort((a, b) => a - b);
  st = {min: sorted[0] ?? 0, max: sorted[sorted.length - 1] ?? 0, avg: vals.length ? vals.reduce((s, x) => s + x, 0) / vals.length : 0, sorted, texts};
  cfStats.set(rule, st); return st;
}
function lerpColor(a, b, t){
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');

// 이 칸에 맞는 규칙들의 모양 (채우기·글자색·굵게, 데이터 막대)
function cfLook(r, c){
  const rules = sh.cf; if (!rules || !rules.length) return null;
  let look = null;
  for (const rule of rules){
    if (!inRect(rule.range, r, c)) continue;
    const x = cellValue(sh, r, c);
    let hitR = false, extra = null;
    switch (rule.type){
      case 'gt': hitR = typeof x === 'number' && x > rule.a; break;
      case 'lt': hitR = typeof x === 'number' && x < rule.a; break;
      case 'between': hitR = typeof x === 'number' && x >= Math.min(rule.a, rule.b) && x <= Math.max(rule.a, rule.b); break;
      case 'eq': hitR = x !== null && (typeof rule.a === 'number' ? x === rule.a : toStr(x).toLowerCase() === String(rule.a).toLowerCase()); break;
      case 'text': hitR = x !== null && toStr(x).toLowerCase().includes(String(rule.a).toLowerCase()); break;
      case 'dup': hitR = x !== null && x !== '' && cfNums(rule).texts.get(toStr(x).toLowerCase()) > 1; break;
      case 'top': { const s = cfNums(rule).sorted; hitR = typeof x === 'number' && s.length && x >= s[Math.max(0, s.length - rule.n)]; break; }
      case 'bottom': { const s = cfNums(rule).sorted; hitR = typeof x === 'number' && s.length && x <= s[Math.min(s.length - 1, rule.n - 1)]; break; }
      case 'aboveAvg': hitR = typeof x === 'number' && x > cfNums(rule).avg; break;
      case 'formula': { const f = shiftFormula(rule.f, r - rule.range.r1, c - rule.range.c1); let v; try { v = scalar(evalNode(parseFormula(f.slice(1)), {s: sh, r, c})); } catch (e) { v = false; } const t = truthy(v); hitR = t === true; break; }
      case 'scale': if (typeof x === 'number'){ const st = cfNums(rule), t = st.max > st.min ? (x - st.min) / (st.max - st.min) : 0.5;
          const [c1, c2, c3] = rule.colors; extra = {bg: c3 ? (t < 0.5 ? lerpColor(c1, c2, t * 2) : lerpColor(c2, c3, (t - 0.5) * 2)) : lerpColor(c1, c2, t)}; hitR = true; } break;
      case 'bar': if (typeof x === 'number'){ const st = cfNums(rule), lo = Math.min(0, st.min), hi = Math.max(st.max, lo + 1e-9); extra = {bar: {t: (x - lo) / (hi - lo), color: rule.color}}; hitR = true; } break;

}
// 그리기용 서식: 칸 서식 + 조건부 서식
function stShow(r, c){

function cfTarget(){

  if (fullCols(sel) || fullRows(sel)){ const {mr, mc} = usedMax(); return {r1: sel.r1, c1: sel.c1, r2: Math.min(sel.r2, Math.max(mr, sel.r1)), c2: Math.min(sel.c2, Math.max(mc, sel.c1))}; }

function cfFormulaAsk(){

// ===== 차트 =====
// 그림처럼 떠 있는 개체(sh.images 안에 kind: 'chart'). 데이터 범위가 바뀌면 바로 다시 그린다.
const CHART_COLORS = ['#2E5BD0', '#F28C28', '#2BA36B', '#D64545', '#8E5CD9', '#1BA3B8', '#C7A21B', '#6B7385'];
const CHART_TYPES = {col: '세로 막대', bar: '가로 막대', line: '꺾은선', pie: '원형'};
function chartData(ch){
  const R = ch.range, isNumAt = (r, c) => typeof cellValue(sh, r, c) === 'number';
  // 첫 열이 글자면 항목 이름, 첫 행이 글자면 계열 이름
  let firstColCat = false; for (let r = R.r1 + 1; r <= R.r2; r++){ const v = cellValue(sh, r, R.c1); if (v !== null && typeof v !== 'number'){ firstColCat = true; break; } }
  const dc1 = firstColCat ? R.c1 + 1 : R.c1;
  let header = false; for (let c = dc1; c <= R.c2; c++){ const v = cellValue(sh, R.r1, c); if (v !== null && typeof v !== 'number'){ header = true; break; } }
  if (!firstColCat && R.r2 > R.r1){ const v = cellValue(sh, R.r1, R.c1); if (header && v !== null && typeof v !== 'number') firstColCat = true; }
  const dr1 = header ? R.r1 + 1 : R.r1, cc1 = firstColCat ? R.c1 + 1 : R.c1;
  let cats = [], series = [];
  if (!ch.byRow){
    for (let r = dr1; r <= R.r2; r++) cats.push(firstColCat ? shown(r, R.c1) : String(r - dr1 + 1));
    for (let c = cc1; c <= R.c2; c++) series.push({name: header ? shown(R.r1, c) : `계열 ${c - cc1 + 1}`, values: range(dr1, R.r2).map(r => { const v = cellValue(sh, r, c); return typeof v === 'number' ? v : null; })});
  } else {
    for (let c = cc1; c <= R.c2; c++) cats.push(header ? shown(R.r1, c) : String(c - cc1 + 1));
    for (let r = dr1; r <= R.r2; r++) series.push({name: firstColCat ? shown(r, R.c1) : `계열 ${r - dr1 + 1}`, values: range(cc1, R.c2).map(c => { const v = cellValue(sh, r, c); return typeof v === 'number' ? v : null; })});
  }
  return {cats, series};
}
function niceScale(lo, hi, ticks){
  if (lo === hi){ hi = lo + 1; }
  const span = hi - lo, step0 = span / ticks, mag = Math.pow(10, Math.floor(Math.log10(step0))), f = step0 / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  return {lo: Math.floor(lo / step) * step, hi: Math.ceil(hi / step) * step, step};
}
const shortNum = x => { const a = Math.abs(x); return a >= 1e8 ? Number((x / 1e8).toPrecision(3)) + '억' : a >= 1e4 ? Number((x / 1e4).toPrecision(4)) + '만' : Number(x.toPrecision(6)).toLocaleString('en-US'); };
function drawChart(g, ch, R){
  const k = R.w / ch.w, F = (px, w) => `${w || 400} ${Math.max(8, px * k)}px "IBM Plex Sans KR", "Malgun Gothic", sans-serif`;
  g.save();

  g.fillStyle = '#fff'; g.fillRect(R.x, R.y, R.w, R.h);
  g.strokeStyle = '#D5DAE3'; g.lineWidth = 1; g.strokeRect(R.x + 0.5, R.y + 0.5, R.w - 1, R.h - 1);
  const {cats, series} = chartData(ch);
  const pad = 14 * k; let top = R.y + pad, left = R.x + pad, right = R.x + R.w - pad, bottom = R.y + R.h - pad;
  g.textBaseline = 'middle';
  if (ch.title){ g.fillStyle = '#1A2130'; g.font = F(15, 600); g.textAlign = 'center'; g.fillText(ch.title, R.x + R.w / 2, top + 9 * k); top += 26 * k; }
  if (!series.length || !cats.length){ g.fillStyle = '#6B7385'; g.font = F(12); g.textAlign = 'center'; g.fillText('차트로 그릴 숫자가 없습니다', R.x + R.w / 2, R.y + R.h / 2); g.restore(); return; }
  // 범례
  const legendItems = ch.type === 'pie' ? cats : series.map(s => s.name);
  if (legendItems.length > 1 || ch.type === 'pie'){
    g.font = F(11); g.textAlign = 'left';
    const iw = Math.min(140 * k, Math.max(...legendItems.map(t => g.measureText(String(t)).width)) + 22 * k);
    const lh = 18 * k, maxRows = Math.floor((bottom - top) / lh);
    legendItems.slice(0, maxRows).forEach((t, i) => {
      const y = top + i * lh + lh / 2; g.fillStyle = CHART_COLORS[i % CHART_COLORS.length]; g.fillRect(right - iw, y - 5 * k, 10 * k, 10 * k);
      g.fillStyle = '#3B4252'; g.fillText(String(t).slice(0, 14), right - iw + 15 * k, y);

  if (ch.type === 'pie'){

      const pct = v / total; if (pct > 0.04){ const am = (a0 + a1) / 2; g.fillStyle = '#fff'; g.font = F(11, 600); g.textAlign = 'center'; g.fillText(Math.round(pct * 100) + '%', cx + Math.cos(am) * rad * 0.62, cy + Math.sin(am) * rad * 0.62); }

  }
  const all = series.flatMap(s => s.values).filter(v => v != null);
  const sc = niceScale(Math.min(0, ...all), Math.max(0, ...all), 5);
  const horiz = ch.type === 'bar';
  g.font = F(10.5);
  const valW = Math.max(...range(0, Math.round((sc.hi - sc.lo) / sc.step)).map(i => g.measureText(shortNum(sc.lo + i * sc.step)).width));
  const catW = Math.min(110 * k, Math.max(...cats.map(t => g.measureText(String(t)).width)));
  if (horiz){ left += catW + 8 * k; bottom -= 16 * k; } else { left += valW + 8 * k; bottom -= 18 * k; }
  const n = Math.round((sc.hi - sc.lo) / sc.step);
  // 눈금과 가로(또는 세로) 보조선
  for (let i = 0; i <= n; i++){
    const v = sc.lo + i * sc.step, t = (v - sc.lo) / (sc.hi - sc.lo);

    g.fillStyle = '#6B7385'; g.font = F(10.5);
    if (horiz){ const x = Math.round(left + t * (right - left)) + 0.5; g.beginPath(); g.moveTo(x, top); g.lineTo(x, bottom); g.stroke(); g.textAlign = 'center'; g.fillText(shortNum(v), x, bottom + 9 * k); }
    else { const y = Math.round(bottom - t * (bottom - top)) + 0.5; g.beginPath(); g.moveTo(left, y); g.lineTo(right, y); g.stroke(); g.textAlign = 'right'; g.fillText(shortNum(v), left - 6 * k, y); }
  }

// ===== 쪽 미리보기 =====
// 시트 내용을 고른 종이 크기의 쪽으로 나눠 보여 준다. 글은 종이 폭에 맞춰 다시 줄 바꿈하고,

function applyMove(B, T, copy){
  const inR = (R, r, c) => r >= R.r1 && r <= R.r2 && c >= R.c1 && c <= R.c2;
  const keyRC = k => { const i = k.indexOf(':'); return [+k.slice(0,i), +k.slice(i+1)]; };
  let occupied = false;
  for (const k in sh.cells){
    const [r, c] = keyRC(k);
    if (inR(T, r, c) && sh.cells[k].v != null && (copy || !inR(B, r, c))){ occupied = true; break; }
  }
  const go = () => {
    const dr = T.r1 - B.r1, dc = T.c1 - B.c1;
    mutate(() => {
      const src = [];
      for (const k in sh.cells){ const [r, c] = keyRC(k); if (inR(B, r, c)) src.push([r, c, JSON.parse(JSON.stringify(sh.cells[k]))]); }
      const ms = sh.merges.filter(m => contains(B, m));
      if (!copy){ for (const [r, c] of src) delete sh.cells[r+':'+c]; sh.merges = sh.merges.filter(m => !contains(B, m)); }
      for (const k of Object.keys(sh.cells)){ const [r, c] = keyRC(k); if (inR(T, r, c)) delete sh.cells[k]; }
      sh.merges = sh.merges.filter(m => !inter(m, T));
      for (const [r, c, cell] of src) sh.cells[(r+dr)+':'+(c+dc)] = cell;
      for (const m of ms) sh.merges.push({r1:m.r1+dr, r2:m.r2+dr, c1:m.c1+dc, c2:m.c2+dc});
    });
    if (clip && !copy) clip = null;
    setRange(T, {r:act.r+dr, c:act.c+dc}); ensureVisible(T.r1, T.c1);
  };
  if (occupied) modal('내용 덮어쓰기', '<p>옮길 위치에 이미 내용이 있습니다. 덮어쓸까요? 실행 취소(Ctrl+Z)로 되돌릴 수 있습니다.</p>', '덮어쓰기', go);
  else go();
}

async function importXlsx(buf){

    if (ws.views && ws.views[0] && ws.views[0].state === 'frozen' && (ws.views[0].xSplit || ws.views[0].ySplit)) s.freeze = {r: ws.views[0].ySplit || 0, c: ws.views[0].xSplit || 0};
    for (let c = 1; c <= Math.min(ws.columnCount, COLS); c++){ const w = ws.getColumn(c).width; if (w) s.colW[c-1] = Math.round(w*7 + 5); }
    ws.eachRow({includeEmpty:true}, (row, rn) => {

      const [p, q] = a.split(':').map(parseRef); if (!p || !q) continue;
      const m = {r1:Math.min(p.r,q.r), r2:Math.max(p.r,q.r), c1:Math.min(p.c,q.c), c2:Math.max(p.c,q.c)};

}

const SET_KEY = 'monun.settings', MAX_BK = 30;

let lastBackupAt = Date.now(), lastBackupDone = 0;
// 웹 버전은 브라우저 안(IndexedDB)에, 프로그램은 디스크 백업 폴더에 보관
function idbOpen(){
  return new Promise((res, rej) => {
    const q = indexedDB.open('monun', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('backups', {keyPath:'id', autoIncrement:true});
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
async function idbDo(mode, fn){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('backups', mode), req = fn(tx.objectStore('backups'));
    tx.oncomplete = () => res(req ? req.result : undefined); tx.onerror = () => rej(tx.error);
  });
}
const backups = {
  async write(name, data){
    if (NATIVE) return NATIVE.backupWrite(name, data);
    await idbDo('readwrite', s => s.add({name: name.replace(/\.(monun|xlsx|json)$/i, ''), time: Date.now(), size: data.length, data}));
    for (const b of (await backups.list()).slice(MAX_BK)) await idbDo('readwrite', s => s.delete(b.id));
  },
  async list(){
    if (NATIVE) return NATIVE.backupList();
    const all = await idbDo('readonly', s => s.getAll()) || [];
    return all.map(({id, name, time, size}) => ({id, name, time, size})).sort((a, b) => b.time - a.time);
  },
  async read(id){ if (NATIVE) return NATIVE.backupRead(id); const r = await idbDo('readonly', s => s.get(id)); return r && r.data; }
};

function drawImages(){
  for (const im of (sh.images || [])){
    const R = imgRect(im);
    if (R.x > V.W || R.y > V.H || R.x + R.w < HW || R.y + R.h < HH) continue;
    if (im.kind === 'chart'){ drawChart(ctx, im, R); continue; }
    const el = imgEl(im.id);
    if (el.complete && el.naturalWidth) ctx.drawImage(el, R.x, R.y, R.w, R.h);
    else { ctx.fillStyle = '#EEF0F3'; ctx.fillRect(R.x, R.y, R.w, R.h); }
  }
}
function drawImageSelection(){
  const im = (sh.images || []).find(i => i.id === selImg); if (!im) return;
  const R = imgRect(im);
  ctx.strokeStyle = TH.sel; ctx.lineWidth = 1.5; ctx.setLineDash([]);
  ctx.strokeRect(R.x - 0.5, R.y - 0.5, R.w + 1, R.h + 1);
  for (const [x, y] of imgHandles(R)){ ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
}
// 누른 곳의 그림 (선택한 그림의 손잡이 먼저, 그다음 위에 있는 그림부터)
function imageAt(e){
  const b = cv.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
  if (x < HW || y < HH) return null;
  const tol = e.pointerType === 'touch' ? 16 : 7;
  const cur = (sh.images || []).find(i => i.id === selImg);
  if (cur){ const hs = imgHandles(imgRect(cur)); for (let k = 0; k < 4; k++) if (Math.hypot(x - hs[k][0], y - hs[k][1]) <= tol) return {im: cur, handle: k, x, y}; }
  for (let i = (sh.images || []).length - 1; i >= 0; i--){
    const im = sh.images[i], R = imgRect(im);
    if (x >= R.x && x <= R.x + R.w && y >= R.y && y <= R.y + R.h) return {im, x, y};
  }
  return null;
}
function imagePointerDown(e){
  if (e.button !== 0 && e.button !== 2 && e.pointerType !== 'touch') return false;
  const hit = imageAt(e);
  if (!hit){ if (selImg){ selImg = null; schedule(); } return false; }
  hideMenus(); if (editing) commitEdit();
  touchMode = e.pointerType === 'touch';
  selImg = hit.im.id; schedule();
  if (e.button === 2){ focusGrid(); openImageMenu(e.clientX, e.clientY); return true; }
  snap();
  const a = imgAbs(hit.im);
  drag = {mode: hit.handle != null ? 'imgresize' : 'imgmove', im: hit.im, k: hit.handle, sx: hit.x, sy: hit.y, ox: a.x, oy: a.y, ow: hit.im.w, oh: hit.im.h, moved: false};
  if (e.pointerType === 'touch') touches.set(e.pointerId, {x: e.clientX, y: e.clientY});
  cv.setPointerCapture(e.pointerId);
  focusGrid();
  return true;
}
function imageDragMove(e){
  const b = cv.getBoundingClientRect(), z = sh.zoom;
  const dx = (e.clientX - b.left - drag.sx) / z, dy = (e.clientY - b.top - drag.sy) / z;
  if (!drag.moved && Math.hypot(dx, dy) * z < 3) return;
  drag.moved = true;
  const im = drag.im;
  if (drag.mode === 'imgmove'){ reanchor(im, drag.ox + dx, drag.oy + dy); setStatus('그림 옮기는 중'); }
  else {
    // 모서리를 끌면 가로세로 비율 유지 (Shift를 누르면 자유롭게)
    const k = drag.k, left = k === 0 || k === 2, top = k === 0 || k === 1;
    let w = Math.max(12, drag.ow + (left ? -dx : dx)), hh = Math.max(12, drag.oh + (top ? -dy : dy));
    if (!e.shiftKey && im.kind !== 'chart'){ const s = Math.max(w / drag.ow, hh / drag.oh); w = Math.max(12, drag.ow * s); hh = Math.max(12, drag.oh * s); }
    im.w = Math.round(w); im.h = Math.round(hh);
    reanchor(im, left ? drag.ox + drag.ow - im.w : drag.ox, top ? drag.oy + drag.oh - im.h : drag.oy);
    setStatus(`그림 크기 ${im.w} × ${im.h}px`);
  }
  schedule();
}
function deleteImage(id){
  if (!id) return;
  mutate(() => { sh.images = sh.images.filter(i => i.id !== id); });
  selImg = null; schedule(); toast('지웠습니다 · Ctrl+Z로 되돌릴 수 있어요');
}
function nudgeImage(k, n){
  const im = sh.images.find(i => i.id === selImg); if (!im) return;
  const a = imgAbs(im), d = {ArrowUp:[0,-n], ArrowDown:[0,n], ArrowLeft:[-n,0], ArrowRight:[n,0]}[k];
  mutate(() => reanchor(im, a.x + d[0], a.y + d[1]));
}
function openImageMenu(x, y){
  const im = sh.images.find(i => i.id === selImg); if (!im) return;
  const idx = () => sh.images.findIndex(i => i.id === im.id);
  if (im.kind === 'chart') return showMenu(x, y, [
    {label: '차트 편집…', run: () => editChart(im)},
    {label: '차트 지우기', kbd: 'Delete', run: () => deleteImage(im.id)},
    '-',
    {label: '맨 앞으로 가져오기', run: () => mutate(() => sh.images.push(sh.images.splice(idx(), 1)[0]))},
    {label: '맨 뒤로 보내기', run: () => mutate(() => sh.images.unshift(sh.images.splice(idx(), 1)[0]))},
  ]);
  showMenu(x, y, [
    {label:'그림 지우기', kbd:'Delete', run: () => deleteImage(im.id)},
    {label:'원래 크기로', run: () => { const el = imgEl(im.id); if (el.naturalWidth) mutate(() => { im.w = el.naturalWidth; im.h = el.naturalHeight; }); }},
    '-',
    {label:'맨 앞으로 가져오기', run: () => mutate(() => sh.images.push(sh.images.splice(idx(), 1)[0]))},
    {label:'맨 뒤로 보내기', run: () => mutate(() => sh.images.unshift(sh.images.splice(idx(), 1)[0]))},
  ]);
}
// 그림 파일 → 너무 크면 줄여서(긴 쪽 1600px) 저장. 투명한 그림(png 등)은 png로, 사진은 jpg로
async function fileToImage(blob){
  const url = URL.createObjectURL(blob);
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
    const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
    const keepPng = /png|gif|webp|svg|bmp/.test(blob.type);
    let src = c.toDataURL(keepPng ? 'image/png' : 'image/jpeg', 0.9);
    if (keepPng && src.length > 2.5e6) src = c.toDataURL('image/jpeg', 0.88);
    return {src, w, h};
  } finally { URL.revokeObjectURL(url); }
}
async function insertImage(blob, at){
  if (editing) commitEdit();
  let im;
  try { im = await fileToImage(blob); } catch (e){ toast('그림을 읽을 수 없습니다'); return; }
  const id = 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  wb.media = wb.media || {}; wb.media[id] = im.src;
  const k = Math.min(1, 480 / im.w, 360 / im.h);
  const pic = {id, r: act.r, c: act.c, dx: 0, dy: 0, w: Math.round(im.w * k), h: Math.round(im.h * k)};
  if (at) reanchor(pic, at.x, at.y);
  mutate(() => { sh.images = sh.images || []; sh.images.push(pic); });
  selImg = id; schedule();
  toast('그림을 넣었습니다 · 끌어서 옮기고, 모서리로 크기를 바꾸세요');
}
$('#imgIn').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) insertImage(f, null); });
// 엑셀 파일 속 그림 가져오기
function u8ToB64(u8){
  let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
function importImages(X, ws, s, media){
  const colPx = c => s.colW[c] ?? DEF_W, rowPx = r => s.rowH[r] ?? DEF_H;
  const span = (from, fromOff, to, toOff, size) => { let v = -fromOff; for (let i = from; i < to; i++) v += size(i); return v + toOff; };
  for (const pic of ws.getImages()){
    const m = X.getImage(Number(pic.imageId)); if (!m) continue;
    const ext = m.extension === 'jpg' ? 'jpeg' : (m.extension || 'png');
    let src = m.base64 || '';
    if (!src && m.buffer) src = u8ToB64(m.buffer instanceof Uint8Array ? m.buffer : new Uint8Array(m.buffer));
    if (!src) continue;
    if (!src.startsWith('data:')) src = 'data:image/' + ext + ';base64,' + src;
    const tl = pic.range.tl, c = Math.floor(tl.nativeCol ?? tl.col), r = Math.floor(tl.nativeRow ?? tl.row);
    if (c >= COLS || r >= ROWS) continue;
    const dx = (tl.nativeColOff || 0) / 9525, dy = (tl.nativeRowOff || 0) / 9525;
    let w = 200, hh = 150;
    if (pic.range.ext && pic.range.ext.width){ w = pic.range.ext.width; hh = pic.range.ext.height; }
    else if (pic.range.br){
      const br = pic.range.br;
      w = span(c, dx, Math.floor(br.nativeCol ?? br.col), (br.nativeColOff || 0) / 9525, colPx);
      hh = span(r, dy, Math.floor(br.nativeRow ?? br.row), (br.nativeRowOff || 0) / 9525, rowPx);
    }
    const id = 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    media[id] = src;
    s.images.push({id, r, c, dx, dy, w: Math.max(12, Math.round(w)), h: Math.max(12, Math.round(hh))});
  }
}

// ===== 예시 시트 =====
function sample(){
  const s = newSheet('10월 업무표');
  s.colW = {0:44, 1:92, 2:250, 3:78, 4:78, 5:96, 7:120};
  const put = (r, c, v, sty) => { const o = {}; if (v !== '' && v != null) o.v = String(v); if (sty) o.s = sty; s.cells[r+':'+c] = o; };
  const ink = '#1F3B7A', thin = {w:1, s:'solid', c:'#A9B4C8'}, thick = {w:2, s:'solid', c:ink};
  put(0, 0, '마케팅팀 10월 둘째 주 업무표', {b:true, fs:18, ha:'center', va:'middle', fc:ink, ff:'Noto Sans KR'});
  s.merges.push({r1:0, c1:0, r2:0, c2:5}); s.rowH[0] = s.rowManual[0] = 44;
  put(1, 0, '2026-10-05 ~ 2026-10-09 · 예시로 넣어 둔 시트입니다. 위쪽 [새로 만들기]를 누르면 빈 시트로 시작합니다.', {fc:'#6B7385', fs:9, wrap:false});
  ['No','담당','업무','시작','마감','상태'].forEach((h, c) => put(3, c, h, {b:true, bg:ink, fc:'#FFFFFF', ha:'center', va:'middle', bt:thick, bb:thin, bl:c === 0 ? thick : thin, br:c === 5 ? thick : thin}));
  s.rowH[3] = s.rowManual[3] = 28;
  const rows = [['1','김하늘','가을 캠페인 배너 시안 3종','10-05','10-06','완료'],['2','이도윤','인스타그램 릴스 촬영 일정 조율과 장소 섭외, 소품 목록 정리','10-05','10-08','진행 중'],['3','박서연','뉴스레터 10월호 원고','10-06','10-07','완료'],['4','최민준','고객 설문 결과 정리','10-07','10-09','대기'],['5','정유나','11월 프로모션 기획안 초안','10-08','10-09','진행 중']];
  const tone = {'완료':['#E2F0D9','#2E6B1F'], '진행 중':['#FFF2CC','#8A6100'], '대기':['#EDEFF3','#59606E']};
  rows.forEach((row, i) => { const r = 4 + i; row.forEach((v, c) => {
    const sty = {va:'middle', bt:thin, bb: i === rows.length-1 ? thick : thin, bl: c === 0 ? thick : thin, br: c === 5 ? thick : thin};
    if (c === 0 || c >= 3) sty.ha = 'center';
    if (c === 2) sty.wrap = true;
    if (i % 2 === 1) sty.bg = '#F4F6FA';
    if (c === 5){ sty.bg = tone[v][0]; sty.fc = tone[v][1]; sty.b = true; }
    put(r, c, v, sty);
  }); });
  put(10, 1, '메모', {b:true, fc:ink});
  put(11, 1, '줄 바꿈을 끈 칸의 긴 글은 이렇게 오른쪽 빈칸으로 이어져 보입니다. 옆 칸에 내용을 넣으면 그 앞에서 잘립니다.', {fc:'#3B4252', wrap:false});
  put(13, 1, '채우기 연습', {b:true, fc:ink});
  put(14, 1, '아래 칸을 선택하고 오른쪽 아래 작은 점을 끌어 보세요', {fc:'#6B7385', fs:9, wrap:false});
  const fs = {ha:'center', va:'middle', bg:'#DCE5FA', bt:thin, bb:thin, bl:thin, br:thin};
  put(15, 1, '항목1', fs); put(15, 2, '월요일', fs); put(15, 3, '1월', fs); put(15, 4, '2026-10-05', fs); put(15, 5, '1분기', fs);
  return {sheets:[s], active:0};
}

// ===== 시작 =====
readTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTheme(); schedule(); });
new MutationObserver(() => { readTheme(); schedule(); }).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
$('#gf').addEventListener('load', () => { fontReq.clear(); SHIFT.clear(); schedule(); });
if (document.fonts) document.fonts.addEventListener('loadingdone', () => { SHIFT.clear(); if (sh){ autoRows(); layout(); schedule(); } });
$('#fcBar').style.background = pens.fc; $('#bgBar').style.background = pens.bg;
$('#tbBorder').innerHTML = borderIcon(lastBorder);

let started = false;
try { started = !!localStorage.getItem('monun.started'); localStorage.setItem('monun.started', '1'); } catch (e) {}
const saved = readSession();
let recovered = false;
if (saved && saved.wb && Array.isArray(saved.wb.sheets)){
  loadWorkbook(saved.wb); fileName = saved.fileName || '제목 없음'; fileDirty = !!saved.fileDirty;
  if (NATIVE) filePath = saved.filePath || null;
  recovered = saved.clean === false && fileDirty;
} else loadWorkbook(started ? {sheets:[newSheet('Sheet1')], active:0} : sample());
updateDoc(); updateBk();
setupWebApp();
// 폰(안드로이드·아이폰)은 .monun 같은 낯선 확장자를 파일 고르기에서 흐리게 막아서 제한을 푼다
if (isIOS || touchDevice()) $('#fileIn').removeAttribute('accept');
takeSharedFile();
if (touchDevice()) touchMode = true;
focusGrid();
if (recovered){ toast('지난번에 저장하지 못하고 꺼진 작업을 복구했습니다'); changedSinceBackup = true; doBackup(false); }
const flushAutosave = () => { clearTimeout(asT); writeSession(true); };
window.addEventListener('beforeunload', flushAutosave);
document.addEventListener('visibilitychange', () => { if (document.hidden) writeSession(false); });
if (NATIVE){
  NATIVE.onOpenFile(f => openData(f.name, f.data, {path: f.path}));
  NATIVE.onSaveThenClose(async () => { if (await saveFile(false)){ flushAutosave(); NATIVE.closeNow(); } });
  NATIVE.onDiscardThenClose(async () => {
    if (changedSinceBackup) await doBackup(false);   // 저장 안 하고 닫아도 백업에는 남김
    noAutosave = true; clearTimeout(asT); clearSession(); NATIVE.closeNow();
  });
}
})();
